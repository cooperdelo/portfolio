<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>Contacts · CD Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Geist+Mono:wght@300..700&family=Geist:wght@300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/admin/_shell/admin-shell.css" />
<style>
/* Contacts — mirrors Playbook architecture exactly. Glass cards, single rust accent, no icons. */

/* Alert strips (Due This Week + Going Cold) */
.alerts{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin:0 0 1.6rem}
@media (max-width:760px){ .alerts{grid-template-columns:1fr} }
.alert{background:rgba(244,239,230,.035);border:1px solid rgba(244,239,230,.1);border-radius:14px;padding:1.05rem 1.25rem;transition:border-color .18s}
.alert.due{border-color:rgba(255,77,46,.35)}
.alert.cold{border-color:rgba(200,16,46,.32)}
.alert .head{display:flex;align-items:baseline;gap:.6rem;margin-bottom:.65rem}
.alert .head .lbl{font-family:"Geist Mono",monospace;font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.alert .head .n{font-family:"Anton",Impact,sans-serif;font-size:1.5rem;line-height:.95;color:var(--ink)}
.alert.due .head .n{color:var(--rust)}
.alert.cold .head .n{color:var(--crimson)}
.alert .head .v{font-family:"Geist",sans-serif;font-size:.78rem;color:var(--ink-2);margin-left:auto}
.alert .row{display:flex;justify-content:space-between;align-items:center;padding:.55rem .25rem;border-top:1px solid rgba(244,239,230,.06);cursor:pointer;transition:background .15s}
.alert .row:hover{background:rgba(244,239,230,.03)}
.alert .row:first-of-type{border-top:0}
.alert .row .who{font-family:"Geist",sans-serif;font-weight:500;font-size:.92rem;color:var(--ink);line-height:1.25}
.alert .row .who small{display:block;font-family:"Geist Mono",monospace;font-size:.55rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:.22rem}
.alert .row .when{font-family:"Geist Mono",monospace;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);white-space:nowrap;margin-left:1rem}
.alert.due .row .when.overdue{color:var(--rust)}
.alert.cold .row .when{color:#ff8a8a}
.alert .empty{font-family:"Geist Mono",monospace;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:.7rem .25rem 0}

/* Toolbar (filters + search) */
.toolbar{display:flex;flex-direction:column;gap:1rem;margin:0 0 1.6rem}
.toolbar .row{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center}
.toolbar .row .lbl{font-family:"Geist Mono",monospace;font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-right:.4rem;align-self:center}
.toolbar input[type="search"]{flex:1;min-width:200px;background:rgba(244,239,230,.04);border:1px solid rgba(244,239,230,.12);border-radius:10px;padding:.7rem .9rem;color:var(--ink);font-family:"Geist",sans-serif;font-size:.92rem;outline:none;transition:border-color .15s}
.toolbar input[type="search"]:focus{border-color:var(--rust)}
.pill{font-family:"Geist Mono",monospace;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;padding:.5rem .8rem;border-radius:999px;background:rgba(244,239,230,.04);border:1px solid rgba(244,239,230,.1);color:var(--ink-2);cursor:pointer;transition:all .15s;white-space:nowrap}
.pill:hover{border-color:rgba(244,239,230,.25);color:var(--ink)}
.pill.on{background:var(--rust);border-color:var(--rust);color:var(--bg)}
.pill .n{margin-left:.4rem;opacity:.6;font-size:.55rem}
.pill.on .n{opacity:.85}
.sort-sel{font-family:"Geist Mono",monospace;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;padding:.5rem .8rem;border-radius:999px;background:rgba(244,239,230,.04);border:1px solid rgba(244,239,230,.1);color:var(--ink-2);cursor:pointer;-webkit-appearance:none;appearance:none;color-scheme:dark;outline:none}
.sort-sel:focus{border-color:var(--rust)}
.sort-sel option{background:#14110F;color:var(--ink)}

/* Contact card list */
.ct-list{display:grid;gap:.75rem}
.ct-card{position:relative;background:rgba(244,239,230,.035);border:1px solid rgba(244,239,230,.1);border-radius:14px;padding:1.05rem 1.3rem;cursor:pointer;transition:border-color .18s,background .18s}
.ct-card:hover{border-color:var(--rust);background:rgba(244,239,230,.05)}
.ct-card.pinned{border-color:rgba(255,77,46,.45);background:rgba(255,77,46,.03)}
.ct-card .card-edit{position:absolute;top:.85rem;right:.95rem;font-family:"Geist Mono",monospace;font-size:.52rem;letter-spacing:.22em;text-transform:uppercase;padding:.4rem .7rem;border-radius:6px;background:rgba(244,239,230,.05);border:1px solid rgba(244,239,230,.1);color:var(--muted);cursor:pointer;transition:all .15s;opacity:0}
.ct-card:hover .card-edit{opacity:1}
.ct-card .card-edit:hover{background:var(--rust);border-color:var(--rust);color:var(--bg);opacity:1}
.ct-card .meta-row{display:flex;flex-wrap:wrap;gap:.42rem;align-items:center;margin-bottom:.55rem;padding-right:4.5rem}
.ct-card .badge{font-family:"Geist Mono",monospace;font-size:.55rem;letter-spacing:.22em;text-transform:uppercase;padding:.28rem .55rem;border-radius:4px;background:rgba(244,239,230,.06);color:var(--ink-2);line-height:1}
.ct-card .badge.stage-identified{background:rgba(244,239,230,.06);color:var(--ink-2)}
.ct-card .badge.stage-engaged{background:rgba(178,227,225,.18);color:var(--pastel-cyan)}
.ct-card .badge.stage-contacted{background:rgba(255,77,46,.16);color:var(--rust)}
.ct-card .badge.stage-demo{background:rgba(201,190,230,.18);color:var(--pastel-lavender)}
.ct-card .badge.stage-committed{background:rgba(122,138,110,.22);color:var(--sage)}
.ct-card .badge.stage-dead{background:rgba(244,239,230,.04);color:var(--muted)}
.ct-card .badge.stage-team{background:rgba(242,193,209,.18);color:var(--pastel-pink)}
.ct-card .badge.type{background:rgba(244,239,230,.05);color:var(--ink-2);letter-spacing:.18em}
.ct-card .badge.pin{background:rgba(255,77,46,.22);color:var(--rust)}
.ct-card .badge.owed{background:rgba(255,77,46,.18);color:var(--rust)}
.ct-card h3{font-family:"Geist",sans-serif;font-weight:600;font-size:1.05rem;line-height:1.3;color:var(--ink);letter-spacing:-.005em;margin:0 0 .25rem;padding-right:4.5rem}
.ct-card h3 .pref{font-weight:400;color:var(--ink-2);font-size:.85rem;margin-left:.4rem}
.ct-card .where{font-family:"Geist",sans-serif;font-size:.85rem;color:var(--ink-2);margin:0 0 .45rem}
.ct-card .where strong{color:var(--ink);font-weight:500}
.ct-card .next{font-family:"Geist",sans-serif;font-size:.84rem;color:var(--ink-2);line-height:1.45;margin:.4rem 0 0;padding:.55rem .75rem;background:rgba(244,239,230,.03);border-left:2px solid var(--rust);border-radius:0 8px 8px 0}
.ct-card .next .when{font-family:"Geist Mono",monospace;font-size:.55rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-right:.55rem}
.ct-card .next .when.overdue{color:var(--rust)}
.ct-card .footline{font-family:"Geist Mono",monospace;font-size:.55rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:.6rem;display:flex;flex-wrap:wrap;gap:.8rem}
.ct-card .footline .v{color:var(--ink-2)}

.ct-empty{padding:2.8rem 1.5rem;text-align:center;color:var(--muted);font-family:"Geist Mono",monospace;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;line-height:1.7}

/* Drawer/sheet (matches playbook) */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:90;opacity:0;pointer-events:none;transition:opacity .35s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%) translateY(100%);width:100%;max-width:640px;background:rgba(20,17,15,.92);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border-top-left-radius:22px;border-top-right-radius:22px;border:1px solid rgba(244,239,230,.14);border-bottom:none;padding:1.5rem 1.7rem calc(1.8rem + env(safe-area-inset-bottom));z-index:95;max-height:92dvh;overflow-y:auto;transition:transform .42s cubic-bezier(.22,1,.36,1)}
.sheet.on{transform:translateX(-50%) translateY(0)}
.sheet-grip{width:42px;height:4px;border-radius:2px;background:rgba(244,239,230,.18);margin:-.2rem auto 1.2rem}
.sheet h2{font-family:"Geist",sans-serif;font-weight:600;font-size:1.3rem;line-height:1.1;letter-spacing:-.01em;margin:0 0 .35rem;color:var(--ink)}
.sheet .sub{font-family:"Geist",sans-serif;font-size:.9rem;color:var(--ink-2);margin:0 0 1.25rem}
.sheet .field{margin-bottom:.9rem}
.sheet .field > label{display:block;font-family:"Geist Mono",monospace;font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:.45rem}
.sheet .field input,.sheet .field select,.sheet .field textarea{width:100%;background:rgba(244,239,230,.04);border:1px solid rgba(244,239,230,.12);border-radius:10px;padding:.8rem .95rem;color:var(--ink);font-family:"Geist",sans-serif;font-size:.95rem;outline:none;transition:border-color .15s;-webkit-appearance:none;appearance:none;color-scheme:dark}
.sheet .field input:focus,.sheet .field select:focus,.sheet .field textarea:focus{border-color:var(--rust)}
.sheet .field textarea{resize:vertical;min-height:5rem;font-family:"Geist Mono",monospace;font-size:.86rem;line-height:1.55}
.sheet .field select option{background:#14110F;color:var(--ink)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.55rem}
@media (max-width:520px){ .grid-3{grid-template-columns:1fr 1fr} }
.toggle-row{display:flex;align-items:center;gap:.6rem;font-family:"Geist Mono",monospace;font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-2);padding:.7rem .95rem;background:rgba(244,239,230,.04);border:1px solid rgba(244,239,230,.12);border-radius:10px;cursor:pointer;transition:border-color .15s}
.toggle-row:hover{border-color:rgba(244,239,230,.25)}
.toggle-row input{accent-color:var(--rust);width:1.05rem;height:1.05rem}
.btn-rust{display:block;width:100%;padding:1rem;border-radius:12px;background:var(--rust);border:none;color:var(--bg);font-family:"Geist Mono",monospace;font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;font-weight:500;cursor:pointer;margin-top:.5rem;transition:background .2s}
.btn-rust:hover{background:#ff6648}
.btn-ghost{display:block;width:100%;padding:.9rem;border-radius:12px;background:transparent;border:1px solid rgba(244,239,230,.12);color:var(--ink-2);font-family:"Geist Mono",monospace;font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;margin-top:.4rem;transition:all .2s}
.btn-ghost:hover{border-color:rgba(244,239,230,.25);color:var(--ink)}
.btn-danger{display:block;width:100%;padding:.9rem;border-radius:12px;background:transparent;border:1px solid rgba(200,16,46,.5);color:var(--crimson);font-family:"Geist Mono",monospace;font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;margin-top:.4rem;transition:all .2s}
.btn-danger:hover{background:var(--crimson);color:var(--ink);border-color:var(--crimson)}
.hint{font-family:"Geist Mono",monospace;font-size:.55rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:.35rem;opacity:.75}

/* Drawer (read-only contact view) */
.ct-view .meta-row{display:flex;flex-wrap:wrap;gap:.42rem;margin-bottom:1rem}
.ct-view .vname{font-family:"Geist",sans-serif;font-weight:600;font-size:1.5rem;line-height:1.15;color:var(--ink);margin:0 0 .35rem}
.ct-view .vrole{font-family:"Geist",sans-serif;font-size:.95rem;color:var(--ink-2);margin:0 0 .5rem}
.ct-view .vrole strong{color:var(--ink);font-weight:500}
.ct-view .vwarm{font-family:"Geist Mono",monospace;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0 0 1.1rem}
.ct-view .vwarm .v{color:var(--ink-2)}

/* Inline pipeline editor (in drawer) */
.pipe-edit{background:rgba(244,239,230,.04);border:1px solid rgba(244,239,230,.1);border-radius:12px;padding:.85rem 1rem;margin:0 0 1rem}
.pipe-edit .pe-lbl{font-family:"Geist Mono",monospace;font-size:.56rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:.55rem}
.pipe-edit .pe-row{display:flex;flex-wrap:wrap;gap:.32rem}
.pipe-edit .pe-row .pill{font-size:.52rem;padding:.42rem .65rem}

/* Contact cards (copy chips) */
.copy-grid{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin:0 0 1rem}
@media (max-width:520px){ .copy-grid{grid-template-columns:1fr} }
.copy-chip{display:flex;flex-direction:column;align-items:flex-start;gap:.25rem;padding:.7rem .85rem;background:rgba(244,239,230,.04);border:1px solid rgba(244,239,230,.1);border-radius:10px;cursor:pointer;transition:all .15s;text-align:left}
.copy-chip:hover{border-color:var(--rust);background:rgba(255,77,46,.06)}
.copy-chip .lbl{font-family:"Geist Mono",monospace;font-size:.5rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.copy-chip .val{font-family:"Geist Mono",monospace;font-size:.78rem;color:var(--ink);word-break:break-all;line-height:1.3}
.copy-chip.copied{border-color:var(--sage);background:rgba(122,138,110,.1)}
.copy-chip.copied .lbl{color:var(--sage)}

.activity-line{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin:0 0 1rem}
.activity-line .ax{padding:.7rem .9rem;background:rgba(244,239,230,.04);border:1px solid rgba(244,239,230,.1);border-radius:10px}
.activity-line .ax .lbl{font-family:"Geist Mono",monospace;font-size:.52rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.activity-line .ax .val{font-family:"Geist",sans-serif;font-size:.92rem;color:var(--ink);margin-top:.25rem}
.activity-line .ax .val.muted{color:var(--ink-2);font-size:.82rem}
.activity-line .ax .val.warn{color:var(--rust)}

.next-block{padding:.85rem 1rem;background:rgba(255,77,46,.05);border:1px solid rgba(255,77,46,.25);border-radius:12px;margin:0 0 1rem}
.next-block .lbl{font-family:"Geist Mono",monospace;font-size:.56rem;letter-spacing:.22em;text-transform:uppercase;color:var(--rust);margin-bottom:.4rem}
.next-block .val{font-family:"Geist",sans-serif;font-size:.95rem;color:var(--ink);line-height:1.5}
.next-block .due{font-family:"Geist Mono",monospace;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--rust);margin-top:.35rem}

.tags-row{display:flex;flex-wrap:wrap;gap:.3rem;margin:0 0 1rem}
.tag{font-family:"Geist Mono",monospace;font-size:.54rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:.22rem .5rem;border-radius:999px;background:rgba(244,239,230,.04);border:1px solid rgba(244,239,230,.07)}

.notes-block{font-family:"Geist",sans-serif;font-size:.92rem;line-height:1.6;color:var(--ink-2);white-space:pre-wrap;padding:.85rem 1rem;background:rgba(244,239,230,.025);border:1px solid rgba(244,239,230,.08);border-radius:12px;margin:0 0 1.2rem}

.action-bar{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin-top:1.2rem}
@media (max-width:520px){ .action-bar{grid-template-columns:1fr} }

@media (max-width:680px){
  .toolbar input[type="search"]{min-width:0;width:100%}
  .ct-card{padding:1rem 1.1rem}
  .ct-card h3{font-size:1rem}
  .ct-card .meta-row{padding-right:0}
  .ct-card h3{padding-right:3.6rem}
}
</style>
</head>
<body>
  <main>
    <div class="page-head">
      <div>
        <div class="eyebrow">Pipeline · Network · Outreach</div>
        <h1>CON<span class="accent">tacts</span></h1>
      </div>
      <div class="actions">
        <span class="live-dot" id="live-indicator">Live syncing</span>
        <button class="btn primary" data-action="new-contact">+ New contact</button>
      </div>
    </div>

    <div class="alerts" id="alerts">
      <div class="alert due">
        <div class="head"><span class="lbl">Due this week</span><span class="n" id="due-n">—</span><span class="v" id="due-cap">Next 3 days</span></div>
        <div id="due-list"></div>
      </div>
      <div class="alert cold">
        <div class="head"><span class="lbl">Going cold</span><span class="n" id="cold-n">—</span><span class="v" id="cold-cap">14+ days no contact</span></div>
        <div id="cold-list"></div>
      </div>
    </div>

    <div class="kpi-grid">
      <div class="card"><div class="label">Active contacts</div><div class="value" id="k-total">—</div><div class="delta flat">In the vault</div></div>
      <div class="card"><div class="label">Pinned</div><div class="value" id="k-pinned">—</div><div class="delta flat">Top of mind</div></div>
      <div class="card"><div class="label">In pipeline</div><div class="value" id="k-pipe">—</div><div class="delta flat">Engaged through demo</div></div>
      <div class="card"><div class="label">Owed</div><div class="value" id="k-owed">—</div><div class="delta flat">Referral payouts</div></div>
    </div>

    <div class="toolbar">
      <div class="row" id="stage-row">
        <span class="lbl">Stage</span>
        <button class="pill on" data-filter="stage" data-v="all">All</button>
      </div>
      <div class="row" id="type-row">
        <span class="lbl">Type</span>
        <button class="pill on" data-filter="type" data-v="all">All</button>
      </div>
      <div class="row" id="college-row">
        <span class="lbl">College</span>
        <button class="pill on" data-filter="college" data-v="all">All</button>
      </div>
      <div class="row">
        <input type="search" id="q" placeholder="Search name, org, role, notes, tags…" autocomplete="off" />
        <select class="sort-sel" id="sort">
          <option value="due">Sort: due soonest</option>
          <option value="recent">Sort: recently contacted</option>
          <option value="stale">Sort: most stale</option>
          <option value="priority">Sort: priority</option>
          <option value="name">Sort: name A→Z</option>
          <option value="org">Sort: org A→Z</option>
        </select>
        <button class="pill" data-filter="pinned" data-v="on">Pinned only</button>
      </div>
    </div>

    <h2 class="section-h">Contacts <span class="accent" id="ax-count">—</span></h2>
    <div class="ct-list" id="ct-list"></div>
  </main>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-grip"></div>
    <div id="sheet-body"></div>
  </div>

  <script type="module" src="/admin/contacts/_js/contacts.js"></script>
</body>
</html>
