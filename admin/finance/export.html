<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="theme-color" content="#0C0B0A" />
<title>Export · CD Admin</title>
<link rel="stylesheet" href="/admin/_shell/admin-shell.css" />
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <main>
    <header class="page-head"><h1>Export</h1></header>

    <section class="grid">
      <div class="sv-card pad-lg span-7">
        <div class="sv-h"><h2>Cooper_Delo_Finances.xlsx</h2><span class="mono" id="status">Ready</span></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
          <button class="btn primary" id="dl-all">Download XLSX</button>
          <button class="btn" id="dl-food">Food log CSV</button>
          <button class="btn" id="dl-tax">Tax deductibles CSV</button>
        </div>
      </div>
      <div class="sv-card span-5">
        <div class="sv-h"><h2>Tabs</h2><span class="mono">7</span></div>
        <div class="rows">
          <div class="row"><div class="grow"><div class="t">All Transactions</div></div><span class="mono">every row</span></div>
          <div class="row"><div class="grow"><div class="t">Plugverse Ledger</div></div><span class="mono">plugverse</span></div>
          <div class="row"><div class="grow"><div class="t">1789 Fund</div></div><span class="mono">running balance</span></div>
          <div class="row"><div class="grow"><div class="t">Monthly Food Log</div></div><span class="mono">food flag</span></div>
          <div class="row"><div class="grow"><div class="t">Personal Spending</div></div><span class="mono">personal</span></div>
          <div class="row"><div class="grow"><div class="t">Tax Prep</div></div><span class="mono">by year</span></div>
          <div class="row"><div class="grow"><div class="t">Business Travel &amp; Meals</div></div><span class="mono">travel · meal</span></div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/admin/finance/_js/export.js"></script>
</body>
</html>
