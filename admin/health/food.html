<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<link rel="manifest" href="/admin/health/manifest.json" />
<link rel="apple-touch-icon" href="/favicon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Health" />
<meta name="theme-color" content="#0C0B0A" />
<title>Food Log · CD Admin</title>
<link rel="preload" href="/admin/_shell/fonts/DrukWideBold.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/admin/_shell/admin-shell.css" />
<style>
  /* v7: capture left, the day's plates right. Ids unchanged for food.js. */
  .fd-grid { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: 14px; align-items: start; }
  @media (max-width: 1000px) { .fd-grid { grid-template-columns: minmax(0, 1fr); } }
  .fd .card > h2 { display: flex; align-items: baseline; gap: 10px; margin: 0 0 16px; font-family: var(--f-ui); font-weight: 700; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--text); }
  .datenav { display: flex; align-items: center; gap: 6px; }
  .datenav button { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line-2); background: rgba(244, 241, 234, .05); color: var(--text); font-size: 18px; line-height: 1; display: grid; place-items: center; transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
  .datenav button:hover:not(:disabled) { background: var(--bone); color: var(--ink-0); }
  .datenav button:disabled { opacity: .3; cursor: default; }
  .datenav input[type=date] { width: 150px; min-height: 38px; border-radius: 999px; padding: 6px 14px; }
  .datenav .today-btn { width: auto; padding: 0 14px; border-radius: 999px; font-weight: 700; font-size: 12px; }
  .drop { position: relative; display: grid; place-items: center; min-height: 200px; border-radius: 20px; border: 1px dashed rgba(244, 241, 234, .28); overflow: hidden; cursor: pointer; color: var(--text-2); font-weight: 700; font-size: 13px; transition: border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease); }
  .drop:hover { border-color: var(--bone); background: var(--fill); }
  .drop.hasimg { border-style: solid; border-color: var(--line-2); }
  #preview { display: none; width: 100%; max-height: 320px; object-fit: cover; }
  .drop.hasimg #drop-text { position: absolute; left: 12px; bottom: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(12, 11, 10, .6); font-family: var(--f-mono); font-weight: 400; font-size: 10px; }
  .fd .field { margin-top: 12px; }
  .fd .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .entry { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; }
  .entry:first-child { border-top: 0; }
  .entry img, .entry .ph { width: 52px; height: 52px; object-fit: cover; border-radius: 12px; flex: 0 0 auto; background: rgba(244, 241, 234, .06); }
  .entry .bd { flex: 1 1 auto; min-width: 0; }
  .entry .bd .hd { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .entry .bd b { font-size: 13.5px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .macros { font-family: var(--f-mono); font-size: 10px; text-transform: uppercase; color: var(--text-3); margin-top: 3px; }
  .pill.analyzed { background: rgba(244, 241, 234, .12); color: var(--text); }
  .pill.pending, .pill.manual { background: transparent; color: var(--text-3); box-shadow: inset 0 0 0 1px var(--line-2); }
  .fd .empty-line { font-size: 12.5px; color: var(--text-3); }
</style>
</head>
<body class="fd">
  <main>
    <div class="page-head">
      <div><h1>Food log</h1></div>
      <div class="actions">
        <div class="datenav">
          <button id="d-prev" aria-label="Previous day">&#8249;</button>
          <input type="date" id="d-input" aria-label="Day" />
          <button id="d-next" aria-label="Next day">&#8250;</button>
          <button class="today-btn" id="d-today">Today</button>
        </div>
        <a class="btn ghost" href="/admin/health/log.html">Daily log</a>
      </div>
    </div>

    <div class="fd-grid">
      <div class="card">
        <h2>New plate</h2>
        <label class="drop" id="drop" for="photo">
          <span id="drop-text">Take or choose a photo</span>
          <img id="preview" alt="" />
        </label>
        <input type="file" id="photo" accept="image/*" capture="environment" hidden />
        <div class="field"><label for="caption">Caption</label><input type="text" id="caption" placeholder="chicken bowl, white rice, broccoli, no sauce" /></div>
        <div class="field"><label for="symptom-note">How it felt</label><textarea id="symptom-note" style="min-height:64px"></textarea></div>
        <div class="acts">
          <button class="btn primary" id="save-photo">Save with photo</button>
          <button class="btn ghost" id="save-text">Caption only</button>
        </div>
      </div>

      <div class="card">
        <h2 id="list-day">Today</h2>
        <div id="list"><div class="shimmer" style="height:120px"></div></div>
      </div>
    </div>
  </main>
  <script type="module" src="/admin/health/_js/food.js"></script>
</body>
</html>
