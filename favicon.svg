<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" shape-rendering="geometricPrecision">
  <defs>
    <!-- Vinyl surface: warm-black radial -->
    <radialGradient id="g-vinyl" cx="44%" cy="30%" r="80%">
      <stop offset="0%"  stop-color="#2A241E"/>
      <stop offset="55%" stop-color="#14110F"/>
      <stop offset="100%" stop-color="#06050A"/>
    </radialGradient>
    <!-- Extruded side: rust → crimson -->
    <linearGradient id="g-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#FF4D2E"/>
      <stop offset="100%" stop-color="#5F0712"/>
    </linearGradient>
    <!-- Center label: brighter rust radial -->
    <radialGradient id="g-label" cx="38%" cy="30%" r="80%">
      <stop offset="0%"  stop-color="#FF7656"/>
      <stop offset="100%" stop-color="#D63A1F"/>
    </radialGradient>
    <!-- Frame inner gradient -->
    <linearGradient id="g-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1B1814"/>
      <stop offset="100%" stop-color="#0A0908"/>
    </linearGradient>
  </defs>

  <!-- Rounded charcoal frame -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#g-frame)"/>

  <!-- Disc side edge — fills almost the whole width -->
  <path d="M 2 55 A 48 22 0 0 0 98 55 L 98 65 A 48 22 0 0 1 2 65 Z" fill="url(#g-edge)"/>
  <!-- Edge inner shadow stripe for cylindrical depth -->
  <path d="M 2 55 A 48 22 0 0 0 98 55 L 98 58 A 48 22 0 0 1 2 58 Z" fill="#3D0810" opacity="0.55"/>

  <!-- Disc top surface -->
  <ellipse cx="50" cy="55" rx="48" ry="22" fill="url(#g-vinyl)"/>

  <!-- Concentric grooves stop short of the label so they don't muddy it -->
  <g fill="none" stroke="#251F1A" stroke-width="0.32" opacity="0.85">
    <ellipse cx="50" cy="55" rx="45"   ry="20.5"/>
    <ellipse cx="50" cy="55" rx="42"   ry="19.0"/>
    <ellipse cx="50" cy="55" rx="39"   ry="17.6"/>
    <ellipse cx="50" cy="55" rx="36"   ry="16.2"/>
    <ellipse cx="50" cy="55" rx="33"   ry="14.8"/>
    <ellipse cx="50" cy="55" rx="30"   ry="13.4"/>
    <ellipse cx="50" cy="55" rx="27"   ry="12.0"/>
  </g>

  <!-- Center label — much bigger, the hero element -->
  <ellipse cx="50" cy="55" rx="24" ry="11" fill="url(#g-label)"/>
  <ellipse cx="50" cy="55" rx="24" ry="11" fill="none" stroke="#9B2814" stroke-width="0.35" opacity="0.6"/>

  <!-- HUGE CD — fills the label, dominant feature -->
  <text x="50" y="55" font-family="Anton, Impact, 'Arial Black', sans-serif" font-weight="900"
        font-size="18" fill="#1A0606" text-anchor="middle" dominant-baseline="central"
        letter-spacing="-0.5">CD</text>

  <!-- Frame outline (so it has definition on light browser tabs) -->
  <rect x="0.5" y="0.5" width="99" height="99" rx="21.5" fill="none" stroke="#FF4D2E" stroke-width="0.3" opacity="0.18"/>
</svg>
