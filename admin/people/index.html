<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<link rel="manifest" href="/admin/manifest.json" />
<link rel="apple-touch-icon" href="/favicon.svg" />
<meta name="theme-color" content="#8B7CF6" />
<title>People in orbit &middot; CD Admin</title>
<link rel="stylesheet" href="/admin/_shell/admin-shell.css" />
<style>
  .po-tools { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; margin-bottom: 1.2rem; }
  .po-tools input[type="search"] { flex: 1 1 220px; min-width: 0; max-width: 340px; padding: .55rem .8rem; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); font: inherit; font-size: .88rem; }
  .po-tools input[type="search"]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
  .po-n { font-variant-numeric: tabular-nums; color: var(--text-3); font-weight: 500; font-size: .78em; }
  .po-sec { margin-bottom: 1.4rem; }
  .po-h { display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; font-family: var(--f-display); font-size: 1.02rem; font-weight: 600; color: var(--text); margin: 0 0 .55rem; }
  .po-hint { font-family: var(--f-ui); font-size: .76rem; font-weight: 450; color: var(--text-3); }
  .po-hint b { color: var(--accent-ink); font-weight: 600; }
  .po-list { padding: .2rem 1rem; }
  .po-row { display: flex; align-items: flex-start; gap: .85rem; width: 100%; text-align: left; padding: .8rem 0; border: 0; border-top: 1px solid var(--border); background: none; color: inherit; font: inherit; cursor: pointer; min-width: 0; }
  .po-row:first-child { border-top: 0; }
  .po-row:hover .po-name { color: var(--accent-ink); }
  .po-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  .po-row .grow { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: .12rem; }
  .avatar.in { background: var(--text); color: var(--surface); }
  .avatar.big { width: 48px; height: 48px; font-size: .95rem; }
  .po-name { font-size: .92rem; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
  .po-pin { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .po-sub { font-size: .78rem; color: var(--text-2); }
  .po-why { font-size: .8rem; color: var(--text-3); line-height: 1.4; }
  .po-meta { flex: 0 0 auto; max-width: 42%; display: flex; flex-direction: column; align-items: flex-end; gap: .2rem; text-align: right; }
  .po-touch { font-size: .74rem; color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .po-touch.warn, .po-warn { color: var(--accent-ink); font-weight: 600; }
  .po-touch.warn::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: .35rem; vertical-align: middle; }
  .po-next { font-size: .78rem; color: var(--text-2); line-height: 1.35; }
  .po-why, .po-next { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .po-due { color: var(--text-3); white-space: nowrap; }
  .po-due.late { color: var(--neg); }
  @media (max-width: 720px) {
    .po-row { flex-wrap: wrap; }
    .po-meta { max-width: none; width: 100%; padding-left: calc(38px + .85rem); align-items: flex-start; text-align: left; }
  }
  .po-scrim { position: fixed; inset: 0; background: rgba(10,10,10,.28); opacity: 0; pointer-events: none; transition: opacity .2s var(--ease-out); z-index: 80; }
  .po-scrim.on { opacity: 1; pointer-events: auto; }
  .po-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--shadow-lift); transform: translateX(104%); transition: transform .3s var(--ease-out); z-index: 81; overflow-y: auto; padding: 1.2rem 1.2rem 2rem; }
  .po-drawer.on { transform: none; }
  .po-dh { display: flex; align-items: center; gap: .85rem; margin-bottom: .8rem; }
  .po-dh .grow { flex: 1 1 auto; min-width: 0; }
  .po-dname { font-family: var(--f-display); font-size: 1.2rem; font-weight: 600; color: var(--text); }
  .po-chips { display: flex; gap: .35rem; flex-wrap: wrap; margin-bottom: .9rem; }
  .po-dwhy { font-size: .9rem; color: var(--text); line-height: 1.5; margin: 0 0 1rem; }
  .po-dh3 { font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); font-weight: 600; margin: 1.3rem 0 .5rem; }
  .po-kvs { border-top: 1px solid var(--border); }
  .po-kv { display: grid; grid-template-columns: 110px 1fr; gap: .8rem; padding: .55rem 0; border-bottom: 1px solid var(--border); font-size: .84rem; }
  .po-kv > span { color: var(--text-3); }
  .po-kv > div { color: var(--text); min-width: 0; overflow-wrap: anywhere; }
  .po-kv a, .po-dwhy a { color: var(--accent-ink); }
  .po-path { font-family: var(--f-mono); font-size: .74rem; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: .5rem .6rem; margin-bottom: .4rem; overflow-wrap: anywhere; user-select: all; }
  .po-foot { margin-top: 1.2rem; font-size: .74rem; color: var(--text-3); }
</style>
</head>
<body>
<main id="app"><div class="shimmer" style="height:48px;width:240px;margin-bottom:1.5rem"></div><div class="shimmer" style="height:220px"></div></main>
<script type="module" src="/admin/_js/people.js"></script>
</body>
</html>
