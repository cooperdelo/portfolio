<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<link rel="manifest" href="/admin/diary/manifest.json" />
<link rel="apple-touch-icon" href="/favicon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Diary" />
<meta name="theme-color" content="#0C0B0A" />
<title>Diary · CD Admin</title>
<link rel="preload" href="/admin/_shell/fonts/DrukWideBold.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/admin/_shell/admin-shell.css" />
<style>
  /* Private diary. Full admin only (page gate + RLS is_full_admin()). Phone first:
     one column, full-width fields, 44px+ tap targets, nothing wider than the screen. */
  .dy { display: flex; flex-direction: column; gap: 14px; min-width: 0; max-width: 820px; }
  .dy .card { padding: 20px 22px; min-width: 0; }
  .dy .card > h2 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 0 0 14px; font-family: var(--f-ui); font-weight: 700; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--text); }
  .dy .card > h2 .count { margin-left: auto; font-family: var(--f-mono); font-weight: 400; font-size: 10.5px; letter-spacing: .02em; text-transform: none; color: var(--text-3); }
  .head-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .head-actions input[type=date] { width: 160px; min-height: 40px; border-radius: 999px; }
  .private { font-family: var(--f-mono); font-size: 10px; text-transform: uppercase; color: var(--text-3); border: 1px solid var(--line-2); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }

  .prompt + .prompt { margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--line); }
  .prompt .q { display: block; font-size: 15px; line-height: 1.4; color: var(--text); font-weight: 700; margin-bottom: 4px; }
  .prompt .q small { display: block; margin-top: 4px; font-weight: 400; font-size: 12.5px; color: var(--text-3); }
  .prompt textarea { min-height: 128px; font-size: 16px; line-height: 1.5; margin-top: 10px; }
  .prompt-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .mic { min-height: 44px; padding: 8px 18px; }
  .mic.on { background: var(--bone); color: var(--ink-0); border-color: var(--bone); }
  .kbd-hint { font-size: 12px; color: var(--text-3); }
  .interim { flex-basis: 100%; font-size: 12.5px; color: var(--text-3); font-style: italic; min-height: 0; }
  .interim:empty { display: none; }

  .lsq { padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line-2); background: var(--fill); margin-top: 10px; }
  .lsq .lsq-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .lsq .lsq-text { font-size: 15.5px; line-height: 1.45; color: var(--text); }
  .lsq details { margin-top: 8px; font-size: 12.5px; color: var(--text-3); }
  .lsq summary { cursor: pointer; min-height: 32px; display: flex; align-items: center; }
  .progress { height: 4px; border-radius: 999px; background: var(--fill-2); overflow: hidden; margin: 2px 0 0; }
  .progress i { display: block; height: 100%; width: 0; background: var(--bone); transition: width var(--t) var(--ease); }

  .save-bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
  .toggle { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 4px; font-size: 13.5px; color: var(--text-2); cursor: pointer; user-select: none; }
  .toggle input { width: 20px; height: 20px; }
  .save-bar .btn.primary { min-height: 48px; padding: 10px 26px; font-size: 14px; margin-left: auto; }
  .status-line { flex-basis: 100%; font-family: var(--f-mono); font-size: 10.5px; text-transform: uppercase; color: var(--text-3); min-height: 14px; }

  .filters { margin-bottom: 4px; }
  .filters input[type=search] { flex: 1 1 220px; min-width: 0; min-height: 44px; }
  .filters select { min-height: 44px; }
  .seg button { min-height: 38px; }
  .entries { display: flex; flex-direction: column; }
  .entry { padding: 16px 0; border-top: 1px solid var(--line); min-width: 0; }
  .entry:first-child { border-top: 0; }
  .entry .e-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .entry .e-date { font-family: var(--f-mono); font-size: 10.5px; text-transform: uppercase; color: var(--text-3); }
  .entry .e-q { font-size: 12.5px; color: var(--text-3); margin-bottom: 6px; }
  .entry .e-body { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14.5px; line-height: 1.55; color: var(--text); }
  .entry .e-body.clamp { display: -webkit-box; -webkit-line-clamp: 8; -webkit-box-orient: vertical; overflow: hidden; }
  .entry .e-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .entry .e-actions .btn { min-height: 38px; }
  .entry textarea { min-height: 160px; font-size: 16px; }
  .entry .edit-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .entry .edit-row select { width: auto; min-width: 160px; min-height: 44px; }
  .empty { font-size: 13px; color: var(--text-3); padding: 6px 0; }
  .more { margin-top: 10px; }

  @media (max-width: 600px) {
    .dy .card { padding: 16px; }
    .head-actions { width: 100%; }
    .head-actions input[type=date] { flex: 1 1 auto; width: auto; }
    .save-bar .btn.primary { width: 100%; margin-left: 0; }
    .filters { flex-direction: column; align-items: stretch; }
    .filters > *, .filters input[type=search] { width: 100%; flex: 0 0 auto; }
    .filters .seg { justify-content: space-between; }
  }
</style>
</head>
<body>
  <main>
    <div class="page-head">
      <div><h1>Diary</h1></div>
      <div class="actions head-actions">
        <input type="date" id="entry-date" aria-label="Entry date" />
        <span class="private">Only you</span>
      </div>
    </div>

    <div class="dy">
      <section class="card" id="tonight">
        <h2>Tonight <span class="count" id="draft-note"></span></h2>

        <div class="prompt">
          <label class="q" for="p1">What happened today that mattered?</label>
          <textarea id="p1" data-key="p1" placeholder="Write it like you would tell a friend."></textarea>
          <div class="prompt-tools"><button class="btn mic" type="button" data-mic="p1">Speak</button><span class="kbd-hint">or tap the mic on your keyboard</span><div class="interim" data-interim="p1"></div></div>
        </div>

        <div class="prompt">
          <label class="q" for="p2">One thing you're proud of, or one thing that's bugging you</label>
          <textarea id="p2" data-key="p2" placeholder="One is enough."></textarea>
          <div class="prompt-tools"><button class="btn mic" type="button" data-mic="p2">Speak</button><span class="kbd-hint">or tap the mic on your keyboard</span><div class="interim" data-interim="p2"></div></div>
        </div>

        <div class="prompt">
          <label class="q" for="p3">Optional: one memory<small id="ls-progress-text">Life story</small></label>
          <div class="progress" aria-hidden="true"><i id="ls-progress-bar"></i></div>
          <div class="lsq" id="lsq"><div class="lsq-text">Loading the next question…</div></div>
          <textarea id="p3" data-key="p3" placeholder="Skip it if tonight is not the night."></textarea>
          <div class="prompt-tools">
            <button class="btn mic" type="button" data-mic="p3">Speak</button>
            <button class="btn ghost" type="button" id="skip-q">Skip this question</button>
            <span class="kbd-hint">or tap the mic on your keyboard</span>
            <div class="interim" data-interim="p3"></div>
          </div>
        </div>

        <div class="save-bar">
          <label class="toggle"><input type="checkbox" id="for-content" /> OK to use for content</label>
          <button class="btn primary" type="button" id="save">Save tonight</button>
          <div class="status-line" id="save-status" role="status" aria-live="polite"></div>
        </div>
      </section>

      <section class="card" id="past">
        <h2>Past entries <span class="count" id="past-count"></span></h2>
        <div class="filters">
          <input type="search" id="q" placeholder="Search everything you wrote" autocomplete="off" />
          <div class="seg" role="tablist" id="kind-seg">
            <button type="button" data-kind="" class="on">All</button>
            <button type="button" data-kind="night">Nights</button>
            <button type="button" data-kind="memory">Memories</button>
            <button type="button" data-kind="note">Notes</button>
          </div>
          <select id="chapter-filter" aria-label="Chapter"><option value="">Every chapter</option></select>
        </div>
        <div class="entries" id="entries"><div class="empty">Loading…</div></div>
        <button class="btn more" type="button" id="load-more" hidden>Show older</button>
      </section>
    </div>
  </main>

  <script type="module">
    import { mountShell, toast } from '/admin/_shell/admin-shell.js';
    import { sb, requireFullAdminOrRedirect } from '/admin/_shell/supabase.js';
    import { esc } from '/admin/_shell/ui.js';

    const ctx = await mountShell({ title: 'Diary' });
    if (!ctx?.demo && !(await requireFullAdminOrRedirect())) throw new Error('Full admin only');

    const CHAPTERS = [
      ['childhood', 'Childhood'], ['middle-school', 'Middle school'], ['high-school', 'High school'], ['college', 'College'],
      ['family', 'Family'], ['friends', 'Friends'], ['love', 'Love'], ['music', 'Music'], ['sports', 'Sports'],
      ['academics', 'Academics'], ['turning-point', 'Turning points'], ['other', 'Other'],
    ];
    const chapterName = (c) => (CHAPTERS.find(x => x[0] === c) || [c, c || ''])[1];
    const KIND = { night: 'Night', memory: 'Memory', note: 'Note' };
    const $ = (id) => document.getElementById(id);
    const PAGE = 50;

    // ---------- the entry date: after midnight and before 4am still counts as last night ----------
    function nightOfET() {
      const now = new Date();
      const parts = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: 'numeric', hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(now).map(p => [p.type, p.value]));
      const d = new Date(Date.UTC(+parts.year, +parts.month - 1, +parts.day));
      if (+parts.hour < 4) d.setUTCDate(d.getUTCDate() - 1);
      return d.toISOString().slice(0, 10);
    }

    // ---------- draft: kept on this device until a save is confirmed by re-select ----------
    const DRAFT_KEY = 'cd-diary-draft-v1';
    const readDraft = () => { try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch { return null; } };
    const clearDraft = () => { try { localStorage.removeItem(DRAFT_KEY); } catch { /* storage blocked */ } };
    let draftT = 0;
    function writeDraft() {
      clearTimeout(draftT);
      draftT = setTimeout(() => {
        const d = { p1: $('p1').value, p2: $('p2').value, p3: $('p3').value, qid: currentQ?.id || null, date: $('entry-date').value, forContent: $('for-content').checked, at: new Date().toISOString() };
        const empty = !d.p1.trim() && !d.p2.trim() && !d.p3.trim();
        try { empty ? localStorage.removeItem(DRAFT_KEY) : localStorage.setItem(DRAFT_KEY, JSON.stringify(d)); $('draft-note').textContent = empty ? '' : 'Draft kept on this device'; }
        catch { $('draft-note').textContent = 'Draft not saving on this device'; }
      }, 250);
    }

    // ---------- life story questions ----------
    let questions = [];
    let currentQ = null;
    const qById = (id) => questions.find(q => q.id === id);

    async function loadQuestions() {
      const { data, error } = await sb.from('life_story_questions').select('id,chapter,sort,question,known,asked_at,answered_entry_id').order('sort');
      if (error) { $('lsq').innerHTML = `<div class="lsq-text">Could not load questions: ${esc(error.message)}</div>`; return; }
      questions = data || [];
    }
    function nextQuestion() {
      const open = questions.filter(q => !q.answered_entry_id);
      open.sort((a, b) => (a.asked_at ? 1 : 0) - (b.asked_at ? 1 : 0) || String(a.asked_at || '').localeCompare(String(b.asked_at || '')) || a.sort - b.sort);
      return open[0] || null;
    }
    function renderProgress() {
      const total = questions.length, done = questions.filter(q => q.answered_entry_id).length;
      $('ls-progress-text').textContent = total ? `${done} of ${total} memories answered` : 'Life story';
      $('ls-progress-bar').style.width = total ? `${Math.round(done / total * 100)}%` : '0';
    }
    function renderQuestion() {
      renderProgress();
      const box = $('lsq');
      if (!currentQ) { box.innerHTML = '<div class="lsq-text">Every life story question is answered. Write any memory below and it saves as a note.</div>'; $('skip-q').hidden = true; return; }
      $('skip-q').hidden = false;
      box.innerHTML = `<div class="lsq-meta"><span class="pill">${esc(chapterName(currentQ.chapter))}</span></div>
        <div class="lsq-text">${esc(currentQ.question)}</div>
        ${currentQ.known ? `<details><summary>What is already on file</summary><div>${esc(currentQ.known)}</div></details>` : ''}`;
    }
    $('skip-q').addEventListener('click', async () => {
      if (!currentQ) return;
      if ($('p3').value.trim() && !confirm('Skip this question and clear what you wrote for it?')) return;
      const skipped = currentQ;
      const at = new Date().toISOString();
      const { error } = await sb.from('life_story_questions').update({ asked_at: at }).eq('id', skipped.id);
      if (error) { toast('Could not skip: ' + error.message, 'err', 4000); return; }
      skipped.asked_at = at;
      $('p3').value = '';
      currentQ = nextQuestion();
      renderQuestion(); writeDraft();
    });

    // ---------- voice: Web Speech API where the browser has it ----------
    const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    let rec = null, recTarget = null;
    document.querySelectorAll('[data-mic]').forEach(btn => {
      if (!Rec) { btn.hidden = true; return; }
      btn.addEventListener('click', () => (recTarget === btn.dataset.mic ? stopMic() : startMic(btn.dataset.mic)));
    });
    function setMicUI() {
      document.querySelectorAll('[data-mic]').forEach(b => { const on = b.dataset.mic === recTarget; b.classList.toggle('on', on); b.textContent = on ? 'Listening, tap to stop' : 'Speak'; });
      document.querySelectorAll('[data-interim]').forEach(el => { if (el.dataset.interim !== recTarget) el.textContent = ''; });
    }
    function stopMic() { try { rec?.stop(); } catch { /* already stopped */ } recTarget = null; setMicUI(); }
    function startMic(key) {
      stopMic();
      rec = new Rec();
      rec.lang = 'en-US'; rec.continuous = true; rec.interimResults = true;
      const ta = $(key), interim = document.querySelector(`[data-interim="${key}"]`);
      rec.onresult = (e) => {
        let live = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const t = e.results[i][0].transcript;
          if (e.results[i].isFinal) { ta.value = (ta.value && !/\s$/.test(ta.value) ? ta.value + ' ' : ta.value) + t.trim(); writeDraft(); }
          else live += t;
        }
        interim.textContent = live;
      };
      rec.onerror = (e) => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') toast('Mic blocked here. Allow it in the browser, or use the mic on your keyboard.', 'err', 4500); };
      rec.onend = () => { if (recTarget === key) { recTarget = null; setMicUI(); } };
      recTarget = key; setMicUI();
      try { rec.start(); } catch { recTarget = null; setMicUI(); }
    }

    // ---------- save tonight: insert, then confirm by re-select before the draft is cleared ----------
    function composeNight(p1, p2) {
      const parts = [];
      if (p1) parts.push('What happened today that mattered\n' + p1);
      if (p2) parts.push("Proud of, or bugging me\n" + p2);
      return parts.join('\n\n');
    }
    $('save').addEventListener('click', async () => {
      stopMic();
      const p1 = $('p1').value.trim(), p2 = $('p2').value.trim(), p3 = $('p3').value.trim();
      if (!p1 && !p2 && !p3) { toast('Nothing to save yet', 'err'); return; }
      const entry_date = $('entry-date').value || nightOfET();
      const for_content = $('for-content').checked;
      const rows = [];
      if (p1 || p2) rows.push({ entry_date, kind: 'night', body: composeNight(p1, p2), for_content, source: 'web' });
      if (p3) rows.push(currentQ
        ? { entry_date, kind: 'memory', chapter: currentQ.chapter, question_id: currentQ.id, body: p3, for_content, source: 'web' }
        : { entry_date, kind: 'note', body: p3, for_content, source: 'web' });
      const btn = $('save'); btn.disabled = true; $('save-status').textContent = 'Saving…';
      try {
        const { data: ins, error } = await sb.from('diary_entries').insert(rows).select('id');
        if (error) throw error;
        const ids = (ins || []).map(r => r.id);
        const { data: back, error: e2 } = await sb.from('diary_entries').select('id,body').in('id', ids).is('deleted_at', null);
        if (e2) throw e2;
        const ok = ids.length === rows.length && back?.length === rows.length && rows.every(r => back.some(b => b.body === r.body));
        if (!ok) throw new Error('Saved rows did not read back. Your draft is still here.');
        clearDraft();
        ['p1', 'p2', 'p3'].forEach(k => { $(k).value = ''; });
        $('for-content').checked = false; $('draft-note').textContent = '';
        $('save-status').textContent = `Saved ${rows.length === 1 ? 'one entry' : rows.length + ' entries'} · ${new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}`;
        toast('Saved');
        await loadQuestions(); currentQ = nextQuestion(); renderQuestion();
        resetAndLoad();
      } catch (err) {
        $('save-status').textContent = 'Not saved. Your writing is kept on this device.';
        toast('Not saved: ' + (err.message || err), 'err', 5000);
      } finally { btn.disabled = false; }
    });

    // ---------- past entries: search, filters, edit, soft delete ----------
    let filter = { q: '', kind: '', chapter: '' }, offset = 0, shown = [];
    $('chapter-filter').innerHTML += CHAPTERS.map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join('');
    async function fetchEntries() {
      let qb = sb.from('diary_entries').select('id,entry_date,created_at,updated_at,kind,chapter,question_id,body,for_content,source', { count: 'exact' })
        .is('deleted_at', null).order('entry_date', { ascending: false }).order('created_at', { ascending: false }).range(offset, offset + PAGE - 1);
      if (filter.kind) qb = qb.eq('kind', filter.kind);
      if (filter.chapter) qb = qb.eq('chapter', filter.chapter);
      if (filter.q) qb = qb.ilike('body', `%${filter.q.replace(/[%_\\]/g, m => '\\' + m)}%`);
      return qb;
    }
    async function resetAndLoad() { offset = 0; shown = []; await loadEntries(); }
    async function loadEntries() {
      const { data, error, count } = await fetchEntries();
      if (error) { $('entries').innerHTML = `<div class="empty">Could not load entries: ${esc(error.message)}</div>`; return; }
      shown = shown.concat(data || []); offset = shown.length;
      $('past-count').textContent = count == null ? '' : `${count} ${count === 1 ? 'entry' : 'entries'}`;
      $('load-more').hidden = !(count > shown.length);
      renderEntries();
    }
    const fmtEntryDay = (d) => { const [y, m, dd] = d.split('-').map(Number); return new Date(y, m - 1, dd).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }); };
    function entryHTML(e) {
      const q = e.question_id ? qById(e.question_id) : null;
      return `<article class="entry" data-id="${esc(e.id)}">
        <div class="e-meta"><span class="e-date">${esc(fmtEntryDay(e.entry_date))}</span><span class="pill">${esc(KIND[e.kind] || e.kind)}</span>${e.chapter ? `<span class="pill">${esc(chapterName(e.chapter))}</span>` : ''}${e.for_content ? '<span class="chip ok">OK for content</span>' : ''}${e.source !== 'web' ? `<span class="pill">from ${esc(e.source)}</span>` : ''}</div>
        ${q ? `<div class="e-q">${esc(q.question)}</div>` : ''}
        <div class="e-body clamp">${esc(e.body)}</div>
        <div class="e-actions"><button class="btn small ghost" data-act="expand" type="button" hidden>Show all</button><button class="btn small" data-act="edit" type="button">Edit</button><button class="btn small danger" data-act="delete" type="button">Delete</button></div>
      </article>`;
    }
    function renderEntries() {
      const host = $('entries');
      if (!shown.length) { host.innerHTML = `<div class="empty">${filter.q || filter.kind || filter.chapter ? 'Nothing matches.' : 'Nothing yet. Tonight is entry one.'}</div>`; return; }
      host.innerHTML = shown.map(entryHTML).join('');
      host.querySelectorAll('.e-body.clamp').forEach(b => { if (b.scrollHeight > b.clientHeight + 2) b.closest('.entry').querySelector('[data-act=expand]').hidden = false; });
    }
    $('entries').addEventListener('click', async (ev) => {
      const btn = ev.target.closest('[data-act]'); if (!btn) return;
      const art = btn.closest('.entry'); const id = art.dataset.id; const e = shown.find(x => x.id === id); if (!e) return;
      const act = btn.dataset.act;
      if (act === 'expand') { art.querySelector('.e-body').classList.remove('clamp'); btn.hidden = true; return; }
      if (act === 'delete') {
        if (!confirm('Delete this entry? It leaves your list but is never erased from the database.')) return;
        const { data, error } = await sb.from('diary_entries').update({ deleted_at: new Date().toISOString() }).eq('id', id).select('id,deleted_at');
        if (error || !data?.length || !data[0].deleted_at) { toast('Could not delete: ' + (error?.message || 'no row changed'), 'err', 4000); return; }
        shown = shown.filter(x => x.id !== id); offset = shown.length; renderEntries();
        const n = parseInt($('past-count').textContent, 10); if (!isNaN(n)) $('past-count').textContent = `${n - 1} ${n - 1 === 1 ? 'entry' : 'entries'}`;
        toast('Deleted');
        if (e.question_id) { await loadQuestions(); if (!currentQ) currentQ = nextQuestion(); renderQuestion(); }
        return;
      }
      if (act === 'edit') {
        const showChapter = e.kind !== 'night';
        art.querySelector('.e-actions')?.remove();
        art.querySelector('.e-body').outerHTML = `<div class="edit"><textarea aria-label="Edit entry">${esc(e.body)}</textarea>
          <div class="edit-row">${showChapter ? `<select data-f="chapter" aria-label="Chapter"><option value="">No chapter</option>${CHAPTERS.map(([v, l]) => `<option value="${v}"${v === e.chapter ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>` : ''}
          <label class="toggle"><input type="checkbox" data-f="for_content"${e.for_content ? ' checked' : ''} /> OK to use for content</label></div>
          <div class="e-actions"><button class="btn small primary" data-act="save-edit" type="button">Save changes</button><button class="btn small ghost" data-act="cancel-edit" type="button">Cancel</button></div></div>`;
        art.querySelector('textarea').focus();
        return;
      }
      if (act === 'cancel-edit') { renderEntries(); return; }
      if (act === 'save-edit') {
        const body = art.querySelector('textarea').value.trim();
        if (!body) { toast('An entry cannot be empty. Use Delete instead.', 'err', 3500); return; }
        const patch = { body, for_content: art.querySelector('[data-f=for_content]').checked };
        const ch = art.querySelector('[data-f=chapter]'); if (ch) patch.chapter = ch.value || null;
        const { data, error } = await sb.from('diary_entries').update(patch).eq('id', id).select('id,body,for_content,chapter,updated_at');
        if (error || !data?.length || data[0].body !== body) { toast('Not saved: ' + (error?.message || 'no row changed'), 'err', 4000); return; }
        Object.assign(e, data[0]); renderEntries(); toast('Updated');
      }
    });
    let searchT = 0;
    $('q').addEventListener('input', () => { clearTimeout(searchT); searchT = setTimeout(() => { filter.q = $('q').value.trim(); resetAndLoad(); }, 300); });
    $('kind-seg').addEventListener('click', (ev) => {
      const b = ev.target.closest('button[data-kind]'); if (!b) return;
      $('kind-seg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      filter.kind = b.dataset.kind; resetAndLoad();
    });
    $('chapter-filter').addEventListener('change', () => { filter.chapter = $('chapter-filter').value; resetAndLoad(); });
    $('load-more').addEventListener('click', loadEntries);

    // ---------- boot ----------
    $('entry-date').value = nightOfET();
    await loadQuestions();
    const draft = readDraft();
    if (draft) {
      ['p1', 'p2', 'p3'].forEach(k => { $(k).value = draft[k] || ''; });
      if (draft.date) $('entry-date').value = draft.date;
      $('for-content').checked = !!draft.forContent;
      const dq = draft.qid ? qById(draft.qid) : null;
      if (dq && !dq.answered_entry_id) currentQ = dq;
      if (draft.at) $('draft-note').textContent = 'Draft restored from ' + new Date(draft.at).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    }
    if (!currentQ) currentQ = nextQuestion();
    renderQuestion();
    ['p1', 'p2', 'p3'].forEach(k => $(k).addEventListener('input', writeDraft));
    $('for-content').addEventListener('change', writeDraft);
    $('entry-date').addEventListener('change', writeDraft);
    addEventListener('pagehide', () => { clearTimeout(draftT); const d = { p1: $('p1').value, p2: $('p2').value, p3: $('p3').value, qid: currentQ?.id || null, date: $('entry-date').value, forContent: $('for-content').checked, at: new Date().toISOString() }; if (d.p1.trim() || d.p2.trim() || d.p3.trim()) { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(d)); } catch { /* storage blocked */ } } });
    await resetAndLoad();
  </script>
</body>
</html>
