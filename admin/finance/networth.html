<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>Net Worth · CD Admin</title>
<link rel="stylesheet" href="/admin/_shell/admin-shell.css" />
<style>
  /* net worth: section totals in the title row, editable values inline */
  h2.section-h .stot { margin-left: auto; font-family: var(--f-display); font-size: 14px; letter-spacing: 0; color: var(--text); text-transform: none; }
  table.data td .meta { display: block; margin-top: 2px; }
  table.data .chk { width: 34px; text-align: center; }
  table.data input[type=number] { width: 110px; text-align: right; font-variant-numeric: tabular-nums; }
  table.data tr.tbd input[type=number] { border-style: dashed; color: var(--text-3); }
  table.data tr.off { opacity: .5; }
  table.data .locked-val { font-family: var(--f-display); font-size: 12.5px; color: var(--text); }
  table.data .synced-tag { font-family: var(--f-mono); font-size: 9.5px; text-transform: uppercase; color: var(--text-2); box-shadow: inset 0 0 0 1px var(--line-2); border-radius: 999px; padding: 1px 6px; margin-left: 6px; white-space: nowrap; }
  @media (max-width: 600px) { table.data th:nth-child(3), table.data td:nth-child(3) { display: none; } }
  .nw-foot { font-family: var(--f-mono); font-size: 10.5px; color: var(--text-3); margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); line-height: 1.7; text-transform: uppercase; }
</style>
</head>
<body>
  <main>
    <div class="page-head">
      <div>
        <h1>Net worth</h1>
      </div>
      <div class="actions"><span class="live-dot" id="nw-stamp">Snapshot</span><button class="btn ghost small" type="button" id="nw-edit" aria-pressed="false" onclick="var on=document.body.classList.toggle('nw-edit');this.setAttribute('aria-pressed',on);this.textContent=on?'Done':'Edit';">Edit</button></div>
    </div>

    <div class="kpi-grid">
      <div class="card"><div class="label">Personal net worth</div><div class="value" data-k="net">–</div><div class="delta flat">Personal · live + hand-valued</div></div>
      <div class="card"><div class="label">Liquid</div><div class="value" data-k="liq">–</div><div class="delta flat">Cash · brokerage · crypto</div></div>
      <div class="card"><div class="label">Physical (owned)</div><div class="value" data-k="phys">–</div><div class="delta flat">Hand-valued</div></div>
      <div class="card"><div class="label">Business · Plugverse</div><div class="value" data-k="biz" >–</div><div class="delta flat">PlugVerse LLC</div></div>
    </div>

    <div class="grid">
      <div class="span-6">
        <h2 class="section-h" style="margin-top:4px">Liquid<span class="stot" data-s="liquid"></span></h2>
        <div class="tbl-wrap"><table class="data"><thead><tr><th class="chk"></th><th>Asset</th><th>Class</th><th class="right">Value</th></tr></thead><tbody data-body="liquid"></tbody></table></div>
        <h2 class="section-h">Liabilities<span class="stot" data-s="liab"></span></h2>
        <div class="tbl-wrap"><table class="data"><thead><tr><th class="chk"></th><th>Item</th><th>Class</th><th class="right">Value</th></tr></thead><tbody data-body="liab"></tbody></table></div>
        <h2 class="section-h">PlugVerse LLC<span class="stot" data-s="biz"></span></h2>
        <div class="tbl-wrap"><table class="data"><thead><tr><th class="chk"></th><th>Asset</th><th>Class</th><th class="right">Value</th></tr></thead><tbody data-body="biz"></tbody></table></div>
      </div>
      <div class="span-6">
        <h2 class="section-h" style="margin-top:4px">Physical<span class="stot" data-s="phys"></span></h2>
        <div class="tbl-wrap"><table class="data"><thead><tr><th class="chk"></th><th>Asset</th><th>Class</th><th class="right">Value</th></tr></thead><tbody data-body="phys"></tbody></table></div>
      </div>
    </div>

    <div class="nw-foot" id="nw-foot"></div>
  </main>

  <script type="module" src="/admin/finance/_js/networth.js"></script>
</body>
</html>
