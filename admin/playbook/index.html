<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>Playbook · CD Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Geist+Mono:wght@300..700&family=Geist:wght@300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/admin/_shell/admin-shell.css" />
<style>
/* Playbook-specific styling — leans on admin-shell tokens, glass cards, single rust accent */

.toolbar{display:flex;flex-direction:column;gap:1rem;margin:0 0 1.6rem;}
.toolbar .row{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center}
.toolbar .row .lbl{font-family:"Geist Mono",monospace;font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-right:.4rem;align-self:center}
.toolbar input[type="search"]{flex:1;min-width:200px;background:rgba(244,239,230,.04);border:1px solid rgba(244,239,230,.12);border-radius:10px;padding:.7rem .9rem;color:var(--ink);font-family:"Geist",sans-serif;font-size:.92rem;outline:none;transition:border-color .15s}
.toolbar input[type="search"]:focus{border-color:var(--rust)}
.pill{font-family:"Geist Mono",monospace;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;padding:.5rem .8rem;border-radius:999px;background:rgba(244,239,230,.04);border:1px solid rgba(244,239,230,.1);color:var(--ink-2);cursor:pointer;transition:all .15s;white-space:nowrap}
.pill:hover{border-color:rgba(244,239,230,.25);color:var(--ink)}
.pill.on{background:var(--rust);border-color:var(--rust);color:var(--bg)}
.pill .n{margin-left:.4rem;opacity:.6;font-size:.55rem}
.pill.on .n{opacity:.85}

/* Item card */
.pb-list{display:grid;gap:.75rem}
.pb-card{background:rgba(244,239,230,.035);border:1px solid rgba(244,239,230,.1);border-radius:14px;padding:1.1rem 1.35rem;cursor:pointer;transition:border-color .18s,background .18s,transform .18s}
.pb-card:hover{border-color:var(--rust);background:rgba(244,239,230,.05)}
.pb-card.pinned{border-color:rgba(255,77,46,.45);background:rgba(255,77,46,.03)}
.pb-card .meta-row{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;margin-bottom:.55rem}
.pb-card .badge{font-family:"Geist Mono",monospace;font-size:.55rem;letter-spacing:.22em;text-transform:uppercase;padding:.28rem .55rem;border-radius:4px;background:rgba(244,239,230,.06);color:var(--ink-2);line-height:1}
.pb-card .badge.scope-personal-brand{background:rgba(255,77,46,.16);color:var(--rust)}
.pb-card .badge.scope-plugverse{background:rgba(122,138,110,.2);color:var(--sage)}
.pb-card .badge.scope-both{background:rgba(201,190,230,.16);color:var(--pastel-lavender)}
.pb-card .badge.type{background:rgba(244,239,230,.05);color:var(--ink-2);letter-spacing:.18em}
.pb-card .badge.pin{background:rgba(255,77,46,.22);color:var(--rust)}
.pb-card .badge.expires{background:rgba(200,16,46,.18);color:#ff8a8a}
.pb-card h3{font-family:"Geist",sans-serif;font-weight:600;font-size:1.05rem;line-height:1.3;color:var(--ink);letter-spacing:-.005em;margin:0 0 .35rem}
.pb-card .summary{font-family:"Geist",sans-serif;font-size:.87rem;line-height:1.45;color:var(--ink-2);margin:0 0 .45rem;white-space:pre-wrap}
.pb-card .tags{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.55rem}
.pb-card .tags .tag{font-family:"Geist Mono",monospace;font-size:.54rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:.22rem .5rem;border-radius:999px;background:rgba(244,239,230,.04);border:1px solid rgba(244,239,230,.07)}
.pb-card .footline{font-family:"Geist Mono",monospace;font-size:.55rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:.55rem;display:flex;flex-wrap:wrap;gap:.8rem}
.pb-card .footline .v{color:var(--ink-2)}
.pb-card{position:relative}
.pb-card .card-edit{position:absolute;top:.85rem;right:.95rem;font-family:"Geist Mono",monospace;font-size:.52rem;letter-spacing:.22em;text-transform:uppercase;padding:.4rem .7rem;border-radius:6px;background:rgba(244,239,230,.05);border:1px solid rgba(244,239,230,.1);color:var(--muted);cursor:pointer;transition:all .15s;opacity:0}
.pb-card:hover .card-edit{opacity:1}
.pb-card .card-edit:hover{background:var(--rust);border-color:var(--rust);color:var(--bg);opacity:1}

/* Read-only detail view */
.pb-view .pb-summary{font-family:"Fraunces",Georgia,serif;font-size:1.1rem;line-height:1.55;color:var(--ink);margin:0 0 1.2rem;font-style:italic;opacity:.92}
.pb-view .pb-body{font-family:"Geist",sans-serif;font-size:.95rem;line-height:1.65;color:var(--ink-2)}
.pb-view .pb-body p{margin:0 0 .85rem}
.pb-view .pb-body h3{font-family:"Geist",sans-serif;font-weight:600;font-size:1.05rem;color:var(--ink);margin:1.2rem 0 .55rem;letter-spacing:-.005em}
.pb-view .pb-body h4{font-family:"Geist Mono",monospace;font-weight:500;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--rust);margin:1rem 0 .45rem}
.pb-view .pb-body ul{padding-left:1.3rem;margin:0 0 .85rem}
.pb-view .pb-body ul li{margin:0 0 .35rem;line-height:1.55}
.pb-view .pb-body code{font-family:"Geist Mono",monospace;font-size:.85rem;padding:.1rem .35rem;border-radius:4px;background:rgba(244,239,230,.06);color:var(--rust)}
.pb-view .pb-body strong{color:var(--ink);font-weight:600}
.pb-view .pb-body em{color:var(--ink);font-style:italic;opacity:.92}

.pb-empty{padding:2.8rem 1.5rem;text-align:center;color:var(--muted);font-family:"Geist Mono",monospace;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;line-height:1.7}

/* Sheet (matches merch admin) */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:90;opacity:0;pointer-events:none;transition:opacity .35s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%) translateY(100%);width:100%;max-width:620px;background:rgba(20,17,15,.92);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border-top-left-radius:22px;border-top-right-radius:22px;border:1px solid rgba(244,239,230,.14);border-bottom:none;padding:1.5rem 1.7rem calc(1.8rem + env(safe-area-inset-bottom));z-index:95;max-height:90dvh;overflow-y:auto;transition:transform .42s cubic-bezier(.22,1,.36,1)}
.sheet.on{transform:translateX(-50%) translateY(0)}
.sheet-grip{width:42px;height:4px;border-radius:2px;background:rgba(244,239,230,.18);margin:-.2rem auto 1.2rem}
.sheet h2{font-family:"Geist",sans-serif;font-weight:600;font-size:1.3rem;line-height:1.1;letter-spacing:-.01em;margin:0 0 1.3rem;color:var(--ink)}
.sheet .field{margin-bottom:.9rem}
.sheet .field > label{display:block;font-family:"Geist Mono",monospace;font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:.45rem}
.sheet .field input,.sheet .field select,.sheet .field textarea{width:100%;background:rgba(244,239,230,.04);border:1px solid rgba(244,239,230,.12);border-radius:10px;padding:.8rem .95rem;color:var(--ink);font-family:"Geist",sans-serif;font-size:.95rem;outline:none;transition:border-color .15s;-webkit-appearance:none;appearance:none;color-scheme:dark}
.sheet .field input:focus,.sheet .field select:focus,.sheet .field textarea:focus{border-color:var(--rust)}
.sheet .field textarea{resize:vertical;min-height:5rem;font-family:"Geist Mono",monospace;font-size:.86rem;line-height:1.55}
.sheet .field select option{background:#14110F;color:var(--ink)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
.toggle-row{display:flex;align-items:center;gap:.6rem;font-family:"Geist Mono",monospace;font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-2);padding:.7rem .95rem;background:rgba(244,239,230,.04);border:1px solid rgba(244,239,230,.12);border-radius:10px;cursor:pointer;transition:border-color .15s}
.toggle-row:hover{border-color:rgba(244,239,230,.25)}
.toggle-row input{accent-color:var(--rust);width:1.05rem;height:1.05rem}
.btn-rust{display:block;width:100%;padding:1rem;border-radius:12px;background:var(--rust);border:none;color:var(--bg);font-family:"Geist Mono",monospace;font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;font-weight:500;cursor:pointer;margin-top:.5rem;transition:background .2s}
.btn-rust:hover{background:#ff6648}
.btn-ghost{display:block;width:100%;padding:.9rem;border-radius:12px;background:transparent;border:1px solid rgba(244,239,230,.12);color:var(--ink-2);font-family:"Geist Mono",monospace;font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;margin-top:.4rem;transition:all .2s}
.btn-ghost:hover{border-color:rgba(244,239,230,.25);color:var(--ink)}
.btn-danger{display:block;width:100%;padding:.9rem;border-radius:12px;background:transparent;border:1px solid rgba(200,16,46,.5);color:var(--crimson);font-family:"Geist Mono",monospace;font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;margin-top:.4rem;transition:all .2s}
.btn-danger:hover{background:var(--crimson);color:var(--ink);border-color:var(--crimson)}
.hint{font-family:"Geist Mono",monospace;font-size:.55rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:.35rem;opacity:.75}

@media (max-width:680px){
  .toolbar input[type="search"]{min-width:0;width:100%}
  .pb-card{padding:1rem 1.1rem}
  .pb-card h3{font-size:1rem}
}
</style>
</head>
<body>
  <main>
    <div class="page-head">
      <div>
        <div class="eyebrow">Brand · Strategy · Voice</div>
        <h1>PLAY<span class="accent">book</span></h1>
      </div>
      <div class="actions">
        <span class="live-dot" id="live-indicator">Live syncing</span>
        <button class="btn primary" data-action="new-item">+ New item</button>
      </div>
    </div>

    <div class="kpi-grid">
      <div class="card"><div class="label">Active items</div><div class="value" id="k-total">—</div><div class="delta flat">In the vault</div></div>
      <div class="card"><div class="label">Pinned</div><div class="value" id="k-pinned">—</div><div class="delta flat">Top of mind</div></div>
      <div class="card"><div class="label">Personal brand</div><div class="value" id="k-pb">—</div><div class="delta flat">Captions, hooks, identity</div></div>
      <div class="card"><div class="label">Plugverse</div><div class="value" id="k-pv">—</div><div class="delta flat">Voice, hooks, ideas</div></div>
    </div>

    <div class="toolbar">
      <div class="row">
        <span class="lbl">Scope</span>
        <button class="pill on" data-filter="scope" data-v="all">All</button>
        <button class="pill" data-filter="scope" data-v="personal-brand">Personal brand</button>
        <button class="pill" data-filter="scope" data-v="plugverse">Plugverse</button>
        <button class="pill" data-filter="scope" data-v="both">Both</button>
      </div>
      <div class="row" id="type-row">
        <span class="lbl">Type</span>
        <button class="pill on" data-filter="type" data-v="all">All</button>
      </div>
      <div class="row">
        <input type="search" id="q" placeholder="Search title, summary, body, tags…" autocomplete="off" />
        <button class="pill" data-filter="pinned" data-v="on">Pinned only</button>
      </div>
    </div>

    <h2 class="section-h">Items <span class="accent" id="ax-count">—</span></h2>
    <div class="pb-list" id="pb-list"></div>
  </main>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-grip"></div>
    <div id="sheet-body"></div>
  </div>

  <script type="module" src="/admin/playbook/_js/playbook.js"></script>
</body>
</html>
