<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>Academics · CD Admin</title>
<link rel="stylesheet" href="/admin/_shell/admin-shell.css" />
<style>
  .acad-hero { display:grid; grid-template-columns: auto 1fr; gap:2rem; align-items:center;
    padding:1.8rem 2rem; border-radius:22px; margin-bottom:2rem; border:1px solid var(--line);
    background:var(--glass); box-shadow:var(--glass-edge), var(--glass-glow); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); }
  .ring-wrap { position:relative; width:150px; height:150px; }
  .ring-wrap .num { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring-wrap .num b { font-family:var(--f-display); font-size:2rem; line-height:1; }
  .ring-wrap .num span { font-family:"Geist Mono",monospace; font-size:0.55rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--muted); margin-top:0.2rem; }
  .hero-facts { display:flex; flex-wrap:wrap; gap:1.6rem 2.4rem; }
  .fact .k { font-family:"Geist Mono",monospace; font-size:0.58rem; letter-spacing:0.22em; text-transform:uppercase; color:var(--muted); }
  .fact .v { font-family:var(--f-display); font-size:1.5rem; line-height:1.1; margin-top:0.2rem; }
  .fact .v small { font-family:var(--f-ui); font-size:0.72rem; color:var(--ink-2); font-weight:400; }
  .fact .v.rust { color:var(--rust); }

  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:1rem; margin-bottom:1.6rem; }
  .prog { margin-top:0.7rem; }
  .prog .bar { height:8px; border-radius:999px; background:rgba(244,239,230,0.08); overflow:hidden; }
  .prog .bar i { display:block; height:100%; border-radius:999px; background:var(--accent,var(--rust)); }
  .prog .pl { display:flex; justify-content:space-between; font-family:"Geist Mono",monospace; font-size:0.6rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); margin-top:0.4rem; }
  .prog-card.major  { --accent:var(--rust); }
  .prog-card.cs     { --accent:var(--pastel-cyan); }
  .prog-card.music  { --accent:var(--pastel-lavender); }
  .prog-card .htitle { display:flex; align-items:center; justify-content:space-between; gap:0.5rem; }
  .prog-card .htitle b { font-family:var(--f-ui); font-weight:600; font-size:1.02rem; }
  .badge { font-family:"Geist Mono",monospace; font-size:0.55rem; letter-spacing:0.16em; text-transform:uppercase; padding:0.2rem 0.5rem; border-radius:999px; border:1px solid currentColor; }

  .acad-todo { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); column-gap:28px; }
  .acad-todo li { list-style:none; display:flex; gap:0.7rem; align-items:flex-start; padding:0.55rem 0; border-bottom:1px solid rgba(244,239,230,0.06); font-size:0.9rem; }
  .acad-todo li:last-child { border-bottom:0; }
  .acad-todo .chk { width:16px; height:16px; border-radius:5px; border:1.5px solid var(--muted); flex:0 0 auto; margin-top:0.15rem; }
  .acad-todo .hrs { margin-left:auto; font-family:"Geist Mono",monospace; font-size:0.65rem; color:var(--muted); white-space:nowrap; }

  /* timeline */
  .timeline { display:grid; grid-template-columns:repeat(4,1fr); gap:0.9rem; }
  @media(max-width:1100px){ .timeline{ grid-template-columns:1fr 1fr; } } @media(max-width:700px){ .timeline{ grid-template-columns:1fr; } .acad-hero{ grid-template-columns:1fr; justify-items:start; padding:18px; } }
  .term { border:1px solid var(--line); border-radius:18px; padding:1rem 1.1rem; background:var(--glass); box-shadow:var(--glass-edge); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); }
  .term.abroad { border-color:rgba(242,193,209,0.5); background:radial-gradient(120% 120% at 80% 0%, rgba(242,193,209,0.12), transparent 60%); }
  .term.done { opacity:0.72; }
  .term h4 { font-family:"Geist Mono",monospace; font-size:0.62rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--muted); }
  .term .th { font-family:var(--f-display); font-size:1.05rem; margin:0.25rem 0 0.7rem; }
  .term .abroad-tag { color:var(--pastel-pink); }
  .term ul { list-style:none; display:flex; flex-direction:column; gap:0.35rem; }
  .term li { font-size:0.8rem; display:flex; gap:0.4rem; }
  .term li .cr { margin-left:auto; font-family:"Geist Mono",monospace; font-size:0.62rem; color:var(--muted); }
  .term .st { font-family:"Geist Mono",monospace; font-size:0.55rem; letter-spacing:0.18em; text-transform:uppercase; margin-top:0.7rem; color:var(--sage); }

  .sa-card { display:grid; grid-template-columns:1fr auto; gap:1.4rem; align-items:center; }
  .deadline { text-align:right; }
  .deadline .d-lab { font-family:"Geist Mono",monospace; font-size:0.58rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--muted); }
  .deadline .d-val { font-family:var(--f-display); font-size:1.6rem; color:var(--rust); line-height:1; }
  .deadline .d-cd { font-family:"Geist Mono",monospace; font-size:0.7rem; color:var(--ink-2); margin-top:0.3rem; }
</style>
</head>
<body>
  <main>
    <div class="page-head">
      <div><h1>Academics</h1></div>
      <div class="actions"><span class="live-dot">Grad · Spring 2028</span></div>
    </div>
    <div id="root"></div>
  </main>
  <script type="module" src="/admin/academics/_js/academics.js"></script>
</body>
</html>
