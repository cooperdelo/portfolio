<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>Social · CD Admin</title>
<link rel="stylesheet" href="/admin/_shell/admin-shell.css" />
<style>
  .tabs { display: flex; gap: 0.4rem; margin-bottom: 1.6rem; flex-wrap: wrap; }
  .tab { font-family: "Geist Mono", monospace; font-size: 0.7rem; letter-spacing: 0.22em; text-transform: uppercase; padding: 0.7rem 1.1rem; border-radius: 999px; background: rgba(244,239,230,0.04); border: 1px solid var(--card-border); color: var(--ink-2); cursor: pointer; transition: all 0.2s; }
  .tab:hover { color: var(--ink); border-color: rgba(244,239,230,0.3); }
  .tab.active { background: rgba(255,77,46,0.1); border-color: rgba(255,77,46,0.5); color: var(--ink); }

  .post-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0.9rem; margin-bottom: 2rem; }
  .post { padding: 0; border-radius: 14px; overflow: hidden; background: var(--card-bg); border: 1px solid var(--card-border); transition: border-color 0.25s; }
  .post:hover { border-color: var(--card-border-hover); }
  .post .thumb { position: relative; overflow: hidden; aspect-ratio: 1 / 1; background: #14110F center/cover no-repeat; position: relative; }
  .post .thumb .badge { position: absolute; top: 0.6rem; left: 0.6rem; font-family: "Geist Mono", monospace; font-size: 0.55rem; letter-spacing: 0.18em; text-transform: uppercase; padding: 0.25rem 0.5rem; border-radius: 4px; background: rgba(0,0,0,0.6); color: var(--ink); }
  .post .body { padding: 0.85rem 1rem 1rem; }
  .post .cap { font-family: "Geist", sans-serif; font-size: 0.82rem; line-height: 1.4; color: var(--ink-2); margin-bottom: 0.6rem; max-height: 3.4rem; overflow: hidden; }
  .post .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem 0.7rem; font-family: "Geist Mono", monospace; font-size: 0.6rem; letter-spacing: 0.1em; color: var(--muted); }
  .post .stats .stat { display: flex; flex-direction: column; gap: 0.05rem; min-width: 0; }
  .post .stats .stat .n { font-family:var(--f-display); font-size: 1.05rem; color: var(--ink); letter-spacing: 0; line-height: 1; }
  .post .stats .stat .n.muted { color: var(--muted); }
  .post .stats .stat .lbl { font-size: 0.55rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
  .post .stats .stat .lbl .pct { color: var(--sage); margin-left: 0.25rem; }
  .post .date { font-family: "Geist Mono", monospace; font-size: 0.58rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-top: 0.7rem; padding-top: 0.55rem; border-top: 1px solid rgba(244,239,230,0.06); }

  .err-banner { font-family: "Geist Mono", monospace; font-size: 0.7rem; letter-spacing: 0.08em; color: var(--rust); padding: 0.7rem 1rem; border: 1px solid rgba(255,77,46,0.4); border-radius: 10px; background: rgba(255,77,46,0.05); margin-bottom: 1.4rem; }
  .err-banner strong { color: var(--rust); }
  .err-banner a { color: var(--rust); text-decoration: underline; text-underline-offset: 3px; }

  .connect-cta { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .connect-cta .text { font-family: "Geist Mono", monospace; font-size: 0.78rem; letter-spacing: 0.08em; color: var(--ink-2); }

  /* Top posts horizontal scroller */
  .top-row { display: grid; grid-template-columns: repeat(5, minmax(200px, 1fr)); gap: 0.7rem; margin-bottom: 1.8rem; }
  @media (max-width: 1100px) { .top-row { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 760px)  { .top-row { grid-template-columns: repeat(2, 1fr); } }
  .top-card { padding: 0; overflow: hidden; cursor: pointer; }
  .top-card .rank { position: absolute; top: 0.55rem; left: 0.55rem; font-family:var(--f-display); font-size: 1.6rem; color: var(--ink); text-shadow: 0 0 8px rgba(0,0,0,0.7); line-height: 1; }
  .top-card .thumb { overflow: hidden; aspect-ratio: 1 / 1; background: #14110F center/cover no-repeat; position: relative; }
  .top-card .body { padding: 0.7rem 0.85rem; }
  .top-card .views { font-family:var(--f-display); font-size: 1.3rem; color: var(--rust); line-height: 1; margin-bottom: 0.2rem; }
  .top-card .lbl  { font-family: "Geist Mono", monospace; font-size: 0.52rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
  .top-card .cap  { font-family: "Geist", sans-serif; font-size: 0.74rem; color: var(--ink-2); margin-top: 0.4rem; line-height: 1.35; max-height: 2rem; overflow: hidden; }

  /* Hashtag table */
  .ht-tbl { width: 100%; }
  .ht-tag { font-family: "Geist Mono", monospace; font-size: 0.78rem; color: var(--rust); letter-spacing: 0.01em; }
  .ht-tbl .n { font-family:var(--f-display); font-size: 1.05rem; color: var(--ink); letter-spacing: 0; line-height: 1; }

  /* Watch-time leaderboard rows */
  .wt-row { display: grid; grid-template-columns: 2.4rem 4rem 1fr 5rem 5rem; gap: 0.9rem; padding: 0.85rem 1.2rem; align-items: center; border-bottom: 1px solid rgba(244,239,230,0.06); transition: background 0.15s; cursor: pointer; }
  .wt-row:hover { background: rgba(244,239,230,0.025); }
  .wt-row:last-child { border-bottom: 0; }
  .wt-row .rank { font-family:var(--f-display); font-size: 1.3rem; color: var(--ink); }
  .wt-row .thumb { width: 4rem; height: 4rem; border-radius: 6px; background: #14110F center/cover no-repeat; }
  .wt-row .cap { font-family: "Geist", sans-serif; font-size: 0.85rem; color: var(--ink-2); line-height: 1.4; max-height: 2.8rem; overflow: hidden; }
  .wt-row .meta { font-family: "Geist Mono", monospace; font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-top: 0.25rem; }
  .wt-row .stat { text-align: right; }
  .wt-row .stat .n { font-family:var(--f-display); font-size: 1.15rem; color: var(--ink); line-height: 1; }
  .wt-row .stat .lbl { font-family: "Geist Mono", monospace; font-size: 0.55rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-top: 0.2rem; }
  @media (max-width: 720px) {
    .wt-row { grid-template-columns: 2rem 3.2rem 1fr 4rem; }
    .wt-row .stat:nth-child(5) { display: none; }
  }

  /* Post detail sheet */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.78); z-index: 90; opacity: 0; pointer-events: none; transition: opacity 0.35s; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 50%; top: 50%; transform: translate(-50%, calc(-50% + 4rem)); width: min(880px, 94vw); max-height: 90vh; overflow-y: auto; background: rgba(20,17,15,0.94); backdrop-filter: blur(40px) saturate(180%); border: 1px solid rgba(244,239,230,0.14); border-radius: 22px; padding: 1.8rem 2rem 2rem; z-index: 95; opacity: 0; pointer-events: none; transition: all 0.4s cubic-bezier(0.22,1,0.36,1); }
  .sheet.on { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%); }
  .sheet .close { position: absolute; top: 1rem; right: 1.1rem; font-family: "Geist Mono", monospace; font-size: 0.65rem; letter-spacing: 0.22em; text-transform: uppercase; padding: 0.5rem 0.8rem; border-radius: 999px; background: rgba(244,239,230,0.05); border: 1px solid rgba(244,239,230,0.1); color: var(--ink-2); cursor: pointer; transition: all 0.15s; }
  .sheet .close:hover { color: var(--rust); border-color: var(--rust); }
  .sheet h2 { font-family: "Geist", sans-serif; font-weight: 600; font-size: 1.25rem; line-height: 1.2; letter-spacing: -0.01em; margin: 0 0 1rem; padding-right: 4rem; }
  .sheet .detail-layout { display: grid; grid-template-columns: 220px 1fr; gap: 1.4rem; margin-bottom: 1.4rem; }
  @media (max-width: 680px) { .sheet .detail-layout { grid-template-columns: 1fr; } }
  .sheet .d-thumb { aspect-ratio: 1 / 1; background: #14110F center/cover no-repeat; border-radius: 10px; }
  .sheet .d-caption { font-family: "Geist", sans-serif; font-size: 0.92rem; line-height: 1.55; color: var(--ink-2); white-space: pre-wrap; max-height: 220px; overflow-y: auto; }
  .sheet .d-meta { font-family: "Geist Mono", monospace; font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-top: 0.6rem; }
  .sheet .d-meta a { color: var(--rust); }
  .sheet .d-stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.5rem; margin-bottom: 1.4rem; }
  @media (max-width: 680px) { .sheet .d-stats { grid-template-columns: repeat(3, 1fr); } }
  .sheet .d-stat { padding: 0.7rem 0.8rem; background: rgba(244,239,230,0.03); border: 1px solid rgba(244,239,230,0.07); border-radius: 8px; }
  .sheet .d-stat .n { font-family:var(--f-display); font-size: 1.2rem; color: var(--ink); line-height: 1; }
  .sheet .d-stat .n.muted { color: var(--muted); }
  .sheet .d-stat .lbl { font-family: "Geist Mono", monospace; font-size: 0.55rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-top: 0.3rem; }
  .sheet .chart-h { font-family: "Geist", sans-serif; font-weight: 600; font-size: 0.95rem; letter-spacing: -0.005em; color: var(--ink); margin: 0 0 0.6rem; }
  .sheet .chart-wrap { position: relative; height: 240px; }
</style>
</head>
<body>
  <main>
    <div class="page-head">
      <div>
        <h1>Social</h1>
      </div>
      <div class="actions">
        <span class="live-dot" id="live-indicator">Loading</span>
        <button class="btn" id="refresh-btn" title="Re-reads the database. The data itself is pulled automatically; no token needed here.">Reload</button>
      </div>
    </div>

    <div class="tabs" id="plat-tabs">
      <button class="tab active" data-tab="instagram">Instagram</button>
      <button class="tab" data-tab="tiktok">TikTok</button>
      <button class="tab" data-tab="linkedin">LinkedIn</button>
      <button class="tab" data-tab="youtube">YouTube</button>
    </div>
    <div class="tabs" id="acct-tabs" style="margin-top:-0.8rem"></div>

    <div id="error-slot"></div>

    <div class="kpi-grid" id="kpi-slot">
      <div class="card"><div class="label">Followers</div><div class="value" data-k="followers">—</div><div class="delta flat" data-k="followers_sub">—</div></div>
      <div class="card"><div class="label">Posts total</div><div class="value" data-k="posts_total">—</div><div class="delta flat" data-k="posts_sub">—</div></div>
      <div class="card"><div class="label">Last post</div><div class="value" data-k="last_post">—</div><div class="delta flat" data-k="last_post_sub">—</div></div>
      <div class="card"><div class="label" data-k="sum_label">Views, last 30 days</div><div class="value" data-k="sum30">—</div><div class="delta flat" data-k="sum30_sub">—</div></div>
    </div>

    <h2 class="section-h">Top 5 · <span class="accent">last 30 days</span></h2>
    <div class="top-row" id="top-row"></div>

    <h2 class="section-h">Hashtag <span class="accent">performance</span></h2>
    <div class="card" id="hashtag-card" style="padding:0;overflow:hidden;margin-bottom:2rem">
      <div class="tbl-wrap">
        <table class="data ht-tbl">
          <thead><tr><th>Hashtag</th><th class="right">Posts</th><th class="right" data-k="ht_total">Total views</th><th class="right" data-k="ht_avg">Avg views</th><th class="right">vs account avg</th></tr></thead>
          <tbody id="hashtag-tbody"><tr><td colspan="5" class="empty">—</td></tr></tbody>
        </table>
      </div>
    </div>

    <h2 class="section-h">Recent posts</h2>
    <div class="post-grid" id="post-grid">
      <div class="empty" style="grid-column:1/-1;">Loading…</div>
    </div>
  </main>

  <script type="module">
    // 2026-09-28 admin-stale-sweep: this page used to call /api/instagram-sync and
    // /api/tiktok-sync, which need a hand-registered OAuth token (IG expired Jul 12,
    // TikTok access Jun 15) and don't exist off-production (the host answered the
    // plain text "not found", which broke JSON.parse -> "Offline"). It now reads
    // only the automatic feeds: v_social_posts_latest (posts + newest metrics +
    // cached thumbnails) and social_account_snapshots (followers / post counts).
    // "Reload" = re-query. Nothing here needs a token or a manual step.
    import { sb, requireFullAdminOrRedirect } from '/admin/_shell/supabase.js';
    import { mountShell } from '/admin/_shell/admin-shell.js';
    import { socialPostsLatest, accountSnapshotsLatest, FEED_ACCOUNTS, isDemo } from '/admin/_shell/live-data.js';
    import { esc, fmtNum, fmtCompact, ago, fmtDay, staleChip } from '/admin/_shell/ui.js';

    if (!isDemo() && !(await requireFullAdminOrRedirect())) throw new Error('access denied');
    await mountShell({ title: 'Social · Analytics', demo: true });

    const $ = (id) => document.getElementById(id);
    const setK = (k, html) => { const e = document.querySelector(`[data-k="${k}"]`); if (e) e.innerHTML = html; };
    const ind = $('live-indicator');
    const STALE_H = { instagram: 48, tiktok: 48, youtube: 72, linkedin: 48 };
    const NAME = { instagram: 'Instagram', tiktok: 'TikTok', linkedin: 'LinkedIn', youtube: 'YouTube' };
    let plat = 'instagram', handle = 'cooperdelo';
    let POSTS = null, ACCTS = null;

    const metricOf = (p) => p.platform === 'linkedin'
      ? (p.impressions != null ? { v: Number(p.impressions), l: 'impressions' } : { v: p.likes == null ? null : Number(p.likes), l: 'reactions' })
      : (p.views != null ? { v: Number(p.views), l: 'views' } : { v: p.likes == null ? null : Number(p.likes), l: 'likes' });
    const tagsOf = (cap) => [...new Set((String(cap || '').match(/#[\p{L}\p{N}_]+/gu) || []).map(t => t.toLowerCase()))];
    const handles = (pl) => (FEED_ACCOUNTS[pl] || []).filter(h => h !== 'cooper delo');
    const sameHandle = (a, b) => String(a || '').toLowerCase().replace(/\s+/g, '') === String(b || '').toLowerCase().replace(/\s+/g, '');

    async function load() {
      ind.textContent = 'Loading';
      $('error-slot').innerHTML = '';
      try {
        [POSTS, ACCTS] = await Promise.all([socialPostsLatest({ limit: 1000 }), accountSnapshotsLatest()]);
        render();
      } catch (e) {
        $('error-slot').innerHTML = `<div class="err-banner"><strong>Couldn't read the database:</strong> ${esc(e?.message || e)}</div>`;
        ind.textContent = 'Error';
      }
    }

    function acctTabs() {
      const hs = handles(plat);
      if (!hs.includes(handle)) handle = hs[0] || 'cooperdelo';
      $('acct-tabs').innerHTML = hs.length > 1 ? hs.map(h => `<button class="tab ${h === handle ? 'active' : ''}" data-h="${esc(h)}">@${esc(h)}</button>`).join('') : '';
    }

    function render() {
      acctTabs();
      // Posts for this platform + handle, deduped (the June TikTok import used the display name).
      const seen = new Set();
      const posts = (POSTS || []).filter(p => p.platform === plat && sameHandle(p.account_handle, handle))
        .filter(p => { const k = (p.posted_at || '').slice(0, 16) + '|' + String(p.caption || '').slice(0, 40); if (seen.has(k)) return false; seen.add(k); return true; })
        .sort((a, b) => new Date(b.posted_at) - new Date(a.posted_at));
      const acct = (ACCTS || []).find(a => a.platform === plat && sameHandle(a.handle, handle));
      const mLabel = plat === 'linkedin' ? (posts.some(p => p.impressions != null) ? 'impressions' : 'reactions') : 'views';

      // KPIs — every number carries its date and source.
      if (acct) {
        const prev = acct.history.find(h => h.date !== acct.date && h.followers != null);
        const delta = prev && acct.followers != null ? acct.followers - prev.followers : null;
        setK('followers', fmtNum(acct.followers));
        setK('followers_sub', `@${esc(acct.handle)} · as of ${esc(fmtDay(acct.date))}${delta != null ? ` · ${delta >= 0 ? '+' : '−'}${fmtNum(Math.abs(delta))} since ${esc(fmtDay(prev.date))}` : ''} ${staleChip(acct.captured_at || acct.date, STALE_H[plat])}`);
        setK('posts_total', acct.posts_total != null ? fmtNum(acct.posts_total) : fmtNum(posts.length));
        setK('posts_sub', acct.posts_total != null ? `on profile · as of ${esc(fmtDay(acct.date))}` : `posts on file (profile count not reported)`);
      } else {
        setK('followers', '—'); setK('followers_sub', `No follower snapshot for @${esc(handle)} yet`);
        setK('posts_total', fmtNum(posts.length)); setK('posts_sub', 'posts on file');
      }
      const last = posts[0];
      const lastDays = last ? Math.floor((Date.now() - new Date(last.posted_at)) / 864e5) : null;
      setK('last_post', last ? (lastDays === 0 ? 'Today' : lastDays + 'd ago') : '—');
      setK('last_post_sub', last ? esc(fmtDay(last.posted_at, { month: 'short', day: 'numeric', year: 'numeric' })) : 'No posts on file');
      const cut = Date.now() - 30 * 864e5;
      const recent = posts.filter(p => new Date(p.posted_at).getTime() >= cut);
      const sum = recent.reduce((a, p) => a + (metricOf(p).v || 0), 0);
      const asOf = posts.map(p => p.as_of).filter(Boolean).sort().pop();
      setK('sum_label', `${mLabel[0].toUpperCase() + mLabel.slice(1)}, last 30 days`);
      setK('sum30', recent.length ? fmtCompact(sum) : '—');
      setK('sum30_sub', `${recent.length} post${recent.length === 1 ? '' : 's'}${asOf ? ` · metrics as of ${esc(fmtDay(asOf))}` : ''} ${asOf ? staleChip(asOf, STALE_H[plat]) : ''}`);

      // Top 5, last 30 days, by the platform's key metric.
      const top = recent.filter(p => metricOf(p).v != null).sort((a, b) => metricOf(b).v - metricOf(a).v).slice(0, 5);
      $('top-row').innerHTML = top.length ? top.map((p, i) => card(p, i + 1, true)).join('')
        : `<div class="empty" style="grid-column:1/-1;padding:1.6rem 1rem;">${recent.length ? `No ${mLabel} on the last 30 days of posts yet.` : `No posts in the last 30 days.`}</div>`;

      // Hashtag performance, computed from captions.
      const withM = posts.filter(p => metricOf(p).v != null);
      const acctAvg = withM.length ? withM.reduce((a, p) => a + metricOf(p).v, 0) / withM.length : 0;
      const map = new Map();
      for (const p of withM) for (const t of tagsOf(p.caption)) { const e = map.get(t) || { t, n: 0, sum: 0 }; e.n++; e.sum += metricOf(p).v; map.set(t, e); }
      const rows = [...map.values()].filter(h => h.n >= 1).sort((a, b) => (b.sum / b.n) - (a.sum / a.n)).slice(0, 15);
      setK('ht_total', `Total ${mLabel}`); setK('ht_avg', `Avg ${mLabel}`);
      $('hashtag-tbody').innerHTML = rows.length ? rows.map(h => {
        const avg = h.sum / h.n, rel = acctAvg ? avg / acctAvg : null;
        return `<tr><td><span class="ht-tag">${esc(h.t)}</span></td><td class="right mono"><span class="n">${fmtNum(h.n)}</span></td>
          <td class="right mono"><span class="n">${fmtCompact(h.sum)}</span></td><td class="right mono"><span class="n">${fmtCompact(Math.round(avg))}</span></td>
          <td class="right mono" style="color:${rel == null ? 'var(--muted)' : rel >= 1 ? 'var(--good,#7A8A6E)' : 'var(--rust)'}">${rel == null ? '—' : rel.toFixed(1) + '×'}</td></tr>`;
      }).join('') : `<tr><td colspan="5" class="empty">${posts.length ? 'No hashtags in captions that have metrics.' : '—'}</td></tr>`;

      // Recent posts with cached thumbnails.
      $('post-grid').innerHTML = posts.length ? posts.slice(0, 24).map(p => card(p)).join('')
        : `<div class="empty" style="grid-column:1/-1;">No ${NAME[plat]} posts on file for @${esc(handle)}.</div>`;
      ind.textContent = `${NAME[plat]} · ${posts.length} posts${asOf ? ' · as of ' + fmtDay(asOf) : ''}`;
    }

    function card(p, rank, compact) {
      const m = metricOf(p);
      const cap = String(p.caption || '').replace(/\s+/g, ' ').trim();
      const first = cap.slice(0, compact ? 70 : 130) || '(no caption)';
      const thumb = p.thumb_url ? `<img src="${esc(p.thumb_url)}" alt="" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" onerror="this.remove()">` : '';
      // No cached thumbnail: a quiet tint tile with a platform mark (the caption is already below).
      const fallback = `<div style="position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(120% 90% at 30% 20%,rgba(255,77,46,.10),transparent 60%),#14110F;font-family:'Geist Mono',monospace;font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)">${esc(NAME[p.platform] || '')} · no thumbnail</div>`;
      const href = p.permalink ? ` href="${esc(p.permalink)}" target="_blank" rel="noopener"` : '';
      if (compact) return `<a class="card top-card"${href} style="display:block;color:inherit;text-decoration:none">
        <div class="thumb">${fallback}${thumb}<span class="rank">${rank}</span></div>
        <div class="body"><div class="views">${m.v == null ? '—' : fmtCompact(m.v)}</div><div class="lbl">${esc(m.l)}</div><div class="cap">${esc(first)}</div></div></a>`;
      const st = (l, v) => `<div class="stat"><span class="n ${v == null ? 'muted' : ''}">${v == null ? '—' : fmtCompact(v)}</span><span class="lbl">${l}</span></div>`;
      const cells = p.platform === 'linkedin'
        ? [st('impr.', p.impressions), st('reactions', p.likes), st('comments', p.comments)]
        : [st('views', p.views), st('likes', p.likes), st('comments', p.comments)];
      return `<a class="post"${href} style="display:block;color:inherit;text-decoration:none">
        <div class="thumb">${fallback}${thumb}<span class="badge">${esc(p.media_type || NAME[p.platform])}</span></div>
        <div class="body"><div class="cap">${esc(first)}</div><div class="stats">${cells.join('')}</div>
        <div class="date">${esc(fmtDay(p.posted_at, { month: 'short', day: '2-digit', year: 'numeric' }))}${p.as_of ? ` · metrics ${esc(fmtDay(p.as_of))}` : ' · no metrics yet'}</div></div></a>`;
    }

    $('plat-tabs').addEventListener('click', e => {
      const b = e.target.closest('[data-tab]'); if (!b) return;
      document.querySelectorAll('#plat-tabs .tab').forEach(x => x.classList.toggle('active', x === b));
      plat = b.dataset.tab; handle = 'cooperdelo'; if (POSTS) render();
    });
    $('acct-tabs').addEventListener('click', e => {
      const b = e.target.closest('[data-h]'); if (!b) return;
      handle = b.dataset.h; render();
    });
    $('refresh-btn').addEventListener('click', load);
    await load();
  </script>
</body>
</html>
