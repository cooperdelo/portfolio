<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>Admin · Cooper Delo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Geist+Mono:wght@300..700&family=Geist:wght@300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/admin/_shell/admin-shell.css" />
<style>
  body { display: grid; place-items: center; min-height: 100vh; padding: 2rem; }
  .login-card {
    width: min(440px, 100%);
    background: rgba(244,239,230,0.04);
    border: 1px solid rgba(244,239,230,0.12);
    border-radius: 22px;
    padding: 2.6rem 2.2rem;
    backdrop-filter: blur(28px) saturate(150%);
    -webkit-backdrop-filter: blur(28px) saturate(150%);
    box-shadow: 0 1px 0 rgba(244,239,230,0.1) inset, 0 -1px 0 rgba(0,0,0,0.5) inset, 0 40px 120px -40px rgba(0,0,0,0.8);
    position: relative;
  }
  .login-card .eyebrow {
    font-family: "Geist Mono", monospace;
    font-size: 0.65rem; letter-spacing: 0.3em; text-transform: uppercase;
    color: rgba(255,77,46,0.8); margin-bottom: 1.6rem;
  }
  .login-card h1 {
    font-family: "Anton", Impact, sans-serif;
    font-size: clamp(2.4rem, 6vw, 3.6rem); line-height: 0.9;
    text-transform: uppercase; letter-spacing: -0.015em; margin-bottom: 0.6rem;
  }
  .login-card h1 .accent {
    font-family: "Fraunces", Georgia, serif;
    font-style: italic; font-weight: 300; text-transform: none;
    font-variation-settings: "opsz" 144, "WONK" 1, "SOFT" 100;
    color: var(--rust, #FF4D2E);
  }
  .login-card .lede {
    font-family: "Fraunces", Georgia, serif;
    font-size: 1.1rem; line-height: 1.4; color: var(--ink-2);
    margin-bottom: 1.8rem;
  }
  .login-card form { display: flex; flex-direction: column; gap: 0.8rem; }
  .login-card .stamp {
    margin-top: 1.6rem; padding-top: 1.2rem;
    border-top: 1px solid rgba(244,239,230,0.1);
    font-family: "Geist Mono", monospace;
    font-size: 0.6rem; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--muted, #6F6A60);
    display: flex; justify-content: space-between;
  }
  .login-card .ok-msg {
    margin-top: 1rem; padding: 0.9rem 1rem;
    background: rgba(122,138,110,0.1);
    border: 1px solid rgba(122,138,110,0.4);
    border-radius: 10px;
    font-family: "Geist Mono", monospace;
    font-size: 0.72rem; line-height: 1.5; color: var(--ink-2);
    display: none;
  }
  .login-card .ok-msg.show { display: block; }
  .login-card .home-link {
    position: absolute; top: 1.2rem; left: 1.2rem;
    font-family: "Geist Mono", monospace; font-size: 0.6rem;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--muted); transition: color 0.2s;
  }
  .login-card .home-link:hover { color: var(--rust, #FF4D2E); }
</style>
</head>
<body>
  <div class="login-card">
    <a href="/" class="home-link">← Back to site</a>
    <div class="eyebrow">Admin · Restricted</div>
    <h1>SIGN <span class="accent">in</span></h1>
    <p class="lede">One-tap sign-in. Magic link goes to the allowlisted inbox.</p>
    <form id="login-form" autocomplete="off">
      <button class="btn primary" type="submit" id="submit-btn">Send me a magic link</button>
    </form>
    <div class="ok-msg" id="ok-msg">
      Sent. Check your inbox for the sign-in link.
    </div>
    <div class="stamp">
      <span>cooperdelo.com</span>
      <span id="ts"></span>
    </div>
  </div>

  <script type="module">
    import { sendMagicLink, isAdmin, ADMIN_EMAIL } from '/admin/_shell/supabase.js';

    document.getElementById('ts').textContent = new Date().toISOString().slice(0,10);

    // If already signed in, bounce to admin home (or ?next= target)
    if (await isAdmin()) {
      const params = new URLSearchParams(location.search);
      location.replace(params.get('next') || '/admin/');
    }

    const form = document.getElementById('login-form');
    const btn  = document.getElementById('submit-btn');
    const ok   = document.getElementById('ok-msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true; btn.textContent = 'Sending…';
      const params = new URLSearchParams(location.search);
      const next = params.get('next') || '/admin/';
      const redirectTo = `${location.origin}${next}`;
      await sendMagicLink(ADMIN_EMAIL, redirectTo);
      ok.classList.add('show');
      btn.textContent = 'Sent';
      setTimeout(() => { btn.disabled = false; btn.textContent = 'Send me a magic link'; }, 20000);
    });
  </script>
</body>
</html>
