<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<link rel="manifest" href="/admin/manifest.json" />
<link rel="apple-touch-icon" href="/favicon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="CD Admin" />
<meta name="theme-color" content="#0A0A0A" />
<title>Admin · Cooper Delo</title>
<link rel="preload" href="/admin/_shell/fonts/DrukWideBold.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/admin/_shell/admin-shell.css" />
<style>
  body { display: grid; place-items: center; min-height: 100vh; padding: 2rem 16px; }
  .login-card { width: min(420px, 100%); padding: 2.2rem 1.9rem 1.6rem; position: relative; }
  .login-card .home-link { position: absolute; top: 1.1rem; right: 1.2rem; font-family: var(--f-mono); font-size: .62rem; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); transition: color .6s; }
  .login-card .home-link:hover { color: var(--text); }
  .login-card h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(2rem, 7vw, 2.8rem); line-height: .9; text-transform: uppercase; letter-spacing: -.01em; margin: 1.6rem 0 1.6rem; }
  .login-card form { display: flex; flex-direction: column; gap: .8rem; }
  .login-card .btn { justify-content: center; width: 100%; }
  .login-card .ok-msg, .login-card .err-msg { margin-top: 1rem; padding: .8rem 1rem; border-radius: 12px; font-size: .84rem; line-height: 1.45; display: none; border: 1px solid var(--border-2); background: rgba(244,241,234,.05); color: var(--text); }
  .login-card .err-msg { color: var(--neg); border-color: rgba(244,241,234,.4); background: var(--neg-tint); }
  .login-card .ok-msg.show, .login-card .err-msg.show { display: block; }
  .login-card .stamp { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border); font-family: var(--f-mono); font-size: .62rem; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); display: flex; justify-content: space-between; }
</style>
</head>
<body>
  <div class="login-card">
    <a href="/" class="home-link">cooperdelo.com</a>
    <h1>Admin</h1>
    <form id="login-form" autocomplete="off">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" />
      </div>
      <button class="btn primary" type="submit" id="submit-btn">Sign in</button>
      <button class="btn" type="button" id="link-btn">Email me a sign-in link instead</button>
    </form>
    <div class="ok-msg" id="ok-msg">
      Signed in. Redirecting…
    </div>
    <div class="err-msg" id="err-msg">
      Wrong email or password.
    </div>
    <div class="stamp">
      <span>Restricted</span>
      <span id="ts"></span>
    </div>
  </div>

  <script type="module">
    import { sb, isAdmin } from '/admin/_shell/supabase.js';

    document.getElementById('ts').textContent = new Date().toISOString().slice(0,10);

    const params = new URLSearchParams(location.search);

    // If already signed in, bounce to admin home (or ?next= target)
    if (await isAdmin()) {
      location.replace(params.get('next') || '/admin/');
    }

    const form = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const pwd  = document.getElementById('password');
    const btn  = document.getElementById('submit-btn');
    const ok   = document.getElementById('ok-msg');
    const err  = document.getElementById('err-msg');

    document.getElementById('link-btn').addEventListener('click', async () => {
      err.classList.remove('show'); ok.classList.remove('show');
      const email = emailInput.value.trim().toLowerCase();
      if (!email) { emailInput.focus(); return; }
      const lb = document.getElementById('link-btn');
      lb.disabled = true; lb.textContent = 'Sending...';
      const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false, emailRedirectTo: location.origin + (params.get('next') || '/admin/') } });
      lb.disabled = false;
      if (error) { lb.textContent = 'Email me a sign-in link instead'; err.textContent = 'Could not send the link: ' + error.message; err.classList.add('show'); return; }
      lb.textContent = 'Link sent. Check ' + email;
      ok.textContent = 'Open the email on this device and click the link.'; ok.classList.add('show');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.classList.remove('show');
      ok.classList.remove('show');

      const email = emailInput.value.trim().toLowerCase();
      if (!email || !pwd.value) return;

      btn.disabled = true; btn.textContent = 'Signing in…';
      const { error } = await sb.auth.signInWithPassword({ email, password: pwd.value });

      if (error) {
        err.classList.add('show');
        pwd.value = '';
        pwd.focus();
        btn.disabled = false; btn.textContent = 'Sign in';
        return;
      }

      ok.classList.add('show');
      btn.textContent = 'Signed in';
      const next = params.get('next') || '/admin/';
      location.replace(next);
    });
  </script>
</body>
</html>
