<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<link rel="manifest" href="/admin/manifest.json" />
<link rel="apple-touch-icon" href="/favicon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="CD Admin" />
<meta name="theme-color" content="#8B7CF6" />
<title>Home · CD Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300..700&family=Geist:wght@300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/admin/_shell/admin-shell.css" />
<style>
  .hello h1 { font-size: clamp(1.7rem, 3vw, 2.3rem); font-weight: 650; letter-spacing: -.03em; color: var(--text); }
  .hello .d { color: var(--text-3); font-size: .95rem; margin-top: .2rem; }
  .quick { display: flex; gap: .5rem; flex-wrap: wrap; margin: 1.1rem 0 .4rem; }
  .jump { display: flex; gap: .5rem; flex-wrap: wrap; }
  .jump a { font-size: .84rem; font-weight: 550; color: var(--text-2); padding: .45rem .8rem; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); }
  .jump a:hover { border-color: var(--border-2); color: var(--text); }
  .health-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: .9rem 1rem; margin-top: .6rem; }
  .health-grid .k { font-size: .76rem; color: var(--text-3); }
  .health-grid .v { font-size: 1.35rem; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--text); }
  .streaks { display: flex; flex-direction: column; gap: .5rem; margin-top: .9rem; }
</style>
</head>
<body>
<main>
  <section class="hello">
    <h1 id="greet">Hi, Cooper</h1>
    <div class="d" id="today"></div>
    <div class="quick">
      <a class="btn primary" href="/admin/health/log.html" data-role="full">Log a meal</a>
      <a class="btn" href="/admin/health/log.html" data-role="full">Log a workout</a>
      <a class="btn" href="/admin/finance/entry.html">Add expense</a>
      <a class="btn" href="/admin/contacts/">Add contact</a>
      <button class="btn ghost" data-openpalette>Search <kbd style="font-size:.72rem;color:var(--text-3)">Ctrl K</kbd></button>
    </div>
  </section>

  <section class="sv-section sv-grid split" data-role="full">
    <div class="sv-card pad-lg" id="mustdos"><div class="shimmer" style="height:120px"></div></div>
    <div class="sv-card pad-lg" id="decide"><div class="shimmer" style="height:120px"></div></div>
  </section>

  <section class="sv-section" data-role="full">
    <div class="sv-h"><h2>Pulse</h2><a href="/admin/insights/">All insights</a></div>
    <div class="sv-grid c4" id="pulse"><div class="shimmer" style="height:120px"></div></div>
  </section>

  <section class="sv-section sv-grid c2" data-role="full">
    <div class="sv-card pad-lg" id="health"><div class="shimmer" style="height:120px"></div></div>
    <div class="sv-card pad-lg" id="overnight"><div class="shimmer" style="height:120px"></div></div>
  </section>

  <section class="sv-section">
    <div class="sv-h"><h2>Everything else</h2><span class="sv-sub">The existing admin pages, restyled</span></div>
    <div class="jump">
      <a href="/admin/finance/">Finance</a><a href="/admin/finance/networth.html" data-role="full">Net worth</a><a href="/admin/finance/transactions.html">Transactions</a>
      <a href="/admin/health/dashboard.html" data-role="full">Health insights</a><a href="/admin/plugverse/">PlugVerse KPIs</a><a href="/admin/plugverse/ops.html">PlugVerse ops</a>
      <a href="/admin/life/" data-role="full">Life review</a><a href="/admin/academics/" data-role="full">Academics</a><a href="/admin/social/">Social dashboard</a>
      <a href="/admin/carousels/" data-role="full">Carousel Studio</a><a href="/admin/playbook/">Playbook</a><a href="/admin/contacts/">Contacts</a><a href="/admin/merch/" data-role="full">Merch</a>
    </div>
  </section>
</main>
<script type="module" src="/admin/_js/home.js"></script>
</body>
</html>
