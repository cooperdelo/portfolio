<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<link rel="manifest" href="/admin/health/manifest.json" />
<link rel="apple-touch-icon" href="/favicon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Health" />
<meta name="theme-color" content="#0C0B0A" />
<title>Health · CD Admin</title>
<link rel="stylesheet" href="/admin/_shell/admin-shell.css" />
<style>
  .kmini { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
  .kmini .sv-card { padding: 14px 16px; }
  .kmini .num { font-size: clamp(18px, 1.8vw, 24px); display: block; margin: 10px 0 2px; }
  .sev { display: inline-block; min-width: 26px; text-align: center; border-radius: 999px; padding: 1px 7px; font-weight: 700; }
  .sev.s1 { background: rgba(244, 241, 234, .08); } .sev.s2 { background: rgba(244, 241, 234, .2); } .sev.s3 { background: var(--bone); color: var(--ink-0); }
  tr.flarerow td { background: rgba(244, 241, 234, .05); }
  .sig { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--text-2); line-height: 1.5; }
  .sig:first-child { border-top: 0; padding-top: 0; }
  .sig .ic { color: var(--text); margin-top: 2px; }
  .flag { display: inline-flex; align-items: center; gap: 4px; color: var(--text); }
  @media (max-width: 900px) { .kmini { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
  @media (max-width: 600px) { #days th:nth-child(3), #days td:nth-child(3), #days th:nth-child(4), #days td:nth-child(4), #days th:nth-child(6), #days td:nth-child(6), #days th:nth-child(9), #days td:nth-child(9) { display: none; } }
</style>
</head>
<body>
  <main>
    <header class="page-head">
      <h1>Health</h1>
      <div class="actions">
        <a class="btn ghost" href="/admin/health/food.html">Food</a>
        <a class="btn primary" href="/admin/health/log.html" id="logBtn">Daily log</a>
      </div>
    </header>

    <section class="stat-row" id="kpis" style="--n:4"><div class="stat"><div class="shimmer" style="height:100%"></div></div><div class="stat"></div><div class="stat"></div><div class="stat"></div></section>
    <section class="kmini" id="kmini"></section>

    <section class="grid">
      <div class="sv-card span-7"><div class="sv-h"><h2>Sleep</h2><span class="mono" id="sleepMeta">14 nights · Garmin</span></div><div id="sleepChart"></div></div>
      <div class="span-5 col">
        <div class="sv-card"><div class="sv-h"><h2>Signals</h2></div><div id="signal"><div class="shimmer" style="height:80px"></div></div></div>
        <div class="sv-card"><div class="sv-h"><h2>Workouts</h2><span class="mono">Garmin</span></div><div class="rows" id="workouts"></div></div>
      </div>
    </section>

    <h2 class="section-h">30 days</h2>
    <div class="tbl-wrap">
      <table class="data" id="days">
        <thead><tr><th>Day</th><th>Sleep</th><th>Stress</th><th>Mood</th><th>Symptom</th><th>BMs</th><th>HBI proxy</th><th>Blood</th><th>Irritants</th></tr></thead>
        <tbody id="rows"><tr><td colspan="9" class="empty">Loading</td></tr></tbody>
      </table>
    </div>
  </main>
  <script type="module" src="/admin/health/_js/dashboard.js"></script>
</body>
</html>
