<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<link rel="manifest" href="/admin/manifest.json" />
<link rel="apple-touch-icon" href="/favicon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="CD Admin" />
<meta name="theme-color" content="#0C0B0A" />
<title>Home · CD Admin</title>
<link rel="stylesheet" href="/admin/_shell/admin-shell.css" />
<link rel="stylesheet" href="/admin/_shell/home.css" />
</head>
<body class="home">
<main>
  <header class="mast" id="mast">
    <div class="mast-l">
      <h1 id="greet">Hello, Cooper</h1>
    </div>
    <div class="quick">
      <button class="btn ghost" data-openpalette>Search <kbd>Ctrl K</kbd></button>
    </div>
  </header>

  <section class="today" id="today" data-role="full" aria-label="Today">
    <div class="td-status" id="tdStatus"><span class="td-dot"></span><span>Checking systems…</span></div>
    <div class="td-grid">
      <div class="sv-card pad-lg td-do" id="tdDo"><div class="shimmer" style="height:160px"></div></div>
      <div class="td-decide" id="tdDecide"><div class="shimmer" style="height:160px"></div></div>
    </div>
    <div class="sv-card pad-lg td-ladder" id="tdLadder"><div class="shimmer" style="height:140px"></div></div>
  </section>

  <section class="improve" data-role="full" aria-label="What to improve">
    <div class="sv-card pad-lg" id="improve"><div class="shimmer" style="height:160px"></div></div>
  </section>

  <section class="hero" id="hero" aria-label="Today at a glance">
    <div class="hero-top">
      <div></div>
      <div class="pulse-pill" id="pulsePill"><i></i><span>Loading…</span></div>
    </div>
    <div class="hero-grid" id="heroGrid">
      <div class="hero-cell sk"></div><div class="hero-cell sk"></div><div class="hero-cell sk"></div><div class="hero-cell sk"></div>
    </div>
    <div class="hero-chart" id="heroChart"></div>
  </section>

  <section class="sv-section" data-role="full">
    <div class="sv-h"><h2 class="disp">System pulse</h2><a href="/admin/rituals/">Rituals</a></div>
    <div class="sv-card pad-lg sys" id="system"><div class="shimmer" style="height:180px"></div></div>
  </section>

  <section class="sv-section" data-role="full">
    <div class="sv-h"><h2 class="disp">Audience</h2><a href="/admin/insights/">All insights</a></div>
    <div class="sv-grid c4 aud" id="pulse"><div class="shimmer" style="height:120px"></div></div>
  </section>

  <section class="sv-section pv" data-role="full" id="pvSec" hidden>
    <div class="sv-h"><h2 class="disp"><span class="pv-mark">PlugVerse</span> accounts</h2><a href="/admin/plugverse/">PlugVerse KPIs</a></div>
    <div class="sv-grid c4 aud" id="pvGrid"></div>
  </section>

  <section class="sv-section sv-grid c2" data-role="full">
    <div class="sv-card pad-lg" id="health"><div class="shimmer" style="height:120px"></div></div>
    <div class="sv-card pad-lg" id="vaultCard"><div class="shimmer" style="height:120px"></div></div>
  </section>
</main>
<script type="module" src="/admin/_js/home.js"></script>
</body>
</html>
