<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<link rel="manifest" href="/admin/health/manifest.json" />
<link rel="apple-touch-icon" href="/favicon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Health" />
<meta name="theme-color" content="#0C0B0A" />
<title>Daily Log · CD Admin</title>
<link rel="preload" href="/admin/_shell/fonts/DrukWideBold.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/admin/_shell/admin-shell.css" />
<style>
  /* v7 daily log: one screen, two columns. Inputs left, what the watch and the food
     analysis already know on the right. Every id is unchanged for log.js. */
  .lg-grid { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 14px; align-items: start; }
  .lg-col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  @media (max-width: 1100px) { .lg-grid { grid-template-columns: minmax(0, 1fr); } }
  .lg .card { padding: 20px 22px; }
  .lg .card > h2 { display: flex; align-items: baseline; gap: 10px; margin: 0 0 16px; font-family: var(--f-ui); font-weight: 700; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--text); }
  .lg .card > h2 .count { margin-left: auto; font-family: var(--f-mono); font-weight: 400; font-size: 10px; letter-spacing: .02em; color: var(--text-3); }
  .lg .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-top: 0; padding: 0; }
  .lg .k { display: block; font-weight: 700; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); margin: 16px 0 8px; }
  .lg .k:first-of-type { margin-top: 0; }
  .lg .k b { color: var(--text); font-family: var(--f-display); font-size: 12px; margin-left: 6px; }

  /* date bar in the header */
  .datenav { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
  .datenav button { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line-2); background: rgba(244, 241, 234, .05); color: var(--text); font-size: 18px; line-height: 1; display: grid; place-items: center; transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
  .datenav button:hover:not(:disabled) { background: var(--bone); color: var(--ink-0); }
  .datenav button:disabled { opacity: .3; cursor: default; }
  .datenav input[type=date] { width: 150px; min-height: 38px; border-radius: 999px; padding: 6px 14px; }
  .datenav .today-btn { width: auto; padding: 0 14px; border-radius: 999px; font-weight: 700; font-size: 12px; }
  .daylabel { font-family: var(--f-mono); font-size: 10.5px; text-transform: uppercase; color: var(--text-3); }
  .savedbadge { font-family: var(--f-mono); font-size: 10px; text-transform: uppercase; color: var(--text-3); clip-path: inset(0 100% 0 0); transition: clip-path var(--t) var(--ease); white-space: nowrap; }
  .savedbadge.show { clip-path: inset(0 0 0 0); }

  /* tap targets: pill segments */
  .tapgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  #thc { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .biggrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .tap { min-height: 44px; padding: 8px 6px; border-radius: 999px; border: 1px solid var(--line-2); background: rgba(244, 241, 234, .04); color: var(--text-2); font-weight: 700; font-size: 13px; text-align: center; user-select: none; transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease); }
  .biggrid .tap { font-family: var(--f-display); font-size: 16px; min-height: 52px; }
  .tap:hover { border-color: rgba(244, 241, 234, .4); color: var(--text); }
  .tap.on { background: var(--bone); color: var(--ink-0); border-color: var(--bone); }
  .tap.warn.on { background: transparent; color: var(--text); border-color: var(--bone); box-shadow: inset 0 0 0 1px var(--bone); }
  .row .tap { flex: 0 0 auto; padding: 8px 16px; }
  .bristol-help { font-family: var(--f-mono); font-size: 10px; text-transform: uppercase; color: var(--text-4); margin-top: 8px; }
  @media (max-width: 480px) { .biggrid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

  /* numbers the day already has */
  .daytotals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .daytotals .t b { display: block; font-family: var(--f-display); font-size: clamp(20px, 2vw, 28px); line-height: .95; font-variant-numeric: tabular-nums; }
  .daytotals .t span { display: block; margin-top: 8px; font-weight: 700; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
  .gstats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 12px; }
  .gstat .n { font-family: var(--f-display); font-size: 18px; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .gstat .l { margin-top: 6px; font-weight: 700; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }

  /* entries */
  .entries { display: flex; flex-direction: column; margin-bottom: 4px; }
  .entry { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; }
  .entries > :first-child .entry, .entries > .entry:first-child { border-top: 0; }
  .entry img { width: 48px; height: 48px; border-radius: 12px; object-fit: cover; background: rgba(244, 241, 234, .06); flex: 0 0 auto; }
  .entry .body { flex: 1 1 auto; min-width: 0; }
  .entry .body b { font-size: 13.5px; color: var(--text); }
  .entry .meta { font-size: 10px; margin-top: 3px; }
  .entry .btype { flex: 0 0 auto; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 10px; background: var(--fill-2); font-family: var(--f-display); font-size: 12px; color: var(--text); }
  .entry .del, .edit-btn { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--text-3); font-size: 15px; transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
  .entry .del:hover, .edit-btn:hover { background: var(--fill-2); color: var(--text); }
  .calbadge { font-family: var(--f-mono); font-size: 10px; padding: 2px 8px; border-radius: 999px; background: var(--fill-2); color: var(--text); }
  .lg .pill { font-size: 10px; }
  .pill.analyzed { background: rgba(244, 241, 234, .12); color: var(--text); }
  .empty { font-size: 12.5px; color: var(--text-3); padding: 2px 0 6px; }
  .addform { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 16px; }
  .editform { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border-radius: 16px; border: 1px solid var(--line-2); background: var(--fill); margin: 6px 0; }
  .editform .row { align-items: flex-end; }
  .pending-note { font-family: var(--f-mono); font-size: 10px; text-transform: uppercase; color: var(--text-3); }
  .thumbrow { display: flex; gap: 6px; flex-wrap: wrap; }
  .thumbrow:not(:empty) { margin-top: 10px; }
  .thumbrow img { width: 56px; height: 56px; object-fit: cover; border-radius: 12px; }
  .drop { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 64px; border-radius: 18px; border: 1px dashed rgba(244, 241, 234, .28); color: var(--text-2); font-weight: 700; font-size: 13px; cursor: pointer; transition: border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease); }
  .drop:hover { border-color: var(--bone); background: var(--fill); }
  .field input[type=text], .field input[type=time] { width: 100%; }
  .lg .field + .field, .lg .field + .row, .lg .row + .field { margin-top: 12px; }
  .lg .save { margin-top: 16px; }
  .lg input[type=range] { display: block; width: 100%; margin: 4px 0 0; }
  .lg .k b, .lg label b { font-family: var(--f-mono); font-weight: 400; font-size: 11px; color: var(--text); margin-left: 6px; }
  @media (max-width: 600px) { .lg .card { padding: 16px; } .daytotals { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 10px; } .datenav input[type=date] { width: 132px; } }
</style>
</head>
<body class="lg">
  <main>
    <div class="page-head">
      <div><h1>Daily log</h1></div>
      <div class="actions">
        <div class="datenav">
          <button id="d-prev" title="Previous day" aria-label="Previous day">&#8249;</button>
          <input type="date" id="d-input" aria-label="Day" />
          <button id="d-next" title="Next day" aria-label="Next day">&#8250;</button>
          <button class="today-btn" id="d-today">Today</button>
        </div>
        <span class="daylabel" id="today-str"></span>
        <span class="savedbadge" id="loaded-badge"></span>
      </div>
    </div>

    <div class="lg-grid">
      <div class="lg-col">
        <!-- CHECK-IN -->
        <div class="card">
          <h2>Check-in</h2>
          <span class="k">Mood</span>
          <div class="tapgrid" id="mood">
            <button class="tap" data-v="1">1</button><button class="tap" data-v="2">2</button>
            <button class="tap" data-v="3">3</button><button class="tap" data-v="4">4</button>
            <button class="tap" data-v="5">5</button>
          </div>
          <span class="k">Stress</span>
          <div class="tapgrid" id="stress">
            <button class="tap" data-v="1">1</button><button class="tap" data-v="2">2</button>
            <button class="tap" data-v="3">3</button><button class="tap" data-v="4">4</button>
            <button class="tap" data-v="5">5</button>
          </div>
          <span class="k">Energy</span>
          <div class="tapgrid" id="energy">
            <button class="tap" data-v="1">1</button><button class="tap" data-v="2">2</button>
            <button class="tap" data-v="3">3</button><button class="tap" data-v="4">4</button>
            <button class="tap" data-v="5">5</button>
          </div>
          <span class="k">Gut, 0 to 10 <b id="sev-val">0</b></span>
          <input type="range" id="severity" min="0" max="10" step="1" value="0" aria-label="Gut symptom severity" />
          <div class="row" style="margin-top:12px">
            <button class="tap warn" id="flare">Flare day</button>
          </div>
          <div class="row" style="margin-top:12px;align-items:flex-end">
            <div class="field" style="flex:0 1 140px"><label for="weight-lb">Weight, lb</label><input type="number" id="weight-lb" step="0.1" min="0" /></div>
            <div class="field" style="flex:1 1 220px"><label for="day-note">Note</label><input type="text" id="day-note" /></div>
          </div>
          <button class="btn primary save" id="save-checkin">Save check-in</button>
        </div>

        <!-- BATHROOM TRIPS -->
        <div class="card">
          <h2>Bathroom <span class="count" id="trip-count"></span></h2>
          <div class="entries" id="trip-list"></div>
          <div class="addform">
            <span class="k">Bristol</span>
            <div class="biggrid" id="bristol">
              <button class="tap" data-v="1">1</button><button class="tap" data-v="2">2</button>
              <button class="tap" data-v="3">3</button><button class="tap" data-v="4">4</button>
              <button class="tap" data-v="5">5</button><button class="tap" data-v="6">6</button>
              <button class="tap" data-v="7">7</button>
            </div>
            <div class="bristol-help">1 to 2 hard · 3 to 4 normal · 5 soft · 6 to 7 loose</div>
            <div class="row" style="margin-top:14px">
              <button class="tap warn" id="b-blood">Blood</button>
              <button class="tap warn" id="b-mucus">Mucus</button>
              <button class="tap warn" id="b-urgency">Urgency</button>
            </div>
            <div class="row" style="margin-top:12px;align-items:flex-end">
              <div class="field" style="flex:1 1 200px"><label>Pain <b id="b-pain-val">0</b></label><input type="range" id="b-pain" min="0" max="10" step="1" value="0" aria-label="Pain" /></div>
              <div class="field" style="flex:0 0 130px"><label for="b-time">Time</label><input type="time" id="b-time" /></div>
            </div>
            <button class="btn primary save" id="save-bristol">Add trip</button>
          </div>
        </div>

        <!-- MEALS -->
        <div class="card">
          <h2>Meals <span class="count" id="meal-count"></span></h2>
          <div class="entries" id="meal-list"></div>
          <div class="addform">
            <label id="drop" class="drop" for="mealphoto"><span id="drop-text">Add meal photos</span></label>
            <input type="file" id="mealphoto" accept="image/*" multiple hidden />
            <div class="thumbrow" id="mealthumbs"></div>
            <div class="field" style="margin-top:12px"><label for="mealcap">Caption</label><input type="text" id="mealcap" placeholder="chicken bowl, white rice, broccoli" /></div>
            <div class="field"><label for="meal-symptom">How it felt</label><textarea id="meal-symptom" style="min-height:56px"></textarea></div>
            <div class="row" style="margin-top:12px;align-items:flex-end">
              <div class="field" style="flex:0 0 130px"><label for="meal-time">Time</label><input type="time" id="meal-time" /></div>
              <button class="btn primary" id="save-meal">Add meals</button>
            </div>
          </div>
        </div>
      </div>

      <div class="lg-col">
        <!-- TOTALS -->
        <div class="card">
          <h2>Food today <span class="count" id="totals-note"></span></h2>
          <div class="daytotals" id="daytotals"></div>
        </div>

        <!-- GARMIN -->
        <div class="card">
          <h2>Garmin <span class="count" id="garmin-sync"></span></h2>
          <div class="gstats" id="gstats"></div>
          <div class="entries" id="workout-list" style="margin-top:12px"></div>
          <div class="addform">
            <div class="row" style="align-items:flex-end">
              <div class="field" style="flex:1 1 180px"><label for="workout-desc">Workout Garmin missed</label><input type="text" id="workout-desc" placeholder="hot yoga, 60 min" /></div>
              <div class="field" style="flex:0 0 110px"><label for="workout-time">Time</label><input type="time" id="workout-time" /></div>
            </div>
            <button class="btn save" id="save-workout">Add workout</button>
          </div>
        </div>

        <!-- INTAKE -->
        <div class="card">
          <h2>Intake</h2>
          <div class="row">
            <button class="tap on" id="med-bud">Budesonide</button>
            <button class="tap" id="med-trem">Tremfya</button>
            <button class="tap" id="sup-zinc">Zinc</button>
          </div>
          <span class="k" style="margin-top:16px">THC</span>
          <div class="tapgrid" id="thc">
            <button class="tap on" data-v="none">None</button>
            <button class="tap" data-v="edible">Edible</button>
            <button class="tap warn" data-v="smoked">Smoked</button>
          </div>
          <span class="k">Alcohol <b id="alc-val">0</b></span>
          <input type="range" id="alcohol" min="0" max="8" step="1" value="0" aria-label="Alcohol drinks" />
          <button class="btn primary save" id="save-intake">Save intake</button>
        </div>
      </div>
    </div>
  </main>
  <script type="module" src="/admin/health/_js/log.js"></script>
</body>
</html>
