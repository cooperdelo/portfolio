<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="theme-color" content="#0C0B0A" />
<title>Food Log · CD Admin</title>
<link rel="stylesheet" href="/admin/_shell/admin-shell.css" />
<style>@media (max-width: 600px) { table.data th:nth-child(3), table.data td:nth-child(3), table.data th:nth-child(4), table.data td:nth-child(4) { display: none; } }</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
</head>
<body>
  <main>
    <header class="page-head">
      <h1>Food log</h1>
      <div class="actions">
        <select id="month-pick" style="width:auto;border-radius:999px"></select>
        <button class="btn" id="copy-summary">Copy summary</button>
      </div>
    </header>

    <div class="kpi-grid">
      <div class="card"><div class="label">This month</div><div class="value" data-k="month_total">–</div><div class="delta flat" data-k="month_count">entries</div></div>
      <div class="card"><div class="label">Per entry</div><div class="value" data-k="month_avg">–</div><div class="delta flat">Ledger · food flag</div></div>
      <div class="card"><div class="label">Last month</div><div class="value" data-k="last_month">–</div><div class="delta flat" data-k="mom">vs prior</div></div>
      <div class="card"><div class="label">Year to date</div><div class="value" data-k="ytd">–</div><div class="delta flat">Ledger · food flag</div></div>
    </div>

    <div class="card chart-card" style="margin-bottom:14px">
      <div class="sv-h"><h2>By month</h2><span class="mono">12 months</span></div>
      <div class="chart-canvas-wrap tall"><canvas id="chart-food"></canvas></div>
    </div>

    <h2 class="section-h">Entries</h2>
    <div class="card">
      <div class="tbl-wrap">
        <table class="data">
          <thead><tr><th>Date</th><th>What</th><th>Merchant</th><th>Account</th><th class="right">Amount</th></tr></thead>
          <tbody id="food-tbody"><tr><td colspan="5" class="empty">Loading</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>

  <script type="module" src="/admin/finance/_js/food-log.js"></script>
</body>
</html>
