<style>

  *{box-sizing:border-box;margin:0;padding:0;}

  #cursor .ring{position:absolute;top:50%;left:50%;width:34px;height:34px;border:1px solid rgba(244,239,230,.6);border-radius:50%;transform:translate(-50%,-50%) scale(1);transition:transform .3s cubic-bezier(.22,1,.36,1),border-color .3s;}
  #cursor .clabel{position:absolute;top:50%;left:26px;transform:translateY(-50%);font-family:'Geist Mono',monospace;font-size:9px;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap;opacity:0;transition:opacity .2s;color:var(--ink);}
  body.hot #cursor .ring{transform:translate(-50%,-50%) scale(1.7);border-color:var(--rust);}
  body.hot #cursor .clabel{opacity:1;}
  body.grabbing #cursor .ring{transform:translate(-50%,-50%) scale(.6);}
  /* ---- top chrome ---- */
  .top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:20px 28px;z-index:14;pointer-events:none;}

  .brand .d{color:var(--rust);}
  .np{font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.28em;text-transform:uppercase;opacity:.65;margin-top:3px;}
  .nav{display:flex;gap:15px;font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;pointer-events:auto;}
  .nav a{color:var(--muted);text-decoration:none;transition:color .2s;}.nav a:hover{color:var(--ink);}
  .tools{position:fixed;bottom:20px;right:24px;z-index:14;display:flex;gap:10px;pointer-events:auto;}
  .tbtn{font-family:'Geist Mono',monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);background:rgba(244,239,230,.05);border:1px solid rgba(244,239,230,.14);border-radius:999px;padding:.5rem .85rem;cursor:none;transition:.2s;backdrop-filter:blur(10px);}
  .tbtn:hover{color:var(--ink);border-color:rgba(244,239,230,.4);}
  .tbtn.on{color:var(--rust);border-color:rgba(255,77,46,.5);}
  .hint{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:12;font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.24em;text-transform:uppercase;opacity:.62;pointer-events:none;text-shadow:0 2px 8px #000;transition:opacity .6s;text-align:center;}
  .flabel{position:fixed;left:50%;transform:translateX(-50%);z-index:12;font-family:'Anton',sans-serif;font-size:14px;letter-spacing:.14em;text-transform:uppercase;opacity:0;transition:opacity .25s,bottom .25s;pointer-events:none;text-shadow:0 2px 10px #000;bottom:52px;}
  /* ---- section HUD ---- */
  #hud{position:fixed;top:0;right:0;bottom:0;width:min(46%,440px);z-index:16;background:linear-gradient(180deg,rgba(12,9,7,.72),rgba(12,9,7,.86));backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%);border-left:1px solid rgba(244,239,230,.13);box-shadow:-40px 0 90px -50px #000 inset;padding:30px 32px 70px;transform:translateX(104%);transition:transform .7s cubic-bezier(.22,1,.36,1);overflow-y:auto;overscroll-behavior:contain;}
  #hud::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(244,239,230,.4),transparent);}
  #hud::-webkit-scrollbar{width:5px;}#hud::-webkit-scrollbar-thumb{background:rgba(244,239,230,.16);border-radius:3px;}
  #hud .x{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.6;cursor:none;display:inline-flex;align-items:center;gap:8px;}
  #hud .x:hover{opacity:1;color:var(--rust);}
  #hud .eye{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.24em;text-transform:uppercase;margin-top:30px;}

  #loader .lsub{font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);}
  .noscript{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.1em;}

    .top{flex-direction:column;gap:8px;padding:16px 18px;}

    .hint{font-size:8.5px;letter-spacing:.14em;width:88%;line-height:1.7;}
    #hud{width:100%;max-width:none;padding:24px 22px 60px;}
    .tools{bottom:14px;right:14px;}

</style>

/* ============================================================= RENDERER / SCENE ============================================================= */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x140d09, 0.013);
const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 2.4, 18);

// realistic reflections — this is what kills the "clay" look
const pmrem = new THREE.PMREMGenerator(renderer);
const envRT = pmrem.fromScene(new RoomEnvironment(), 0.04);
scene.environment = envRT.texture;

const MOBILE = matchMedia('(pointer:coarse)').matches || innerWidth < 760;
const anisoMax = renderer.capabilities.getMaxAnisotropy();

/* ============================================================= LOADING ============================================================= */
const manager = new THREE.LoadingManager();
const texLoader = new THREE.TextureLoader(manager);
const texCache = new Map();
function tex(name){
  if(texCache.has(name)) return texCache.get(name);
  const t = texLoader.load(P + name, undefined, undefined, ()=>{ /* swallow 404 */ });
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = anisoMax;
  texCache.set(name, t);
  return t;
}

/* ============================================================= PROCEDURAL TEXTURES ============================================================= */
function woodTex(base, dark){
  const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d');
  x.fillStyle = base; x.fillRect(0,0,512,512);
  for(let p=0;p<6;p++){ const py=p*90+Math.random()*20; x.fillStyle='rgba(0,0,0,.16)'; x.fillRect(0,py,512,2); }
  for(let i=0;i<200;i++){ x.strokeStyle='rgba('+dark+','+(Math.random()*.3+.05)+')'; x.lineWidth=Math.random()*2.5+.3; x.beginPath(); const gx=Math.random()*512; x.moveTo(gx,0); for(let y=0;y<=512;y+=14) x.lineTo(gx+Math.sin(y*.03+i)*7+(Math.random()-.5)*4,y); x.stroke(); }
  for(let j=0;j<9000;j++){ x.fillStyle='rgba(0,0,0,'+(Math.random()*.07)+')'; x.fillRect(Math.random()*512,Math.random()*512,1,1); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.colorSpace=THREE.SRGBColorSpace; return t;
}
const woodA = woodTex('#5c412a','70,46,26'), woodB = woodTex('#6b4e30','80,54,30');
function woodMat(base, rep, rough){ rep=rep||[1,1]; const t=base.clone(); t.needsUpdate=true; t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rep[0],rep[1]); return new THREE.MeshStandardMaterial({ map:t, roughness:rough||.72, metalness:.04, envMapIntensity:.5 }); }
function metalMat(c, rough){ return new THREE.MeshStandardMaterial({ color:c, metalness:.85, roughness:rough||.3, envMapIntensity:1.0 }); }

// grooved vinyl label texture
function discTex(accent){
  const c=document.createElement('canvas'); c.width=c.height=512; const x=c.getContext('2d');
  x.fillStyle='#08080a'; x.beginPath(); x.arc(256,256,256,0,7); x.fill();
  for(let r=250;r>96;r-=2.2){ x.beginPath(); x.arc(256,256,r,0,7); x.strokeStyle='rgba('+(Math.random()<.5?'54,54,62':'10,10,14')+',.7)'; x.lineWidth=1; x.stroke(); }
  const g=x.createRadialGradient(256,256,10,256,256,92); g.addColorStop(0,accent); g.addColorStop(1,shade(accent,-30));
  x.fillStyle=g; x.beginPath(); x.arc(256,256,92,0,7); x.fill();
  x.fillStyle='#08080a'; x.beginPath(); x.arc(256,256,9,0,7); x.fill();
  x.save(); x.translate(256,256); x.fillStyle='rgba(10,8,6,.85)'; x.font='700 20px Geist,Arial'; x.textAlign='center';
  x.fillText('COOPER DELO', 0, -34); x.font='500 12px Geist Mono,monospace'; x.fillText('SIDE A · 33⅓', 0, 44); x.restore();
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=anisoMax; return t;
}
function shade(hex, amt){ const n=parseInt(hex.slice(1),16); let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt; r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b)); return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }
function fallbackCover(sec){ const c=document.createElement('canvas'); c.width=c.height=512; const x=c.getContext('2d'); x.fillStyle='#161210'; x.fillRect(0,0,512,512); const g=x.createRadialGradient(256,200,40,256,256,420); g.addColorStop(0,sec.accent+'33'); g.addColorStop(1,'#0e0b09'); x.fillStyle=g; x.fillRect(0,0,512,512); x.fillStyle=sec.accent; x.fillRect(46,306,60,10); x.fillStyle='#F4EFE6'; x.font='800 56px Geist,Arial'; x.fillText(sec.key,42,296); x.strokeStyle=sec.accent+'44'; x.lineWidth=2; x.strokeRect(18,18,476,476); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; }

function clearSectionWorld(){
  galleryFrames.forEach(f=>{ f.traverse(o=>{ if(o.material){ if(o.material.map&&o.material.map.dispose) o.material.map.dispose(); o.material.dispose(); } if(o.geometry) o.geometry.dispose(); }); });
  ringGroup.clear(); galleryFrames.length=0;
  videoEls.forEach(v=>{ v.pause(); v.src=''; }); videoEls.length=0;
}
function buildSectionWorld(sec){
  clearSectionWorld();
  const items=[]; sec.gallery.forEach(n=>items.push({type:'img',src:n})); (sec.reels||[]).forEach(n=>items.push({type:'vid',src:n}));
  const R=6.4, N=items.length, rings=Math.ceil(N/9);
  items.forEach((it,i)=>{
    const per=Math.ceil(N/rings), rIdx=Math.floor(i/per), inRing=i%per, count=Math.min(per,N-rIdx*per);
    const ang=(inRing/count)*Math.PI*2 + rIdx*0.4;
    const y=(rings>1?(rIdx-(rings-1)/2)*2.9:0) + Math.sin(i*1.7)*0.25;
    const w=1.9, h=1.9*0.72;
    const g=new THREE.Group();
    const fr=new THREE.Mesh(new THREE.BoxGeometry(w+.12,h+.12,.06), new THREE.MeshStandardMaterial({color:0x0e0b09,roughness:.5,metalness:.2,envMapIntensity:.6})); g.add(fr);
    const glow=new THREE.Mesh(new THREE.PlaneGeometry(w+.7,h+.7), new THREE.MeshBasicMaterial({color:sec.accent,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false})); glow.position.z=-.06; g.add(glow);
    const mat=new THREE.MeshBasicMaterial({color:0x1a1512});
    const art=new THREE.Mesh(new THREE.PlaneGeometry(w,h), mat); art.position.z=.041; g.add(art);
    if(it.type==='img'){ const t=texLoader.load(P+it.src, tx=>{tx.colorSpace=THREE.SRGBColorSpace;tx.anisotropy=anisoMax;mat.map=tx;mat.color.set(0xffffff);mat.needsUpdate=true;},undefined,()=>{}); }
    else { const vid=document.createElement('video'); vid.src=V+it.src; vid.muted=true; vid.loop=true; vid.playsInline=true; vid.crossOrigin='anonymous'; vid.play().catch(()=>{}); const vt=new THREE.VideoTexture(vid); vt.colorSpace=THREE.SRGBColorSpace; mat.map=vt; mat.color.set(0xffffff); mat.needsUpdate=true; videoEls.push(vid);
      const badge=new THREE.Mesh(new THREE.CircleGeometry(.13,3), new THREE.MeshBasicMaterial({color:sec.accent})); badge.position.set(w/2-.2,-h/2+.2,.06); badge.rotation.z=-Math.PI/2; g.add(badge); }
    g.position.set(Math.cos(ang)*R, y, Math.sin(ang)*R);
    g.lookAt(0,y,0); g.rotateY(Math.PI);
    g.userData={photo:it.src, isVid:it.type==='vid', baseScale:1, glow};
    ringGroup.add(g); galleryFrames.push(g);
  });
  // ambient accent glow disc under the ring
  const disc=new THREE.Mesh(new THREE.CircleGeometry(9,64), new THREE.MeshBasicMaterial({color:sec.accent,transparent:true,opacity:0.05,blending:THREE.AdditiveBlending,depthWrite:false})); disc.rotation.x=-Math.PI/2; disc.position.y=-3.6; sectionWorld.add(disc); galleryFrames.push(disc);
}

/* ============================================================= POST-PROCESSING ============================================================= */
const comp=new EffectComposer(renderer);
comp.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), MOBILE?0.5:0.72, 0.85, 0.72);
comp.addPass(bloom);
const VintagePass={ uniforms:{ tDiffuse:{value:null}, uTime:{value:0}, uRes:{value:new THREE.Vector2(innerWidth,innerHeight)}, uAb:{value:0.0015}, uGrain:{value:0.045}, uVig:{value:0.55}, uPortal:{value:0.0}, uCenter:{value:new THREE.Vector2(0.5,0.5)} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
  fragmentShader:`
  uniform sampler2D tDiffuse; uniform float uTime; uniform vec2 uRes; uniform float uAb; uniform float uGrain; uniform float uVig; uniform float uPortal; uniform vec2 uCenter; varying vec2 vUv;
  float rand(vec2 c){ return fract(sin(dot(c,vec2(12.9898,78.233)))*43758.5453); }
  void main(){
    vec2 uv=vUv; vec2 cc=uv-0.5; float d2=dot(cc,cc);
    uv+=cc*d2*0.11;                                  // barrel
    vec2 toC=uv-uCenter; float r=length(toC);
    uv-=toC*uPortal*(0.4/(r+0.25));                  // portal suck
    float ab=uAb*(0.5+d2*3.0)+uPortal*0.03;
    vec2 dir=normalize(cc+1e-5);
    float rC=texture2D(tDiffuse,uv-dir*ab).r;
    float gC=texture2D(tDiffuse,uv).g;
    float bC=texture2D(tDiffuse,uv+dir*ab).b;
    vec3 col=vec3(rC,gC,bC);
    col=pow(col,vec3(0.97));
    col*=vec3(1.06,1.0,0.93);                         // warm grade
    col=mix(col, col*vec3(1.12,1.02,0.88), 0.28);
    float vig=smoothstep(1.5,0.35,d2*2.2);
    col*=mix(1.0,vig,uVig);
    float g=rand(uv*uRes*0.5+fract(uTime));
    col+=(g-0.5)*uGrain;
    float sl=0.985+0.015*sin(uv.y*uRes.y*1.4);        // faint scanline
    col*=sl;
    col+=uPortal*smoothstep(0.35,0.0,r)*vec3(1.0,0.94,0.86)*1.8; // portal core flash
    gl_FragColor=vec4(col,1.0);
  }`};
const vintage=new ShaderPass(VintagePass); vintage.renderToScreen=true; comp.addPass(vintage);

/* ============================================================= CAMERA + STATE ============================================================= */
const CAM={ wide:{p:new THREE.Vector3(0,2.2,15)}, work:{p:new THREE.Vector3(0,.6,9.2),l:new THREE.Vector3(0,-.35,-.2)}, play:{p:new THREE.Vector3(0,.3,8)} };
let state='intro', aT=0, focused=null, dolly=0;
let drag=false, lx=0, ly=0, tYaw=0, tPitch=0, yaw=0, pitch=0;
let secYaw=0, secYawV=0, secTarget=0;
const lookTarget=new THREE.Vector3(0,-.3,0);
const ray=new THREE.Raycaster(), pointer=new THREE.Vector2(), hover=null;
let hoverObj=null;

const present=new THREE.Vector3(-1.7,.4,5.2);
const startPos=new THREE.Vector3();
const platterWorld=new THREE.Vector3();

/* ============================================================= UI WIRING ============================================================= */
const hint=document.getElementById('hint'), flabel=document.getElementById('flabel'), np=document.getElementById('np');
const hud=document.getElementById('hud');
const cursor=document.getElementById('cursor'), clabel=cursor.querySelector('.clabel');
let cx=innerWidth/2, cy=innerHeight/2, ctx=cx, cty=cy;

function scramble(el, text){
  const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/·';
  let frame=0; const len=text.length;
  clearInterval(el._sc);
  el._sc=setInterval(()=>{ let out=''; for(let i=0;i<len;i++){ if(i<frame/2) out+=text[i]; else out+=chars[Math.floor(Math.random()*chars.length)]; } el.textContent=out; if(frame/2>=len){ clearInterval(el._sc); el.textContent=text; } frame++; }, 24);
}
function fillHUD(sec){
  const eye=document.getElementById('hudeye'); eye.textContent=sec.sub.toUpperCase(); eye.style.color=sec.accent;
  scramble(document.getElementById('hudtitle'), sec.key);
  document.getElementById('hudtag').textContent=sec.tag;
  const op=document.getElementById('hudopen'); op.href=sec.link; op.style.color=sec.accent; op.style.borderColor=sec.accent+'66';
  document.getElementById('hudrows').innerHTML=sec.rows.map(r=>`<div><span class="k">${r[0]}</span><span>${r[1]}</span></div>`).join('');
  document.getElementById('huddesc').textContent=sec.desc;
  document.getElementById('hudkit').innerHTML=sec.kit?(`<div class="subh">The kit</div><div class="kit">`+sec.kit.map(k=>`<div class="kitc"><h4>${k.n}</h4>`+k.r.map(r=>`<div class="r"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('')+`</div>`).join('')+`</div>`):'';
  const ah=document.getElementById('hudachvh'), ac=document.getElementById('hudachv');
  if(sec.achv&&sec.achv.length){ ah.style.display='block'; ac.innerHTML=sec.achv.map(a=>`<span>${a}</span>`).join(''); } else { ah.style.display='none'; ac.innerHTML=''; }
}

/* ---- audio (muted by default) ---- */
let audioCtx=null, hum=null, soundOn=false;
function initAudio(){ if(audioCtx) return; audioCtx=new (window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type='sine'; o.frequency.value=52; g.gain.value=0.0; o.connect(g); g.connect(audioCtx.destination); o.start(); hum={o,g}; }
function whoosh(){ if(!soundOn||!audioCtx) return; const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(140,audioCtx.currentTime); o.frequency.exponentialRampToValueAtTime(40,audioCtx.currentTime+0.6); g.gain.setValueAtTime(0.0001,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.08,audioCtx.currentTime+0.05); g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.7); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.75); }
document.getElementById('sndBtn').onclick=()=>{ initAudio(); if(audioCtx.state==='suspended') audioCtx.resume(); soundOn=!soundOn; hum.g.gain.linearRampToValueAtTime(soundOn?0.02:0.0, audioCtx.currentTime+0.4); const b=document.getElementById('sndBtn'); b.textContent='Sound '+(soundOn?'●':'○'); b.classList.toggle('on',soundOn); };
document.getElementById('fsBtn').onclick=()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); else document.exitFullscreen&&document.exitFullscreen(); };

/* ---- pointer / cursor ---- */
addEventListener('pointermove', e=>{ cx=e.clientX; cy=e.clientY; pointer.x=(e.clientX/innerWidth)*2-1; pointer.y=-(e.clientY/innerHeight)*2+1;
  if(drag){ const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
    if(state==='section'){ secYawV -= dx*0.004; }
    else { tYaw=Math.max(-.5,Math.min(.5,tYaw+dx*.004)); tPitch=Math.max(-.16,Math.min(.32,tPitch-dy*.003)); } } });
canvas.addEventListener('pointerdown', e=>{ drag=true; lx=e.clientX; ly=e.clientY; document.body.classList.add('grabbing'); hint.style.opacity=0; initAudio(); });
addEventListener('pointerup', ()=>{ drag=false; document.body.classList.remove('grabbing'); });
addEventListener('wheel', e=>{ if(state==='idle'||state==='intro'){ dolly=Math.max(0,Math.min(1,dolly+e.deltaY*0.0008)); } else if(state==='section'){ /* could zoom */ } }, {passive:true});

function setCursorLabel(t){ clabel.textContent=t||''; }
document.querySelectorAll('[data-c]').forEach(el=>{ el.addEventListener('pointerenter',()=>{ document.body.classList.add('hot'); setCursorLabel(el.getAttribute('data-c')); }); el.addEventListener('pointerleave',()=>{ document.body.classList.remove('hot'); setCursorLabel(''); }); });

/* ---- click routing ---- */
let clickStart={x:0,y:0};
canvas.addEventListener('pointerdown', e=>{ clickStart={x:e.clientX,y:e.clientY}; });
canvas.addEventListener('pointerup', e=>{
  const moved=Math.hypot(e.clientX-clickStart.x,e.clientY-clickStart.y);
  if(moved>6) return; // was a drag
  if(state==='idle' && hoverObj){ dive(hoverObj); }
  else if(state==='section' && hoverObj && hoverObj.userData.photo){ openLightbox(hoverObj.userData); }
});

/* ---- lightbox ---- */
const lightbox=document.getElementById('lightbox'), lbimg=document.getElementById('lbimg'), lbcap=document.getElementById('lbcap');
function openLightbox(ud){ if(ud.isVid){ return; } lbimg.src=P+ud.photo; lbcap.textContent=ud.photo.replace('replay/','').replace(/\.(jpg|jpeg|png|JPG)$/,'').replace(/_/g,' '); lightbox.classList.add('show'); }
function closeLightbox(){ lightbox.classList.remove('show'); }
document.getElementById('lbx').onclick=closeLightbox; lightbox.addEventListener('click',e=>{ if(e.target===lightbox) closeLightbox(); });

/* ---- dive / return ---- */
function dive(vn){ const sec=vn.userData.sec; focused=vn; vn.userData.peek.visible=false; vn.getWorldPosition(startPos);
  state='ejecting'; aT=0; np.textContent='▶ '+sec.key; np.style.color=sec.accent;
  const dt=discTex(sec.accent); recTop.material.map=dt; recTop.material.needsUpdate=true; recBot.material.map=dt; recBot.material.needsUpdate=true;
  buildSectionWorld(sec);
  whoosh();
}
function returnToStudio(){ if(state!=='section') return; state='returning'; aT=0; hud.style.transform='translateX(104%)'; np.textContent='the studio'; np.style.color=''; closeLightbox(); whoosh(); }
document.getElementById('hudx').onclick=returnToStudio;
addEventListener('keydown', e=>{ if(e.key==='Escape'){ if(lightbox.classList.contains('show')) closeLightbox(); else returnToStudio(); } });

addEventListener('resize', ()=>{ renderer.setSize(innerWidth,innerHeight); comp.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); vintage.uniforms.uRes.value.set(innerWidth,innerHeight); bloom.setSize(innerWidth,innerHeight); });

manager.onLoad=()=>{};
setTimeout(()=>{ clearInterval(msgTimer); document.getElementById('loader').classList.add('hide'); }, 1600);

/* ============================================================= ANIMATION LOOP ============================================================= */
const clock=new THREE.Clock();
const tmpP=new THREE.Vector3(), tmpL=new THREE.Vector3(), flyTarget=new THREE.Vector3();
function ease(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
function smooth(t){ return t*t*(3-2*t); }

function frameLoop(){
  requestAnimationFrame(frameLoop);
  const dt=Math.min(clock.getDelta(),.05), et=clock.elapsedTime;
  dustMat.uniforms.uTime.value=et; embMat.uniforms.uTime.value=et; coneMat.uniforms.uTime.value=et; vintage.uniforms.uTime.value=et;

  // cursor follow
  ctx+=(cx-ctx)*0.28; cty+=(cy-cty)*0.28; cursor.style.transform=`translate(${ctx}px,${cty}px)`;

  // damped orbit
  if(!drag) tYaw+=(0-tYaw)*0.01;
  yaw+=(tYaw-yaw)*0.06; pitch+=(tPitch-pitch)*0.06;
  studio.rotation.y=yaw*0.18;

  platter.getWorldPosition(platterWorld); platterWorld.y+=0.34;
  let spin=0, portal=0;

  if(state==='intro'){ aT+=dt/3.0; if(aT>=1) state='idle'; }
  else if(state==='ejecting'){ aT+=dt/0.75; const e=smooth(Math.min(aT,1)); focused.position.lerpVectors(focused.userData.home,present,e); focused.rotation.x=lean*(1-e); if(aT>=1){ state='sliding'; aT=0; fly.visible=true; fly.position.copy(present); fly.rotation.set(Math.PI/2,0,0); } }
  else if(state==='sliding'){ aT+=dt/0.6; const e=smooth(Math.min(aT,1)); spin=3; flyTarget.copy(present); flyTarget.x+=1.7; fly.position.lerpVectors(present,flyTarget,e); if(aT>=1){ state='traveling'; aT=0; startPos.copy(fly.position); } }
  else if(state==='traveling'){ aT+=dt/1.05; const e=smooth(Math.min(aT,1)); spin=6; fly.position.lerpVectors(startPos,platterWorld,e); fly.position.y+=Math.sin(e*Math.PI)*1.3; fly.rotation.x=(Math.PI/2)*(1-e); if(aT>=1){ state='dropping'; aT=0; fly.position.copy(platterWorld); fly.rotation.x=0; } }
  else if(state==='dropping'){ aT+=dt/1.1; spin=10; arm.rotation.y+=((-0.05)-arm.rotation.y)*0.08; portal=smooth(Math.min(aT,1)); // ramp portal, camera dives toward disc
    if(aT>=1){ state='entering'; aT=0; } }
  else if(state==='entering'){ aT+=dt/0.5; portal=1-smooth(Math.min(aT,1)); // arrive inside section
    if(aT<0.02){ sectionWorld.position.set(0,0,0); studio.visible=false; cone.visible=false; }
    if(aT>=1){ state='section'; aT=0; hud.style.transform='translateX(0)'; fillHUD(focused.userData.sec); } }
  else if(state==='section'){ secYaw+=secYawV; secYawV*=0.94; if(!drag) secYaw+=0.0009; ringGroup.rotation.y=secYaw; }
  else if(state==='returning'){ aT+=dt/1.0; portal=smooth(Math.min(aT,1)); if(aT>0.5&&studio.visible===false){ studio.visible=true; cone.visible=true; sectionWorld.position.set(0,120,0); }
    if(aT>=1){ state='resetting'; aT=0; } }
  else if(state==='resetting'){ aT+=dt/0.9; const e=smooth(Math.min(aT,1)); spin=4; portal=1-e; arm.rotation.y+=((-0.6)-arm.rotation.y)*0.12; fly.position.lerpVectors(platterWorld,present,e); fly.position.y+=Math.sin(e*Math.PI)*1.0; fly.rotation.x=(Math.PI/2)*e; focused.position.lerpVectors(present,focused.userData.home,e); focused.rotation.x=lean*e; if(aT>=1){ state='idle'; fly.visible=false; focused.userData.peek.visible=true; focused=null; } }

  inner.rotation.y+=spin*dt;
  vintage.uniforms.uPortal.value=portal;
  if(hum&&soundOn){ /* hum stays */ }

  /* ---- camera targeting ---- */
  if(state==='section'){
    tmpP.set(0,0,0.01); tmpL.set(0,0,-1);
    tmpP.x+=yaw*1.2; tmpP.y+=pitch*1.2;
    camera.position.lerp(tmpP,0.08);
    lookTarget.lerp(new THREE.Vector3(Math.sin(secYaw)* -0.0,0,-1),0.08);
    camera.lookAt(camera.position.x+Math.sin(-secYaw*0.15),camera.position.y,camera.position.z-1);
    camera.lookAt(0,0,-1);
  } else if(state==='entering'||state==='dropping'){
    // dive camera toward the disc on the platter
    const to=platterWorld.clone(); to.z+=2.2; to.y+=0.2;
    camera.position.lerp(to,0.09); lookTarget.lerp(platterWorld,0.12); camera.lookAt(lookTarget);
    vintage.uniforms.uCenter.value.set(0.5,0.5);
  } else if(state==='returning'||state==='resetting'){
    tmpP.copy(CAM.play.p); tmpP.x+=yaw*2.4; tmpP.y+=pitch*2; camera.position.lerp(tmpP,0.06); lookTarget.lerp(platterWorld,0.06); camera.lookAt(lookTarget);
  } else {
    // studio idle: dolly between wide and work with scroll
    tmpP.lerpVectors(CAM.wide.p, CAM.work.p, state==='intro'?smooth(Math.min(aT,1)):(0.55+dolly*0.45));
    tmpL.copy(CAM.work.l);
    tmpP.x+=yaw*2.6; tmpP.y+=pitch*2.2;
    camera.position.lerp(tmpP,0.05); lookTarget.lerp(tmpL,0.06); camera.lookAt(lookTarget);
  }

  /* ---- hover detection ---- */
  if(state==='idle'){
    ray.setFromCamera(pointer,camera);
    const hits=ray.intersectObjects(vinyls,true); let h=null;
    if(hits.length){ let o=hits[0].object; while(o&&!o.userData.sec) o=o.parent; h=o; }
    if(h!==hoverObj){ hoverObj=h; flabel.style.opacity=h?1:0; if(h){ flabel.textContent=h.userData.sec.key; document.body.classList.add('hot'); setCursorLabel('DIVE IN'); } else { document.body.classList.remove('hot'); setCursorLabel(''); } }
  } else if(state==='section'){
    ray.setFromCamera(pointer,camera);
    const hits=ray.intersectObjects(galleryFrames,true); let h=null;
    if(hits.length){ let o=hits[0].object; while(o&&o.parent&&!o.userData.photo) o=o.parent; if(o.userData.photo) h=o; }
    if(h!==hoverObj){ hoverObj=h; if(h&&!h.userData.isVid){ document.body.classList.add('hot'); setCursorLabel('ENLARGE'); } else if(h){ document.body.classList.add('hot'); setCursorLabel('REEL'); } else { document.body.classList.remove('hot'); setCursorLabel(''); } }
  } else if(hoverObj){ hoverObj=null; }

  /* ---- record hover animation ---- */
  vinyls.forEach(vv=>{ if(vv===focused) return; const on=(vv===hoverObj&&state==='idle');
    vv.userData.glow.material.opacity+=((on?0.28:0)-vv.userData.glow.material.opacity)*0.15;
    const tz=vv.userData.home.z+(on?0.5:0), ty=vv.userData.home.y+(on?0.12:0);
    vv.position.z+=(tz-vv.position.z)*0.12; vv.position.y+=(ty-vv.position.y)*0.12;
    vv.rotation.z=Math.sin(et*1.2+vv.position.x)*0.006; });

  /* ---- gallery frame hover scale ---- */
  galleryFrames.forEach(g=>{ if(!g.userData||!g.userData.photo) return; const on=(g===hoverObj); const s=on?1.14:1; g.scale.x+=(s-g.scale.x)*0.14; g.scale.y+=(s-g.scale.y)*0.14; g.scale.z+=(s-g.scale.z)*0.14; if(g.userData.glow) g.userData.glow.material.opacity+=((on?0.42:0)-g.userData.glow.material.opacity)*0.15; });

  comp.render();
}
frameLoop();

window.__world={ scene, camera };
</script>
</body>
