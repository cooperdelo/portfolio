<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>Investments · CD Admin</title>
<link rel="stylesheet" href="/admin/_shell/admin-shell.css" />
<style>@media (max-width: 600px) { table.data th:nth-child(2), table.data td:nth-child(2), table.data th:nth-child(3), table.data td:nth-child(3), table.data th:nth-child(5), table.data td:nth-child(5), table.data th:nth-child(7), table.data td:nth-child(7) { display: none; } }</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
</head>
<body>
  <main>
    <div class="page-head">
      <div>
        <h1>Investments</h1>
      </div>
      <div class="actions">
        <button class="btn" id="sync-prices">Sync prices</button>
        <button class="btn ghost small" id="add-pos" title="Manual until a broker feed exists">Edit positions</button>
      </div>
    </div>

    <div class="kpi-grid" id="inv-kpis">
      <div class="card"><div class="label">Total value</div><div class="value" data-k="total_value">–</div><div class="delta flat" data-k="total_gain">Coinbase · Roth IRA</div></div>
      <div class="card"><div class="label">Cost basis</div><div class="value" data-k="total_cost">–</div><div class="delta flat">Coinbase · Roth IRA</div></div>
      <div class="card"><div class="label">Cash</div><div class="value" data-k="cash_total">–</div><div class="delta flat">Roth IRA cash</div></div>
      <div class="card"><div class="label">Prices as of</div><div class="value word" data-k="last_update">–</div><div class="delta flat" data-k="pos_count">–</div></div>
    </div>

    <div class="grid">
      <div class="card chart-card span-6">
        <h3>By symbol</h3>
        <div class="chart-canvas-wrap tall"><canvas id="chart-alloc"></canvas></div>
      </div>
      <div class="card chart-card span-6">
        <h3>By account</h3>
        <div class="chart-canvas-wrap tall"><canvas id="chart-acct"></canvas></div>
      </div>
    </div>

    <h2 class="section-h">Positions</h2>
    <div class="card">
      <div class="tbl-wrap">
        <table class="data">
          <thead>
            <tr>
              <th>Symbol</th>
              <th>Name</th>
              <th>Account</th>
              <th class="right">Shares</th>
              <th class="right">Price</th>
              <th class="right">Value</th>
              <th class="right">Cost basis</th>
              <th class="right">Gain/loss</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="pos-tbody">
            <tr><td colspan="9" class="empty">No positions yet, click "Add position"</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Add position modal (lightweight inline) -->
    <div id="add-modal" style="display:none; position:fixed; inset:0; z-index:5000; background:rgba(6,5,4,0.6);">
      <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:min(560px, calc(100% - 32px)); max-height:calc(100dvh - 32px); overflow:auto;">
        <div class="card" style="background:var(--glass-strong)">
          <h2 class="section-h" style="margin-top:0;">Position</h2>
          <form id="pos-form" class="form-grid">
            <div class="field"><label>Symbol</label><input name="symbol" required placeholder="VTI, BTC, ETH" /></div>
            <div class="field"><label>Name</label><input name="name" placeholder="Vanguard Total Market" /></div>
            <div class="field"><label>Asset type</label>
              <select name="asset_type" required>
                <option value="stock">Stock / ETF</option>
                <option value="crypto">Crypto</option>
              </select>
            </div>
            <div class="field"><label>Account</label>
              <select name="account_slug" required>
                <option value="roth_ira">Roth IRA (Schwab)</option>
                <option value="brokerage">Brokerage</option>
                <option value="coinbase">Coinbase</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="field"><label>Shares / coins</label><input name="shares" type="number" step="0.00000001" min="0" required /></div>
            <div class="field"><label>Cost basis (per unit avg)</label><input name="cost_basis" type="number" step="0.0001" min="0" /></div>
            <div class="field"><label>Current price <span class="meta">(auto-filled by sync)</span></label><input name="current_price" type="number" step="0.0001" min="0" /></div>
            <div class="field" style="grid-column: 1 / -1;"><label>Notes</label><textarea name="notes"></textarea></div>
            <div style="grid-column: 1 / -1; display:flex; gap:0.6rem;">
              <button class="btn primary" type="submit">Save</button>
              <button class="btn" type="button" id="add-cancel">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/admin/finance/_js/investments.js"></script>
</body>
</html>
