<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<link rel="manifest" href="/admin/health/manifest.json" />
<link rel="apple-touch-icon" href="/favicon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Health" />
<meta name="theme-color" content="#FF4D2E" />
<title>Health Insights · CD Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Geist+Mono:wght@300..700&family=Geist:wght@300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/admin/_shell/admin-shell.css" />
<style>
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.8rem;margin-bottom:1.2rem;}
  .kpi{border:1px solid #262626;border-radius:14px;padding:.9rem 1rem;}
  .kpi .n{font-size:1.7rem;font-weight:700;font-family:'Geist Mono',monospace;}
  .kpi .n.good{color:#7bd88f;} .kpi .n.warn{color:#ffd24d;} .kpi .n.bad{color:#ff6b4d;}
  .kpi .l{font-size:.75rem;opacity:.65;margin-top:.2rem;}
  table{width:100%;border-collapse:collapse;font-size:.82rem;}
  th,td{padding:.45rem .5rem;text-align:left;border-bottom:1px solid #222;white-space:nowrap;}
  th{opacity:.6;font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;}
  .sev{display:inline-block;min-width:22px;text-align:center;border-radius:6px;padding:.05rem .3rem;}
  .flarerow td{background:rgba(255,107,77,.08);}
  .muted{opacity:.4;}
  .hint{font-size:.82rem;opacity:.8;line-height:1.5;}
</style>
</head>
<body>
  <main>
    <div class="page-head">
      <div>
        <div class="eyebrow">Crohn's tracker</div>
        <h1>HEALTH <span class="accent">insights</span></h1>
      </div>
      <div class="actions">
        <a class="btn primary" href="/admin/health/log.html">+ Daily log</a>
        <a class="btn ghost" href="/admin/health/food.html">Food</a>
      </div>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="card" style="margin-bottom:1.2rem;">
      <h2 style="font-size:1.05rem;margin:.1rem 0 .6rem;">Trigger signal <span style="font-size:.72rem;opacity:.6;">(24–48h lag — hypotheses, not proof)</span></h2>
      <div class="hint" id="signal">Gathering data…</div>
    </div>

    <div class="card" style="margin-bottom:1.2rem;">
      <h2 style="font-size:1.05rem;margin:.1rem 0 .6rem;">Recent workouts <span style="font-size:.72rem;opacity:.6;">(auto-synced from Garmin)</span></h2>
      <div id="workouts" class="hint"></div>
    </div>

    <div class="card">
      <h2 style="font-size:1.05rem;margin:.1rem 0 .8rem;">Last 30 days</h2>
      <div style="overflow-x:auto;">
        <table>
          <thead><tr>
            <th>Date</th><th>Sleep</th><th>Stress<br>(Garmin)</th><th>Mood</th>
            <th>Symptom</th><th>BMs</th><th>HBI<br>proxy</th><th>Blood</th><th>Irritants</th>
          </tr></thead>
          <tbody id="rows"><tr><td colspan="9" class="muted">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
  <script type="module" src="/admin/health/_js/dashboard.js"></script>
</body>
</html>
