<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Cooper Delo / Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,30..100,0..1;1,9..144,300..900,30..100,0..1&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0A0908;
    --ink: #F4EFE6;
    --rust: #FF4D2E;
    --w: 1200px;
    --h: 1200px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #1a1a1a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    font-family: "Geist Mono", monospace;
  }
  /* ?capture=1 — headless capture mode: fill viewport, drop chrome */
  body.capture { padding: 0; background: var(--bg); }
  body.capture .cover { box-shadow: none; }
  body.capture .meta { display: none; }

  /* The canvas — exact dimensions for capture */
  .cover {
    position: relative;
    width: var(--w);
    height: var(--h);
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
    box-shadow: 0 40px 120px rgba(0,0,0,0.6);
    isolation: isolate;
  }

  /* Cinematic backdrop photo — heavily darkened */
  .cover-bg {
    position: absolute; inset: 0; z-index: 0;
  }
  .cover-bg img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center 35%;
    filter: brightness(0.4) saturate(0.78) contrast(1.05) sepia(0.12);
  }
  .cover-bg::after {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 90% 70% at 50% 35%, rgba(10,9,8,0.78) 0%, rgba(10,9,8,0.35) 55%, rgba(10,9,8,0.7) 100%),
      linear-gradient(180deg, rgba(10,9,8,0.55) 0%, rgba(10,9,8,0.25) 30%, rgba(10,9,8,0.7) 100%);
  }

  /* Grain overlay */
  .grain {
    position: absolute; inset: 0; z-index: 5;
    pointer-events: none;
    mix-blend-mode: overlay;
    opacity: 0.16;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>");
  }

  /* Top bar */
  .topbar {
    position: absolute; top: 50px; left: 60px; right: 60px;
    z-index: 4;
    display: flex; justify-content: space-between; align-items: center;
    font-family: "Geist Mono", monospace;
    text-transform: uppercase;
    letter-spacing: 0.32em;
    font-size: 0.78rem;
    color: rgba(244,239,230,0.78);
  }
  .topbar .dot {
    display: inline-block;
    width: 8px; height: 8px;
    background: var(--rust);
    border-radius: 50%;
    margin-right: 0.7em;
    vertical-align: middle;
  }

  /* Main headline block — top-center area */
  .headline-wrap {
    position: absolute;
    top: 130px; left: 0; right: 0;
    z-index: 4;
    text-align: center;
    padding: 0 60px;
  }
  .eyebrow {
    font-family: "Geist Mono", monospace;
    text-transform: uppercase;
    letter-spacing: 0.32em;
    font-size: 0.82rem;
    color: rgba(244,239,230,0.7);
    margin-bottom: 1.6rem;
    display: block;
  }
  .name {
    font-family: "Anton", Impact, sans-serif;
    font-size: 220px;
    line-height: 0.86;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .name .accent {
    font-family: "Fraunces", Georgia, serif;
    font-style: italic;
    font-weight: 300;
    font-variation-settings: "opsz" 144, "WONK" 1, "SOFT" 100;
    color: var(--rust);
    text-transform: none;
    letter-spacing: -0.01em;
    font-size: 0.92em;
    display: inline-block;
    margin-top: 0.06em;
  }
  .tagline {
    margin-top: 1.4rem;
    font-family: "Geist Mono", monospace;
    text-transform: uppercase;
    letter-spacing: 0.28em;
    font-size: 0.95rem;
    color: rgba(244,239,230,0.85);
  }
  .tagline span { color: var(--rust); margin: 0 0.5em; }

  /* Floating polaroid-style photo cards */
  .shard {
    position: absolute;
    z-index: 3;
    border-radius: 6px;
    overflow: hidden;
    box-shadow:
      0 30px 80px rgba(0,0,0,0.65),
      0 0 0 1px rgba(244,239,230,0.08);
  }
  .shard img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .shard::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.35) 100%);
  }
  .shard .cap {
    position: absolute;
    bottom: 12px; left: 12px;
    z-index: 2;
    font-family: "Geist Mono", monospace;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    font-size: 0.6rem;
    color: rgba(244,239,230,0.92);
    background: rgba(10,9,8,0.55);
    padding: 0.34rem 0.6rem;
    border-radius: 4px;
    backdrop-filter: blur(6px);
  }

  /* Three vertical cards fanned across the bottom half */
  .shard-1 {
    bottom: 80px; left: 90px;
    width: 280px; height: 380px;
    transform: rotate(-6deg);
  }
  .shard-2 {
    bottom: 100px; left: 50%;
    margin-left: -150px;
    width: 300px; height: 400px;
    transform: rotate(2deg);
    z-index: 4;
  }
  .shard-3 {
    bottom: 80px; right: 90px;
    width: 280px; height: 380px;
    transform: rotate(7deg);
  }

  /* Capture helper — visible only outside the canvas */
  .meta {
    position: fixed;
    top: 12px; left: 12px;
    color: #ddd;
    font-family: "Geist Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.6;
  }
</style>
</head>
<body>
<script>if (location.search.includes("capture")) document.body.classList.add("capture");</script>
<div class="meta">cover · 1200 × 1200 · screenshot the inner frame</div>

<div class="cover" id="cover">
  <!-- Background photo: cinematic, heavily darkened -->
  <div class="cover-bg">
    <img src="photos/cooper_with_guitar_outdoor.jpg" alt="" />
  </div>

  <!-- Top bar -->
  <div class="topbar">
    <span><span class="dot"></span>Portfolio · 2026</span>
    <span>cooperdelo.com</span>
  </div>

  <!-- Headline (top-center) -->
  <div class="headline-wrap">
    <span class="eyebrow">Builder · Musician · Athlete · Lens</span>
    <h1 class="name">Cooper<br/><span class="accent">Delo.</span></h1>
  </div>

  <!-- Three vertical photo cards, fanned across the bottom -->
  <div class="shard shard-1">
    <img src="photos/gig_rubber_tent_purple.jpg" alt="" />
    <span class="cap">Music</span>
  </div>
  <div class="shard shard-2">
    <img src="photos/front-page-hero.jpg" alt="" />
    <span class="cap">Builder</span>
  </div>
  <div class="shard shard-3">
    <img src="photos/thailand_trip_bangkok_skyline.jpg" alt="" />
    <span class="cap">Lens</span>
  </div>

  <!-- Grain on top of everything -->
  <div class="grain"></div>
</div>

</body>
</html>
