  function cymbal(cx2,cy2,cz2){var cyl=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.015,32),metal(0xc9a441,.35));cyl.position.set(cx2,cy2,cz2);cyl.rotation.z=.12;kit.add(cyl);var rod=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,cy2+3.2,8),metal(0x222222));rod.position.set(cx2,(cy2-3.2)/2,cz2);kit.add(rod);}
  cymbal(-1.2,1.9,-.2);cymbal(1.4,2.0,-.1);
  var bass=new THREE.Group();bass.position.set(-4.8,-2.2,1.9);bass.rotation.set(0,.55,.1);scene.add(bass);var bmat=new THREE.MeshStandardMaterial({color:0x5a2b12,roughness:.5,metalness:.12});
  var bd=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,.12,28),bmat);bd.scale.set(1.15,1,.55);bd.rotation.x=Math.PI/2;bd.castShadow=true;bass.add(bd);
  var bn=new THREE.Mesh(new THREE.BoxGeometry(.1,2.3,.07),new THREE.MeshStandardMaterial({color:0x2a1a10,roughness:.6}));bn.position.set(0,1.35,0);bn.castShadow=true;bass.add(bn);
  var bh=new THREE.Mesh(new THREE.BoxGeometry(.19,.4,.06),bmat);bh.position.set(0,2.62,0);bass.add(bh);

  var CAM={wide:{p:new THREE.Vector3(0,2.6,18),l:new THREE.Vector3(0,-.3,0)},work:{p:new THREE.Vector3(0,.7,12),l:new THREE.Vector3(0,-.5,-.2)},play:{p:new THREE.Vector3(0,.3,9),l:new THREE.Vector3(0,-1,1)}};
  var drag=false,lx=0,ly=0,tYaw=0,tPitch=0,yaw=0,pitch=0,focused=null,anim='intro',aT=0,startPos=new THREE.Vector3(),present=new THREE.Vector3(-1.7,.4,4.6);
  var ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),hover=null;
  var hint=document.getElementById('hint'),flabel=document.getElementById('flabel'),panel=document.getElementById('panel'),np=document.getElementById('np');
  canvas.addEventListener('pointerdown',function(e){drag=true;lx=e.clientX;ly=e.clientY;canvas.classList.add('grab');hint.style.opacity=0;});
  window.addEventListener('pointerup',function(){drag=false;canvas.classList.remove('grab');});
  window.addEventListener('pointermove',function(e){mouse.x=(e.clientX/innerWidth)*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;if(drag){tYaw=Math.max(-.45,Math.min(.45,tYaw+(e.clientX-lx)*.004));tPitch=Math.max(-.15,Math.min(.3,tPitch-(e.clientY-ly)*.003));lx=e.clientX;ly=e.clientY;}});
  function fillPanel(sec){document.getElementById('peye').textContent=sec.sub.toUpperCase();document.getElementById('peye').style.color=sec.accent;document.getElementById('ptitle').textContent=sec.key;
    var op=document.getElementById('popen');op.href=sec.link;op.style.color=sec.accent;op.style.borderColor=sec.accent+'66';
    document.getElementById('prows').innerHTML=sec.rows.map(function(r){return '<div><span class="k">'+r[0]+'</span><span>'+r[1]+'</span></div>';}).join('');
    document.getElementById('pdesc').textContent=sec.desc;
    document.getElementById('pkit').innerHTML=sec.kit?('<div class="subh">The kit</div><div class="kit">'+sec.kit.map(function(k){return '<div class="kitc"><h4>'+k.n+'</h4>'+k.r.map(function(r){return '<div class="r"><span>'+r[0]+'</span><span>'+r[1]+'</span></div>';}).join('')+'</div>';}).join('')+'</div>'):'';
    document.getElementById('pgal').innerHTML=sec.gal.map(function(p){return '<img loading="lazy" src="'+P+p+'">';}).join('');}
  function play(vn){var sec=vn.userData.sec;focused=vn;vn.userData.peek.visible=false;vn.getWorldPosition(startPos);anim='eject';aT=0;np.textContent='▶ '+sec.key;np.style.color=sec.accent;var dt=discTex(sec.accent);recTop.material.map=dt;recTop.material.needsUpdate=true;recBot.material.map=dt;recBot.material.needsUpdate=true;}
  function closeIt(){if(anim!=='idle'&&anim!=='intro'){anim='return';aT=0;panel.style.transform='translateX(103%)';np.textContent='the studio';np.style.color='';}}
  document.getElementById('px').onclick=closeIt;window.addEventListener('keydown',function(e){if(e.key==='Escape')closeIt();});
  canvas.addEventListener('click',function(){if(hover&&anim==='idle')play(hover);});
  window.addEventListener('resize',function(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();});
  renderer.setSize(innerWidth,innerHeight);
  setTimeout(function(){document.getElementById('loader').classList.add('hide');},1400);

  var clock=new THREE.Clock(),tmp=new THREE.Vector3(),tmp2=new THREE.Vector3(),fp=new THREE.Vector3();
  function ease(t){return t*t*(3-2*t);}
  function loop(){requestAnimationFrame(loop);var dt=Math.min(clock.getDelta(),.05);
    if(!drag)tYaw+=(0-tYaw)*.01;yaw+=(tYaw-yaw)*.06;pitch+=(tPitch-pitch)*.06;wall.rotation.y=yaw*.2;
    platter.getWorldPosition(platterWorld);platterWorld.y+=.1;var spin=0;
    if(anim==='intro'){aT+=dt/3.2;if(aT>=1)anim='idle';}
    else if(anim==='eject'){aT+=dt/.7;var e=ease(Math.min(aT,1));focused.position.lerpVectors(focused.userData.home,present,e);focused.rotation.x=lean*(1-e);if(aT>=1){anim='slide';aT=0;fly.visible=true;fly.position.copy(present);fly.rotation.set(Math.PI/2,0,0);}}
    else if(anim==='slide'){aT+=dt/.6;var e2=ease(Math.min(aT,1));spin=2.5;tmp.copy(present);tmp.x+=1.6;fly.position.lerpVectors(present,tmp,e2);fly.rotation.x=Math.PI/2;if(aT>=1){anim='travel';aT=0;startPos.copy(fly.position);}}
    else if(anim==='travel'){aT+=dt/1.0;var e3=ease(Math.min(aT,1));spin=5;fly.position.lerpVectors(startPos,platterWorld,e3);fly.position.y+=Math.sin(e3*Math.PI)*1.4;fly.rotation.x=(Math.PI/2)*(1-e3);if(aT>=1){anim='playing';fly.position.copy(platterWorld);fly.rotation.x=0;panel.style.transform='translateX(0)';fillPanel(focused.userData.sec);}}
    else if(anim==='playing'){spin=9;arm.rotation.y+=((-0.05)-arm.rotation.y)*.06;focused.position.y+=(present.y+.05+Math.sin(clock.elapsedTime*1.5)*.04-focused.position.y)*.1;}
    else if(anim==='return'){aT+=dt/.9;var e4=ease(Math.min(aT,1));spin=4;arm.rotation.y+=((-0.6)-arm.rotation.y)*.1;fly.position.lerpVectors(platterWorld,present,e4);fly.position.y+=Math.sin(e4*Math.PI)*1.1;fly.rotation.x=(Math.PI/2)*e4;focused.position.lerpVectors(present,focused.userData.home,e4);focused.rotation.x=lean*e4;if(aT>=1){anim='idle';fly.visible=false;focused.userData.peek.visible=true;focused=null;}}
    inner.rotation.y+=spin*dt;
    if(anim==='eject')fp.copy(present);else if(anim==='slide'||anim==='travel'||anim==='return')fp.copy(fly.position);else if(anim==='playing')fp.copy(platterWorld);
    if(anim==='intro'){var pr=ease(Math.min(aT,1));tmp.lerpVectors(CAM.wide.p,CAM.work.p,pr);tmp2.lerpVectors(CAM.wide.l,CAM.work.l,pr);}
    else if(anim==='idle'){tmp.copy(CAM.work.p);tmp2.copy(CAM.work.l);}else{tmp.copy(CAM.play.p);tmp2.copy(fp);}
    tmp.x+=yaw*2.4;tmp.y+=pitch*2;cam.position.lerp(tmp,.05);lookTarget.lerp(tmp2,.06);cam.lookAt(lookTarget);
    if(anim==='idle'){ray.setFromCamera(mouse,cam);var hits=ray.intersectObjects(vinyls,true);var h2=null;if(hits.length){var o=hits[0].object;while(o&&!o.userData.sec)o=o.parent;h2=o;}if(h2!==hover){hover=h2;flabel.style.opacity=hover?1:0;if(hover)flabel.textContent=hover.userData.sec.key;canvas.style.cursor=hover?'pointer':'grab';}}
    for(var k=0;k<vinyls.length;k++){var vv=vinyls[k];if(vv===focused)continue;var on=(vv===hover&&anim==='idle');vv.userData.edge.material.opacity+=((on?.85:0)-vv.userData.edge.material.opacity)*.15;var tz=vv.userData.home.z+(on?.4:0),ty=vv.userData.home.y+(on?.1:0);vv.position.z+=(tz-vv.position.z)*.12;vv.position.y+=(ty-vv.position.y)*.12;}
    renderer.render(scene,cam);}
  loop();
})();
</script>
