<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>Merch · CD Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Geist+Mono:wght@300..700&family=Geist:wght@300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/admin/_shell/admin-shell.css" />
<style>
/* Merch-specific overrides — reuse admin .card/.kpi-grid where possible */
.m-row{display:grid;grid-template-columns:3rem 1fr auto auto;align-items:center;gap:1.4rem;padding:1.15rem 1.5rem;border-bottom:1px solid rgba(244,239,230,.06);transition:background .2s}
.m-row:last-child{border-bottom:0}
.m-row:hover{background:rgba(244,239,230,.025)}
.m-row.low{background:rgba(255,77,46,.045)}
.m-row.out{opacity:.42}
.m-row .idx{font-family:"Geist Mono",monospace;font-size:.7rem;letter-spacing:.18em;color:var(--muted)}
.m-row .nm{font-family:"Geist",sans-serif;font-weight:600;font-size:1.05rem;line-height:1.2;color:var(--ink);letter-spacing:-.005em}
.m-row .vn{font-family:"Geist Mono",monospace;font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--rust);margin-top:.35rem}
.m-row .info{font-family:"Geist Mono",monospace;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:.3rem}
.m-row .stk{display:flex;flex-direction:column;align-items:center;min-width:4.5rem}
.m-row .stk .n{font-family:"Anton",Impact,sans-serif;font-size:2.2rem;line-height:.95;color:var(--ink)}
.m-row.low .stk .n{color:var(--rust)}
.m-row.out .stk .n{color:#666}
.m-row .stk .l{font-family:"Geist Mono",monospace;font-size:.55rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:.2rem}
.m-row .ctrl{display:flex;gap:.4rem}
.m-row .ctrl button{width:2.3rem;height:2.3rem;border-radius:8px;background:rgba(244,239,230,.05);border:1px solid rgba(244,239,230,.12);color:var(--ink-2);font-family:"Geist",sans-serif;font-size:1.1rem;font-weight:300;cursor:pointer;transition:all .15s;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.m-row .ctrl button:hover{background:rgba(255,77,46,.16);border-color:var(--rust);color:var(--rust)}
.m-row .ctrl button.edit{font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;font-family:"Geist Mono",monospace;width:auto;padding:0 .8rem}

.d-row{display:grid;grid-template-columns:1fr auto auto;gap:1.4rem;align-items:center;padding:1.05rem 1.5rem;border-bottom:1px solid rgba(244,239,230,.06)}
.d-row:last-child{border-bottom:0}
.d-row .who{font-family:"Geist",sans-serif;font-weight:600;font-size:1.05rem;line-height:1.2;color:var(--ink);letter-spacing:-.005em}
.d-row .sub{font-family:"Geist Mono",monospace;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:.35rem}
.d-row .amt{font-family:"Anton",Impact,sans-serif;font-size:1.7rem;line-height:1;color:var(--rust)}
.btn-paid{font-family:"Geist Mono",monospace;font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;padding:.6rem .85rem;border-radius:8px;background:rgba(244,239,230,.05);border:1px solid rgba(244,239,230,.12);color:var(--ink-2);cursor:pointer;transition:all .2s}
.btn-paid:hover{background:var(--sage);border-color:var(--sage);color:var(--bg)}

.t-row{display:grid;grid-template-columns:6rem 1fr auto;gap:1.2rem;align-items:center;padding:.8rem 1.5rem;border-bottom:1px solid rgba(244,239,230,.05)}
.t-row:last-child{border-bottom:0}
.t-row .when{font-family:"Geist Mono",monospace;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.t-row .what{font-family:"Geist",sans-serif;font-size:.88rem;color:var(--ink-2);line-height:1.4}
.t-row .what strong{color:var(--ink);font-weight:500}
.t-row .what .badge{display:inline-block;font-family:"Geist Mono",monospace;font-size:.55rem;letter-spacing:.22em;text-transform:uppercase;padding:.22rem .48rem;border-radius:4px;background:rgba(244,239,230,.07);color:var(--ink-2);margin-right:.55rem;vertical-align:1px}
.t-row .what .badge.sale{background:rgba(255,77,46,.18);color:var(--rust)}
.t-row .what .badge.restock{background:rgba(122,138,110,.22);color:var(--sage)}
.t-row .what .badge.adjust,.t-row .what .badge.gift,.t-row .what .badge.lost{background:rgba(244,239,230,.07);color:var(--ink-2)}
.t-row .amt{font-family:"Geist Mono",monospace;font-size:.78rem;color:var(--ink-2);letter-spacing:.05em;text-align:right;white-space:nowrap}
.t-row .amt.owed{color:var(--rust)}

.m-empty{padding:2.5rem 1.5rem;text-align:center;color:var(--muted);font-family:"Geist Mono",monospace;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;line-height:1.7}

/* Sheet (modal-style form panel) */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:90;opacity:0;pointer-events:none;transition:opacity .35s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%) translateY(100%);width:100%;max-width:560px;background:rgba(20,17,15,.92);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border-top-left-radius:22px;border-top-right-radius:22px;border:1px solid rgba(244,239,230,.14);border-bottom:none;padding:1.5rem 1.7rem calc(1.8rem + env(safe-area-inset-bottom));z-index:95;max-height:88dvh;overflow-y:auto;transition:transform .42s cubic-bezier(.22,1,.36,1)}
.sheet.on{transform:translateX(-50%) translateY(0)}
.sheet-grip{width:42px;height:4px;border-radius:2px;background:rgba(244,239,230,.18);margin:-.2rem auto 1.2rem}
.sheet h2{font-family:"Geist",sans-serif;font-weight:600;font-size:1.3rem;line-height:1.1;letter-spacing:-.01em;margin:0 0 1.3rem;color:var(--ink)}
.sheet .field{margin-bottom:.9rem}
.sheet .field > label{display:block;font-family:"Geist Mono",monospace;font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:.45rem}
.sheet .field input,.sheet .field select,.sheet .field textarea{width:100%;background:rgba(244,239,230,.04);border:1px solid rgba(244,239,230,.12);border-radius:10px;padding:.8rem .95rem;color:var(--ink);font-family:"Geist",sans-serif;font-size:.95rem;outline:none;transition:border-color .15s;-webkit-appearance:none;appearance:none;color-scheme:dark}
.sheet .field input:focus,.sheet .field select:focus,.sheet .field textarea:focus{border-color:var(--rust)}
.sheet .field select option{background:#14110F;color:var(--ink)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:.25rem;background:rgba(244,239,230,.04);border:1px solid rgba(244,239,230,.1);border-radius:10px;padding:.3rem;margin-top:.2rem}
.seg button{padding:.6rem .4rem;border-radius:7px;background:transparent;color:var(--muted);font-family:"Geist Mono",monospace;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;border:none;transition:all .15s}
.seg button.on{background:var(--rust);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.5rem}
.chip{font-family:"Geist Mono",monospace;font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;padding:.38rem .65rem;border-radius:999px;background:rgba(244,239,230,.05);border:1px solid rgba(244,239,230,.1);color:var(--ink-2);cursor:pointer;transition:all .15s}
.chip:hover{background:var(--rust);border-color:var(--rust);color:var(--bg)}
.btn-rust{display:block;width:100%;padding:1rem;border-radius:12px;background:var(--rust);border:none;color:var(--bg);font-family:"Geist Mono",monospace;font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;font-weight:500;cursor:pointer;margin-top:.5rem;transition:background .2s}
.btn-rust:hover{background:#ff6648}
.btn-ghost{display:block;width:100%;padding:.9rem;border-radius:12px;background:transparent;border:1px solid rgba(244,239,230,.12);color:var(--ink-2);font-family:"Geist Mono",monospace;font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;margin-top:.4rem;transition:all .2s}
.btn-ghost:hover{border-color:rgba(244,239,230,.25);color:var(--ink)}
.btn-danger{display:block;width:100%;padding:.9rem;border-radius:12px;background:transparent;border:1px solid rgba(200,16,46,.5);color:var(--crimson);font-family:"Geist Mono",monospace;font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;margin-top:.4rem;transition:all .2s}
.btn-danger:hover{background:var(--crimson);color:var(--ink);border-color:var(--crimson)}
.hint{font-family:"Geist Mono",monospace;font-size:.55rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:.35rem;opacity:.75}

@media (max-width:900px){
  .m-row{grid-template-columns:1fr auto;gap:.7rem;padding:1rem 1.1rem;align-items:start}
  .m-row .idx{display:none}
  .m-row .stk{flex-direction:row;align-items:baseline;gap:.4rem;min-width:0}
  .m-row .stk .n{font-size:1.7rem}
  .m-row .stk .l{margin-top:0;font-size:.5rem}
  .m-row .ctrl{grid-column:2;grid-row:2;justify-content:flex-end}
  .d-row{padding:1rem 1.1rem;grid-template-columns:1fr auto;gap:.6rem;align-items:start}
  .d-row .who-block{grid-column:1;grid-row:1}
  .d-row .amt{grid-column:2;grid-row:1;font-size:1.45rem}
  .d-row .btn-paid{grid-column:1 / -1;grid-row:2;justify-self:start;margin-top:.25rem}
  .t-row{grid-template-columns:1fr auto;padding:.8rem 1.1rem;row-gap:.2rem}
  .t-row .when{grid-row:2;grid-column:1;font-size:.55rem}
  .t-row .what{grid-column:1;grid-row:1;font-size:.83rem}
  .t-row .amt{grid-column:2;grid-row:1 / 3;align-self:center}
}
</style>
</head>
<body>
  <main>
    <div class="page-head">
      <div>
        <div class="eyebrow">Inventory · Live</div>
        <h1>Merch <span class="accent">tracker</span></h1>
      </div>
      <div class="actions">
        <span class="live-dot" id="live-indicator">Live · syncing</span>
        <button class="btn primary" data-action="open-sell">+ New sale</button>
        <button class="btn" data-action="open-restock">+ Restock</button>
        <button class="btn" data-action="open-item">+ New item</button>
      </div>
    </div>

    <div class="kpi-grid">
      <div class="card"><div class="label">In stock</div><div class="value" id="s-stock">—</div><div class="delta flat"><span id="s-skus">0</span> active SKUs</div></div>
      <div class="card"><div class="label">Collected</div><div class="value" id="s-collected">$0</div><div class="delta flat"><span id="s-sold">0</span> units sold</div></div>
      <div class="card"><div class="label">Owed</div><div class="value" id="s-owed">$0</div><div class="delta neg"><span id="s-debtors">0</span> people outstanding</div></div>
    </div>

    <h2 class="section-h">Inventory <span class="accent" id="ax-inv">—</span></h2>
    <div class="card" style="padding:0;overflow:hidden;">
      <div id="inv-list"></div>
    </div>

    <h2 class="section-h">Outstanding <span class="accent" id="ax-debt">—</span></h2>
    <div class="card" style="padding:0;overflow:hidden;">
      <div id="debt-list"></div>
    </div>

    <h2 class="section-h">Recent activity <span class="accent" id="ax-tx">—</span></h2>
    <div class="card" style="padding:0;overflow:hidden;margin-bottom:3rem;">
      <div id="tx-list"></div>
    </div>
  </main>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-grip"></div>
    <div id="sheet-body"></div>
  </div>

  <script type="module">
    import { sb, subscribeTable } from '/admin/_shell/supabase.js';
    import { mountShell, toast } from '/admin/_shell/admin-shell.js';

    await mountShell({ title: 'Merch · Tracker' });

    const state = { items: [], txs: [], people: [] };
    const $  = (q, el = document) => el.querySelector(q);
    const $$ = (q, el = document) => [...el.querySelectorAll(q)];
    const fmt$ = n => '$' + (Number(n) || 0).toFixed(2);
    const sum = (a, f) => a.reduce((x, y) => x + (f ? f(y) : y), 0);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
    const fromNow = d => {
      const s = Math.floor((Date.now() - new Date(d).getTime()) / 1000);
      if (s < 60)    return s + 's ago';
      if (s < 3600)  return Math.floor(s / 60) + 'm ago';
      if (s < 86400) return Math.floor(s / 3600) + 'h ago';
      const days = Math.floor(s / 86400);
      return days < 7 ? days + 'd ago' : (new Date(d)).toLocaleDateString('en-US', { month:'short', day:'numeric' });
    };

    const indicator = $('#live-indicator');
    const scrim = $('#scrim'), sheet = $('#sheet'), sheetBody = $('#sheet-body');
    function openSheet(html){ sheetBody.innerHTML = html; scrim.classList.add('on'); sheet.classList.add('on'); document.body.style.overflow = 'hidden'; }
    function closeSheet(){ scrim.classList.remove('on'); sheet.classList.remove('on'); document.body.style.overflow = ''; }
    scrim.addEventListener('click', closeSheet);

    async function loadAll(){
      const [items, txs] = await Promise.all([
        sb.from('merch_items').select('*').eq('archived', false).order('sort_order'),
        sb.from('merch_transactions').select('*').order('created_at', { ascending: false }).limit(200),
      ]);
      if (items.error){ toast('Load failed: ' + items.error.message, 'err'); return; }
      state.items = items.data || [];
      state.txs   = txs.data || [];
      state.people = [...new Set(state.txs.map(t => t.person_name).filter(Boolean))].slice(0, 40);
      render();
    }

    function stockOf(itemId){
      const item = state.items.find(i => i.id === itemId);
      if (!item) return 0;
      let net = 0;
      for (const t of state.txs){
        if (t.item_id !== itemId) continue;
        if (t.type === 'sale' || t.type === 'gift' || t.type === 'lost') net -= t.quantity;
        else if (t.type === 'restock' || t.type === 'adjust')             net += t.quantity;
      }
      return item.initial_stock + net;
    }
    function soldOf(id){ return sum(state.txs.filter(t => t.item_id === id && t.type === 'sale'), t => t.quantity); }

    function debtsByPerson(){
      const map = {};
      for (const t of state.txs){
        if (t.type !== 'sale' || !t.person_name) continue;
        const k = t.person_name.trim().toLowerCase();
        const bal = (Number(t.amount_owed) || 0) - (Number(t.amount_paid) || 0);
        if (!map[k]) map[k] = { name: t.person_name.trim(), balance: 0, txCount: 0, last: t.created_at };
        map[k].balance += bal;
        map[k].txCount += bal > 0.005 ? 1 : 0;
        if (new Date(t.created_at) > new Date(map[k].last)) map[k].last = t.created_at;
      }
      return Object.values(map).filter(p => p.balance > 0.005).sort((a, b) => b.balance - a.balance);
    }

    function render(){
      const totalStock = sum(state.items, i => stockOf(i.id));
      const collected  = sum(state.txs.filter(t => t.type === 'sale'), t => Number(t.amount_paid) || 0);
      const sold       = sum(state.txs.filter(t => t.type === 'sale'), t => t.quantity);
      const debts      = debtsByPerson();
      const owed       = sum(debts, d => d.balance);

      $('#s-stock').textContent     = totalStock;
      $('#s-skus').textContent      = state.items.length;
      $('#s-collected').textContent = fmt$(collected);
      $('#s-sold').textContent      = sold;
      $('#s-owed').textContent      = fmt$(owed);
      $('#s-debtors').textContent   = debts.length;

      $('#ax-inv').textContent  = state.items.length + ' items';
      $('#ax-debt').textContent = debts.length + ' open';
      $('#ax-tx').textContent   = state.txs.length + ' logged';

      $('#inv-list').innerHTML = state.items.length
        ? state.items.map(itemRow).join('')
        : `<div class="m-empty">No items yet. Tap "+ New item" to add merch.</div>`;

      $('#debt-list').innerHTML = debts.length
        ? debts.map(debtRow).join('')
        : `<div class="m-empty">Nobody owes you anything. Clean slate.</div>`;

      $('#tx-list').innerHTML = state.txs.length
        ? state.txs.slice(0, 80).map(txRow).join('')
        : `<div class="m-empty">No transactions yet.</div>`;
    }

    function itemRow(i){
      const idxNum = String((state.items.indexOf(i)) + 1).padStart(2, '0');
      const stock  = stockOf(i.id);
      const sold   = soldOf(i.id);
      const cls    = stock <= 0 ? 'out' : (stock <= 3 ? 'low' : '');
      return `<div class="m-row ${cls}">
        <div class="idx">${idxNum}</div>
        <div>
          <div class="nm">${esc(i.name)}</div>
          ${i.variant ? `<div class="vn">${esc(i.variant)}</div>` : ''}
          <div class="info">${fmt$(i.price)} · ${sold} sold · ${i.initial_stock} starting</div>
        </div>
        <div class="stk"><span class="n">${stock}</span><span class="l">In stock</span></div>
        <div class="ctrl">
          <button data-action="sell" data-id="${i.id}" title="Quick sell">−</button>
          <button data-action="restock-one" data-id="${i.id}" title="Restock +1">+</button>
          <button class="edit" data-action="edit-item" data-id="${i.id}">Edit</button>
        </div>
      </div>`;
    }

    function debtRow(d){
      return `<div class="d-row">
        <div class="who-block">
          <div class="who">${esc(d.name)}</div>
          <div class="sub">${d.txCount} open · last ${fromNow(d.last)}</div>
        </div>
        <div class="amt">${fmt$(d.balance)}</div>
        <button class="btn-paid" data-action="mark-paid" data-name="${esc(d.name)}">Mark paid</button>
      </div>`;
    }

    function txRow(t){
      const item  = state.items.find(i => i.id === t.item_id);
      const label = item ? `${item.name}${item.variant ? ' · ' + item.variant : ''}` : '—';
      const owed  = Number(t.amount_owed) || 0, paid = Number(t.amount_paid) || 0;
      let line = '';
      if (t.type === 'sale'){
        const who = t.person_name ? `<strong>${esc(t.person_name)}</strong>` : `<strong>Cash</strong>`;
        line = `<span class="badge sale">Sale</span>${who} · ${t.quantity}× ${esc(label)}`;
      } else if (t.type === 'restock'){
        line = `<span class="badge restock">Stock+</span>+${t.quantity} ${esc(label)}${t.notes ? ' · ' + esc(t.notes) : ''}`;
      } else {
        line = `<span class="badge ${t.type}">${cap(t.type)}</span>${t.quantity > 0 ? '+' : ''}${t.quantity} ${esc(label)}`;
      }
      const amt    = t.type === 'sale' ? (paid >= owed ? fmt$(paid) : `${fmt$(paid)} / ${fmt$(owed)}`) : '';
      const amtCls = (t.type === 'sale' && paid < owed) ? 'owed' : '';
      return `<div class="t-row">
        <div class="when">${fromNow(t.created_at)}</div>
        <div class="what">${line}</div>
        <div class="amt ${amtCls}">${amt}</div>
      </div>`;
    }

    // ============ Forms ============
    function sellForm(preselectId){
      const opts = state.items.map(i =>
        `<option value="${i.id}" data-price="${i.price}" ${i.id === preselectId ? 'selected' : ''}>${esc(i.name)}${i.variant ? ' · ' + esc(i.variant) : ''} (${stockOf(i.id)} left)</option>`
      ).join('');
      const chips = state.people.slice(0, 6).map(p => `<button type="button" class="chip" data-fill="${esc(p)}">${esc(p)}</button>`).join('');
      return `<h2>New sale</h2>
        <form id="sell-form">
          <div class="field"><label>Item</label><select name="item_id" required>${opts}</select></div>
          <div class="grid-2">
            <div class="field"><label>Quantity</label><input name="quantity" type="number" min="1" value="1" required></div>
            <div class="field"><label>Unit price</label><input name="price" type="number" step="0.01" min="0" required></div>
          </div>
          <div class="field"><label>Buyer (optional)</label><input name="person_name" placeholder="Name or leave blank for cash" autocomplete="off">
            ${chips ? `<div class="chips">${chips}</div>` : ''}
          </div>
          <div class="field"><label>Paid now</label>
            <div class="seg" data-target="paid_mode">
              <button type="button" data-v="full" class="on">Paid in full</button>
              <button type="button" data-v="none">Owes all</button>
              <button type="button" data-v="custom">Custom</button>
            </div>
            <input name="amount_paid" type="number" step="0.01" min="0" style="margin-top:.5rem;display:none" placeholder="Amount paid">
            <input type="hidden" name="paid_mode" value="full">
          </div>
          <div class="field"><label>Payment method (optional)</label><input name="payment_method" placeholder="Cash, Venmo, Zelle…"></div>
          <div class="field"><label>Notes (optional)</label><input name="notes"></div>
          <button class="btn-rust" type="submit">Record sale</button>
          <button class="btn-ghost" type="button" data-action="close">Cancel</button>
        </form>`;
    }

    function restockForm(preselectId){
      const opts = state.items.map(i =>
        `<option value="${i.id}" ${i.id === preselectId ? 'selected' : ''}>${esc(i.name)}${i.variant ? ' · ' + esc(i.variant) : ''} (${stockOf(i.id)} left)</option>`
      ).join('');
      return `<h2>Add stock</h2>
        <form id="restock-form">
          <div class="field"><label>Item</label><select name="item_id" required>${opts}</select></div>
          <div class="field"><label>Quantity to add</label><input name="quantity" type="number" min="1" value="1" required></div>
          <div class="field"><label>Notes (optional)</label><input name="notes" placeholder="e.g. New batch from printer"></div>
          <button class="btn-rust" type="submit">Add to inventory</button>
          <button class="btn-ghost" type="button" data-action="close">Cancel</button>
        </form>`;
    }

    function itemForm(item){
      const editing = !!item;
      return `<h2>${editing ? 'Edit item' : 'New item'}</h2>
        <form id="item-form" data-id="${item?.id || ''}">
          <div class="field"><label>Name</label><input name="name" required value="${esc(item?.name || '')}" placeholder="e.g. Plugverse Tee"></div>
          <div class="field"><label>Variant / size</label><input name="variant" value="${esc(item?.variant || '')}" placeholder="e.g. Small, Hoodie, Black"></div>
          <div class="grid-2">
            <div class="field"><label>Price ($)</label><input name="price" type="number" step="0.01" min="0" required value="${item?.price ?? 25}"></div>
            <div class="field"><label>Starting stock</label><input name="initial_stock" type="number" min="0" required value="${item?.initial_stock ?? 0}">${editing ? '<div class="hint">Affects all-time math</div>' : ''}</div>
          </div>
          <button class="btn-rust" type="submit">${editing ? 'Save changes' : 'Create item'}</button>
          ${editing ? '<button class="btn-danger" type="button" data-action="archive">Archive item</button>' : ''}
          <button class="btn-ghost" type="button" data-action="close">Cancel</button>
        </form>`;
    }

    // ============ Event delegation ============
    document.addEventListener('click', async e => {
      const t = e.target.closest('[data-action]');
      if (!t) return;
      const a = t.dataset.action;
      if (a === 'close')         return closeSheet();
      if (a === 'open-sell')     return openSheet(sellForm());
      if (a === 'open-restock')  return openSheet(restockForm());
      if (a === 'open-item')     return openSheet(itemForm(null));
      if (a === 'sell')          return openSheet(sellForm(t.dataset.id));
      if (a === 'restock-one')   return quickRestock(t.dataset.id);
      if (a === 'edit-item'){ const it = state.items.find(i => i.id === t.dataset.id); return openSheet(itemForm(it)); }
      if (a === 'mark-paid')     return markPaid(t.dataset.name);
      if (a === 'archive'){
        const id = $('#item-form').dataset.id;
        if (!confirm('Archive this item? Past sales stay in history.')) return;
        const { error } = await sb.from('merch_items').update({ archived: true }).eq('id', id);
        if (error) return toast(error.message, 'err');
        toast('Archived', 'ok'); closeSheet(); await loadAll();
      }
    });

    document.addEventListener('click', e => {
      const c = e.target.closest('.chip'); if (!c) return;
      const input = c.closest('form')?.querySelector('[name="person_name"]');
      if (input){ input.value = c.dataset.fill; input.focus(); }
    });

    document.addEventListener('click', e => {
      const b = e.target.closest('.seg button'); if (!b) return;
      const seg = b.parentElement;
      $$('button', seg).forEach(x => x.classList.toggle('on', x === b));
      const target = seg.dataset.target;
      const form = b.closest('form');
      if (target && form){
        form.querySelector(`[name="${target}"]`).value = b.dataset.v;
        if (target === 'paid_mode'){
          const ci = form.querySelector('[name="amount_paid"]');
          ci.style.display = b.dataset.v === 'custom' ? 'block' : 'none';
        }
      }
    });

    document.addEventListener('change', e => {
      if (e.target.matches('#sell-form [name="item_id"]')){
        const opt = e.target.selectedOptions[0];
        const pf = e.target.closest('form').querySelector('[name="price"]');
        if (opt && pf && !pf.dataset.touched) pf.value = opt.dataset.price;
      }
      if (e.target.matches('#sell-form [name="price"]')) e.target.dataset.touched = '1';
    });

    document.addEventListener('submit', async e => {
      e.preventDefault();
      const f = e.target;
      if (f.id === 'sell-form'){
        const fd = new FormData(f);
        const qty   = parseInt(fd.get('quantity'), 10);
        const price = parseFloat(fd.get('price'));
        const owed  = +(qty * price).toFixed(2);
        const mode  = fd.get('paid_mode');
        let paid = mode === 'full' ? owed : (mode === 'none' ? 0 : parseFloat(fd.get('amount_paid') || '0'));
        if (isNaN(paid)) paid = 0;
        const payload = {
          item_id: fd.get('item_id'), type: 'sale', quantity: qty,
          person_name: (fd.get('person_name') || '').trim(),
          amount_owed: owed, amount_paid: paid,
          payment_method: (fd.get('payment_method') || '').trim(),
          notes: (fd.get('notes') || '').trim(),
          paid_at: paid >= owed ? new Date().toISOString() : null,
        };
        const { error } = await sb.from('merch_transactions').insert(payload);
        if (error) return toast(error.message, 'err');
        toast(`Sale logged · ${fmt$(owed)}${paid < owed ? ' · ' + fmt$(owed - paid) + ' owed' : ''}`, 'ok');
        closeSheet(); await loadAll();
      }
      if (f.id === 'restock-form'){
        const fd = new FormData(f);
        const payload = { item_id: fd.get('item_id'), type: 'restock', quantity: parseInt(fd.get('quantity'), 10), notes: (fd.get('notes') || '').trim() };
        const { error } = await sb.from('merch_transactions').insert(payload);
        if (error) return toast(error.message, 'err');
        toast(`Restocked +${payload.quantity}`, 'ok');
        closeSheet(); await loadAll();
      }
      if (f.id === 'item-form'){
        const fd = new FormData(f);
        const payload = {
          name:          fd.get('name').trim(),
          variant:       (fd.get('variant') || '').trim(),
          price:         parseFloat(fd.get('price')),
          initial_stock: parseInt(fd.get('initial_stock'), 10),
        };
        const id = f.dataset.id;
        if (id){
          const { error } = await sb.from('merch_items').update(payload).eq('id', id);
          if (error) return toast(error.message, 'err');
          toast('Saved', 'ok');
        } else {
          payload.sort_order = (state.items.at(-1)?.sort_order || 0) + 1;
          const { error } = await sb.from('merch_items').insert(payload);
          if (error) return toast(error.message, 'err');
          toast('Item created', 'ok');
        }
        closeSheet(); await loadAll();
      }
    });

    async function quickRestock(itemId){
      const { error } = await sb.from('merch_transactions').insert({ item_id: itemId, type: 'restock', quantity: 1, notes: 'Quick +1' });
      if (error) return toast(error.message, 'err');
      toast('Restocked +1', 'ok');
      await loadAll();
    }

    async function markPaid(name){
      if (!confirm(`Mark all of ${name}'s debts as paid?`)) return;
      const { data, error } = await sb.from('merch_transactions').select('*').eq('type', 'sale').ilike('person_name', name);
      if (error) return toast(error.message, 'err');
      const open = (data || []).filter(r => (Number(r.amount_owed) || 0) - (Number(r.amount_paid) || 0) > 0.005);
      if (!open.length) return toast('Nothing owed', 'ok');
      const updates = open.map(r => sb.from('merch_transactions').update({ amount_paid: r.amount_owed, paid_at: new Date().toISOString() }).eq('id', r.id));
      const results = await Promise.all(updates);
      if (results.some(r => r.error)) return toast('Some updates failed', 'err');
      toast(`${name} cleared`, 'ok');
      await loadAll();
    }

    // ============ Realtime (debounced) ============
    subscribeTable('merch_items',        () => loadAll());
    subscribeTable('merch_transactions', () => { indicator.textContent = 'Live · updated'; loadAll().then(() => setTimeout(() => indicator.textContent = 'Live · syncing', 1800)); });

    await loadAll();
    indicator.textContent = 'Live · syncing';

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
  </script>
</body>
</html>
