<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>Funding sources · CD Admin</title>
<link rel="stylesheet" href="/admin/_shell/admin-shell.css" />
<style>
  /* funding sources: one glass card each, Druk remaining, bone pill meter */
  .fs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-bottom: 14px; }
  .fs-card { display: flex; flex-direction: column; gap: 8px; container-type: inline-size; }
  .fs-card .name { font-weight: 700; font-size: 15px; color: var(--text); }
  .fs-card .slug-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .fs-card .slug, .fs-card .award, .fs-card .sub, .fs-card .started, .fs-card .pct-row { font-family: var(--f-mono); font-size: 10px; text-transform: uppercase; color: var(--text-3); }
  .fs-card .award { color: var(--text-2); }
  .fs-card .remaining { font-family: var(--f-display); font-size: clamp(24px, 13cqi, 44px); line-height: .92; color: var(--text); margin-top: 10px; }
  .fs-card .remaining.exhausted, .fs-card .remaining.negative { color: var(--text-3); }
  .fs-bar { height: 8px; border-radius: 999px; background: rgba(244, 241, 234, .07); overflow: hidden; margin-top: 6px; }
  .fs-bar > .fill { height: 100%; width: 0%; border-radius: inherit; background: var(--bone); transition: width 1.1s var(--ease); }
  .fs-bar.unbounded > .fill { background: rgba(244, 241, 234, .5); }
  .fs-card .pct-row { display: flex; justify-content: space-between; }
  .fs-card .actions { margin-top: auto; padding-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  .fs-card .actions a { display: inline-flex; align-items: center; min-height: 30px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line-2); font-weight: 700; font-size: 11.5px; color: var(--text); transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
  .fs-card .actions a:hover { background: var(--bone); color: var(--ink-0); }
  .fs-inactive { opacity: .55; }
</style>
</head>
<body>
  <main>
    <div class="page-head">
      <div>
        <h1>Funding</h1>
      </div>
      <div class="actions">
        <span class="live-dot" id="live-indicator">Live</span>
        <a class="btn" href="/admin/finance/">Overview</a>
      </div>
    </div>

    <div class="kpi-grid">
      <div class="card"><div class="label">Total received</div><div class="value" data-k="t_received">–</div><div class="delta flat" data-k="t_received_sub">Ledger · all time</div></div>
      <div class="card"><div class="label">Total spent</div><div class="value" data-k="t_spent">–</div><div class="delta flat" data-k="t_spent_sub">Funded expenses</div></div>
      <div class="card"><div class="label">Available</div><div class="value" data-k="t_remaining">–</div><div class="delta flat" data-k="t_remaining_sub">Active sources</div></div>
      <div class="card"><div class="label">Active sources</div><div class="value" data-k="t_sources">–</div><div class="delta flat" data-k="t_sources_sub">Funding ledger</div></div>
    </div>

    <h2 class="section-h">Active</h2>
    <div class="fs-grid" id="fs-active"></div>

    <h2 class="section-h" id="inactive-header" style="display:none;">Retired</h2>
    <div class="fs-grid" id="fs-inactive"></div>
  </main>

  <script type="module">
    import { sb, fmtUSD, fmtUSDCompact, subscribeTable } from '/admin/_shell/supabase.js';
    import { mountShell, toast } from '/admin/_shell/admin-shell.js';

    await mountShell({ title: 'Funding sources · Finance' });
    const indicator = document.getElementById('live-indicator');

    function setK(k, v){ const e = document.querySelector(`[data-k="${k}"]`); if (e) e.textContent = v; }
    function escapeHtml(s){ return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

    function sourceCard(s){
      const received = Number(s.total_received) || 0;
      const spent    = Number(s.total_spent)    || 0;
      const award    = s.award_amount != null ? Number(s.award_amount) : null;
      const remaining = Number(s.remaining) || 0;
      const unbounded = award == null;

      // Burn percentage:
      //   bounded   → spent / award (cap at 100)
      //   unbounded → spent / max(received, 1) so the bar reflects cash flowing out
      let pct = 0;
      if (unbounded) {
        pct = received > 0 ? Math.min(100, (spent / received) * 100) : 0;
      } else {
        pct = award > 0 ? Math.min(100, (spent / award) * 100) : 0;
      }

      const exhausted = !unbounded && remaining <= 0.005;
      const negative  = unbounded && remaining < -0.005;
      const remCls    = exhausted ? 'exhausted' : (negative ? 'negative' : '');
      const barCls    = exhausted ? 'exhausted' : (unbounded ? 'unbounded' : '');

      const awardLine = unbounded
        ? `<span class="award unbounded">Unbounded</span>`
        : `<span class="award">${fmtUSD(award)} award</span>`;

      const startedLine = s.started_at
        ? `<div class="started">Started ${new Date(s.started_at).toLocaleDateString('en-US', { month:'short', day:'2-digit', year:'numeric' })}</div>`
        : '';

      const subLine = unbounded
        ? `${fmtUSD(received)} in · ${fmtUSD(spent)} out · ${remaining >= 0 ? '+' : '−'}${fmtUSD(Math.abs(remaining))} net`
        : `${fmtUSD(spent)} spent of ${fmtUSD(award)}`;

      const pctLine = unbounded
        ? `<span>${pct.toFixed(0)}% spent of received</span><span>${remaining >= 0 ? '+' : '−'}${fmtUSDCompact(Math.abs(remaining))} net</span>`
        : `<span>${pct.toFixed(1)}% used</span><span>${(100 - pct).toFixed(1)}% left</span>`;

      return `<div class="card fs-card ${s.is_active ? '' : 'fs-inactive'}">
        <div class="slug-row">
          <div class="name">${escapeHtml(s.display_name)}</div>
          ${awardLine}
        </div>
        <div class="remaining ${remCls}">${remaining < -0.005 ? '-' : ''}${fmtUSDCompact(Math.abs(remaining))}${unbounded ? '' : ' left'}</div>
        <div class="sub">${subLine}</div>
        <div class="fs-bar ${barCls}"><div class="fill" style="width:${pct}%"></div></div>
        <div class="pct-row">${pctLine}</div>
        ${startedLine}
        <div class="actions">
          <a href="/admin/finance/transactions.html?funding_source=${encodeURIComponent(s.slug)}">View transactions</a>
          ${s.slug === '1789_fund' ? `<a href="/admin/finance/fund.html">1789 deep dive</a>` : ''}
        </div>
      </div>`;
    }

    async function load(){
      const { data, error } = await sb.from('v_funding_balance').select('*');
      if (error){ toast('Failed to load', 'err'); return; }
      const rows = data || [];

      // Roll-up totals across ACTIVE sources only (retired sources shouldn't count toward "available")
      const active   = rows.filter(r => r.is_active);
      const inactive = rows.filter(r => !r.is_active);

      const totalReceived = active.reduce((a, r) => a + (Number(r.total_received) || 0), 0);
      const totalSpent    = active.reduce((a, r) => a + (Number(r.total_spent)    || 0), 0);
      const totalRemain   = active.reduce((a, r) => a + (Number(r.remaining)      || 0), 0);

      setK('t_received',  fmtUSD(totalReceived));
      setK('t_spent',     fmtUSD(totalSpent));
      setK('t_remaining', fmtUSD(totalRemain));
      setK('t_sources',   active.length);
      setK('t_sources_sub', `${inactive.length} retired`);

      document.getElementById('fs-active').innerHTML   = active.length   ? active.map(sourceCard).join('')   : `<div class="empty" style="grid-column:1/-1;">No active funding sources.</div>`;
      document.getElementById('fs-inactive').innerHTML = inactive.length ? inactive.map(sourceCard).join('') : '';
      document.getElementById('inactive-header').style.display = inactive.length ? 'block' : 'none';
    }

    // Realtime: refresh on any change to transactions OR the lookup table
    subscribeTable('financial_transactions', () => {
      indicator.textContent = 'Live · updated';
      load().then(() => setTimeout(() => indicator.textContent = 'Live · syncing', 1600));
    });
    subscribeTable('funding_sources', () => load());

    await load();
    indicator.textContent = 'Live · syncing';
  </script>
</body>
</html>
